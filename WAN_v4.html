        if (n.vendor === "Genérico" && ["Router","Switch","Switch capa 3","Firewall"].includes(n.type)) fail(t("Elija un fabricante compatible para este rol."));
        if (n.vendor === "Fortinet" && n.type !== "Firewall") fail(t("Fortinet requiere tipo Firewall."));
        if (n.vendor === "MikroTik" && n.type !== "Router") fail(t("MikroTik requiere tipo Router."));
        if (["Cisco","Huawei"].includes(n.vendor) && n.type === "Firewall") fail(t("El adaptador IOS/VRP no implementa firewall."));
      }
      /**
       * Entradas: Plan confirmado, inventario, perfiles y entidades existentes.
       * Proceso / salida: Valida perfiles/capacidad; genera por clave, conserva IDs y manuales, prueba el candidato completo y solo después lo adopta.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function buildTopology() {
        safe(() => {
          requireConfirmedPlan();
          if (
            state.nodes.length &&
            !confirm(t("¿Regenerar equipos automáticos conservando los manuales?"))
          )
            return;
          // Un perfil incompleto se bloquea antes de sustituir ningún nodo.
          for (const site of state.sites) {
            const profile=vendorProfile(site), proposed=proposal(site);
            for (const role of ["router","core","access",...(proposed.distribution ? ["distribution"] : [])])
              if (!profile[role]) fail(t("Sede {0}: elija fabricante para {1}.",[site.name,t(role)]));
          }
          const estimatedNodes = state.sites.reduce((total, s) => {
            const p = proposal(s),
              c = counts(s);
            return (
              total +
              1 +
              p.core +
              p.distribution +
              p.access +
              c.ap +
              c.servers +
              Math.min(c.pc, 3) + Math.min(c.cameras,3) + Math.min(c.printers,3) + (vendorProfile(s).firewall?1:0) + (vendorProfile(s).backupRouter?1:0)
            );
          }, 0);
          if (estimatedNodes > 500)
            fail(
              t("El inventario supera 500 nodos gráficos. Reduzca AP/servidores del laboratorio o diseñe menos sedes por archivo."),
            );
          const nodes = [],
            links = [];
          const oldNodes=state.nodes, oldLinks=state.links;
          let nid = Math.max(0,...oldNodes.map(n => {const value=Number(n.id.match(/^n(\d+)$/)?.[1]);return value<60000?value:0;}))+1,
            lid = Math.max(0,...oldLinks.map(l => Number(l.id.match(/^l(\d+)$/)?.[1])||0))+1;
          const ordinals=new Map();
          const add = (name, type, site, x, y, extra = {}) => {
            const siteData=state.sites.find(s => s.id===site), profile=vendorProfile(siteData);
            const role=type==="Router" ? (name.startsWith("BACKUP")?"backupRouter":"router") : type==="Switch capa 3" ? "core" : type==="Firewall" ? "firewall" : type==="Switch" ? (name.startsWith("DIST")?"distribution":"access") : "endpoint";
            const counterKey=site+":"+role+":"+type, ordinal=(ordinals.get(counterKey)||0)+1;
            ordinals.set(counterKey,ordinal);
            const autoKey=counterKey+":"+ordinal, previous=oldNodes.find(n => n.autoKey===autoKey);
            const prefix=type==="Router" ? "RTR" : type==="Switch capa 3" ? "SW-CORE" : type==="Switch" ? (role==="distribution"?"SW-DIST":"SW-ACC") : type==="Firewall"?"FW":type==="Access Point"?"AP":type==="Servidor"?"SRV":type==="Cámara"?"CAM":type==="Impresora"?"PRN":"PC";
            const n = {
              id: previous?.id || "n" + nid++,
              autoKey,
              name: previous?.nameOverride ? previous.name : hostname(prefix+"-"+siteCode(siteData)+"-"+String(ordinal+(role==="backupRouter"?1:0)).padStart(2,"0")),
              ...(previous?.interfaceProfiles ? {interfaceProfiles:structuredClone(previous.interfaceProfiles)}:{}),
              ...(previous?.modelId ? {modelId:previous.modelId}:{}),
              ...(previous?.nameOverride ? {nameOverride:true}:{}),
              ...(previous?.vendorOverride ? {vendorOverride:true}:{}),
              type,
              vendor: previous?.vendorOverride ? previous.vendor : role==="endpoint" ? "Genérico" : profile[role],
              site,
              ip: "",
              network: "",
              x,
              y,
              ...extra,
            };
            nodes.push(n);
            return n;
          };
          const connect = (a, b, type, key = "", vlan = 0) => {
            const ia =
                links.filter((l) => l.a === a.id || l.b === a.id).length + 1,
              ib = links.filter((l) => l.a === b.id || l.b === b.id).length + 1;
            const former=oldLinks.find(l=>l.a===a.id&&l.b===b.id&&l.type===type&&l.network===key);
            links.push({
              id: oldLinks.find(l=>l.a===a.id && l.b===b.id && l.type===type && l.network===key)?.id || "l" + lid++,
              a: a.id,
              b: b.id,
              type,
              network: key,
              vlan,
              bundle: 0,
              ac: a.modelId&&former?.ac || "GigabitEthernet0/" + ia,
              bc: b.modelId&&former?.bc || "GigabitEthernet0/" + ib,
              ah: a.modelId&&former?.ah || "GigabitEthernet0/0/" + ia,
              bh: b.modelId&&former?.bh || "GigabitEthernet0/0/" + ib,
              af: a.modelId&&former?.af || (a.vendor==="Fortinet" ? "port"+ia : ""), bf: b.modelId&&former?.bf || (b.vendor==="Fortinet" ? "port"+ib : ""),
              am: a.modelId&&former?.am || (a.vendor==="MikroTik" ? "ether"+ia : ""), bm: b.modelId&&former?.bm || (b.vendor==="MikroTik" ? "ether"+ib : ""),
            });
          };
          const routers = [];
          let maxHeight = 600;
          for (let i = 0; i < state.sites.length; i++) {
            const s = state.sites[i],
              p = proposal(s),
              c = counts(s),
              x = 40 + i * 600,
              router = add("R-" + (i + 1), "Router", s.id, x + 220, 85);
            routers.push(router);
            const cores = [];
            for (let k = 0; k < p.core; k++) {
              const core = add(
                "CORE-" + (i + 1) + "-" + (k + 1),
                "Switch capa 3",
                s.id,
                x + 120 + k * 220,
                220,
              );
              cores.push(core);
              connect(router, core, "routed", "t-" + s.id + "-" + k);
            }
            if (cores.length === 2) connect(cores[0], cores[1], "trunk");
            const profile=vendorProfile(s);
            if (profile.firewall) {
              if (!row("f-"+s.id)) fail(t("Recalcule VLAN para crear los tránsitos opcionales."));
              const firewall=add("FW", "Firewall",s.id,x+220,20);
              connect(firewall,router,"routed","f-"+s.id);
            }
            if (profile.backupRouter) {
              const backup=add("BACKUP", "Router",s.id,x+420,85);
              cores.forEach((core,k) => {
                if (!row("b-"+s.id+"-"+k)) fail(t("Recalcule VLAN para crear los tránsitos opcionales."));
                connect(backup,core,"routed","b-"+s.id+"-"+k);
              });
            }
            const dist = [];
            for (let k = 0; k < p.distribution; k++) {
              const d = add(
                "DIST-" + (i + 1) + "-" + (k + 1),
                "Switch",
                s.id,
                x + 40 + (k % 3) * 175,
                360 + Math.floor(k / 3) * 100,
              );
              dist.push(d);
              cores.forEach((core) => connect(core, d, "trunk"));
            }
            const acc = [];
            let accessY = dist.length
              ? 480 + Math.floor((dist.length - 1) / 3) * 100
              : 370;
            for (let k = 0; k < p.access; k++) {
              const a = add(
                "ACC-" + (i + 1) + "-" + (k + 1),
                "Switch",
                s.id,
                x + 20 + (k % 3) * 180,
                accessY + Math.floor(k / 3) * 100,
              );
              acc.push(a);
              if (dist.length) connect(dist[k % dist.length], a, "trunk");
              else cores.forEach((core) => connect(core, a, "trunk"));
            }
            const endpointY = accessY + Math.ceil(acc.length / 3) * 100 + 20;
            let ek = 0;
            const endpoint = (name, type, role, quantity) => {
              const nets = state.plan.filter(
                (r) => r.site === s.id && r.kind === "vlan" && r.role === role,
              );
              if (!nets.length || !quantity) return;
              for (let k = 0; k < quantity; k++) {
                const r = nets[k % nets.length],
                  n = add(
                    name + "-" + (i + 1) + "-" + (k + 1),
                    type,
                    s.id,
                    x + 20 + (ek % 3) * 180,
                    endpointY + Math.floor(ek / 3) * 100,
                    { network: r.key },
                  );
                connect(
                  acc[ek % acc.length],
                  n,
                  type === "Access Point" ? "trunk" : "access",
                  "",
                  r.id,
                );
                ek++;
              }
            };
            endpoint("AP", "Access Point", "Gestión", c.ap);
            endpoint("SRV", "Servidor", "Servidores", c.servers);
            endpoint("CAM", "Cámara", "CCTV", Math.min(c.cameras,3));
            endpoint("PRN", "Impresora", "Impresoras", Math.min(c.printers,3));
            endpoint(
              "PC",
              "PC",
              state.plan.some((r) => r.site === s.id && r.role === "Clínica")
                ? "Clínica"
                : "Datos",
              Math.min(c.pc, 3),
            );
            const nets = state.plan.filter(
              (r) => r.site === s.id && r.kind === "vlan",
            );
            for (const r of nets) {
              const assigned = nodes.filter(
                (n) =>
                  n.site === s.id &&
                  (n.network === r.key ||
                    (r.role === "Gestión" && n.type === "Switch")),
              );
              const physical =
                cores.length === 2 ? availableIPs(r, 2) : [r.gateway];
              const ips = availableIPs(r, assigned.length, physical);
              assigned.forEach((n, j) => {
                n.ip = ips[j];
                n.network = r.key;
              });
            }
            maxHeight = Math.max(
              maxHeight,
              endpointY + Math.ceil(ek / 3) * 100 + 60,
            );
          }
          if (nodes.length > 500)
            fail(
              t("Más de 500 equipos: reduzca inventario para representar esta topología en pantalla."),
            );
          if (state.project.interconnect)
            routers
              .slice(1)
              .forEach((r, i) =>
                connect(routers[0], r, "routed", "w-" + state.sites[i + 1].id),
              );
          // Las entidades manuales no se eliminan al reorganizar/regenerar.
          const manual=oldNodes.filter(n => !n.autoKey);
          if (manual.some(n => nodes.some(g => g.name===n.name))) fail(t("Nombre automático en conflicto con un equipo manual."));
          const allNodes=[...nodes,...manual];
          if (allNodes.length>500) fail(t("Más de 500 equipos: reduzca inventario para representar esta topología en pantalla."));
          const candidate={...state,nodes:allNodes,links:[...links,...oldLinks.filter(l => manual.some(n => n.id===l.a || n.id===l.b) && allNodes.some(n => n.id===l.a) && allNodes.some(n => n.id===l.b))],configs:{}};
          const previous=state;
          // Validación transaccional del conjunto, incluyendo equipos manuales.
          try {
            candidate.links=assignCatalogInterfaces(candidate);validateCatalogBindings(candidate);
            state=candidate; arrangeTopology(false);
            const blocking=topologyIssues().find(x=>x.block);
            if (blocking) fail(t(blocking.msg));
          } catch(error) { state=previous; throw error; }
          refreshPhysicalProfiles();
          state.revision++;
          selectedNode = "";
          render();
          toast(t("Topología construida con las VLAN y subredes confirmadas."));
        });
      } // Cada enlace routed consume exactamente una red /30 del plan.
      /**
       * Entradas: Estado gráfico, imagen y perfiles.
       * Proceso / salida: Devuelve lienzo desplazable, zoom, editores y tablas de detalles técnicos sin sustituir datos.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function topologyView() {
        return (
          title(
            t("Topología de red"),
            "El gráfico muestra sedes, equipos, VLAN y redes del plan. Arrastre un equipo para moverlo; haga clic para editarlo. Los enlaces WAN representan un laboratorio enrutado.",
          ) +
          vendorProfilesView() + catalogControls() + `<div class="card"><div class="actions"><button onclick="arrangeTopology()">${t("Reorganizar diagrama")}</button><button onclick="zoomTopology(1.2)">${t("Acercar")}</button><button onclick="zoomTopology(0.833333)">${t("Alejar")}</button><button class="primary" onclick="buildTopology()">${t("Generar desde el plan")}</button><button onclick="editNode()">${t("Agregar equipo")}</button><button onclick="editLink()">${t("Crear enlace")}</button><button onclick="downloadSVG()">${t("Descargar topología SVG")}</button><button ${!imageMode ? "disabled" : ""} onclick="imageMode=false;render()">${t("Vista automática")}</button><label class="filebtn" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.querySelector('input').click()}">${t("Cargar imagen")}<input type="file" class="hidden" accept="image/png,image/jpeg,image/webp" onchange="loadImage(this)"></label>${imageData ? `<button onclick="imageMode=!imageMode;render()">${t("Ver / ocultar imagen")}</button>` : ""}</div><div class="notice warn">${t("Diseño preliminar: se recomiendan")} ${state.sites.length} ${t("firewalls recomendados. El perfil permite añadirlos con enlaces de tránsito explícitos; no crea Internet, NAT ni VPN. Los terminales son representativos. La configuración de AP se completa en su controlador.")}</div>${imageData && imageMode ? `<div class="notice">${t("Interpretación asistida manual: marque equipos y enlaces con los editores usando esta imagen como referencia. El HTML local no incluye un modelo de visión ni OCR y no afirma haber reconocido dispositivos automáticamente. La imagen no se transmite a ningún servidor.")}</div><div class="imageframe"><img src="${imageData}" alt="${t("Topología importada como referencia")}"></div>` : ""}<p class="hint">${t("WAN: violeta · ROUTED: turquesa · TRUNK: naranja · ACCESS: verde discontinuo. Pase el cursor sobre un enlace para consultar su red; los detalles completos están en las tablas.")}</p><div class="diagram">${state.nodes.length ? svgTopology() : `<div class="empty">${t("Confirme el VLSM y pulse «Generar desde el plan», o agregue equipos manualmente.")}</div>`}</div></div><div class="two"><div class="card"><h2>${t("Equipos ·")} ${state.nodes.length}</h2><div class="tablewrap"><table><thead><tr><th>${t("Nombre / sede")}</th><th>${t("Tipo")}</th><th>${t("Fabricante / IP")}</th><th>${t("Acción")}</th></tr></thead><tbody>${state.nodes
            .map(
              (n) =>
                `<tr><td>${esc(n.name)}<br><small>${esc(siteName(n.site))}</small></td><td>${t(n.type)}</td><td>${esc(t(n.vendor))}<br><span class="mono">${esc(
                  n.ip ||
                    connected(n)
                      .filter((l) => l.type === "routed")
                      .map((l) => endpoint(l, n, n.vendor).ip)
                      .join(" · ") ||
                    t("Interfaces / SVI"),
                )}</span></td><td><button class="small" onclick="editNode('${n.id}')">${t("Editar")}</button> <button class="small danger" aria-label="${t("Eliminar equipo")}" title="${t("Eliminar equipo")}" onclick="deleteNode('${n.id}')">${t("×")}</button></td></tr>`,
            )
            .join(
              "",
            )}</tbody></table></div></div><div class="card"><h2>${t("Enlaces ·")} ${state.links.length}</h2><div class="tablewrap"><table><thead><tr><th>${t("Extremos")}</th><th>${t("Tipo / red")}</th><th>${t("Acción")}</th></tr></thead><tbody>${state.links.map((l) => `<tr><td>${esc(node(l.a)?.name)} ↔ ${esc(node(l.b)?.name)}</td><td>${l.type}${l.bundle ? " · LACP " + l.bundle : ""}<br><small>${l.network ? row(l.network)?.network + "/" + row(l.network)?.prefix : l.type === "access" ? "VLAN " + l.vlan : t("VLAN permitidas de sede")}</small></td><td><button class="small" onclick="editLink('${l.id}')">${t("Editar")}</button> <button class="small danger" aria-label="${t("Eliminar enlace")}" title="${t("Eliminar enlace")}" onclick="deleteLink('${l.id}')">${t("×")}</button></td></tr>`).join("")}</tbody></table></div></div></div>`
        );
      }
      // Código de sede derivado del nombre; el ID solo desambigua colisiones.
      /**
       * Entradas: Nombre real de sede e ID estable.
       * Proceso / salida: Normaliza caracteres, deriva iniciales/números y agrega ID solo cuando hay colisión entre sedes.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function siteCode(site) {
        const make = name => {
          const parts=name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().match(/[A-Z0-9]+/g)||["SITE"];
          const useful=parts.filter(x => !["SEDE","SITE","DE","LA","EL"].includes(x));
          return (useful.length ? useful : parts).map(x => /^\d+$/.test(x)?x:x[0]).join("").slice(0,12);
        };
        const code=make(site.name);
        return state.sites.filter(s => make(s.name)===code).length>1 ? code+"-"+site.id.replace(/[^A-Za-z0-9]/g,"").slice(-8) : code;
      }
      let topologyZoom=1;
      // Solo posiciones: no modifica identidades, redes, enlaces ni CLI.
      /**
       * Entradas: Equipos existentes y opción de renderizar.
       * Proceso / salida: Ordena por sede, jerarquía e ID; cambia únicamente coordenadas y nunca borra entidades.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function arrangeTopology(refresh=true) {
        const level=n => n.type==="Firewall"?0:n.type==="Router"?1:n.type==="Switch capa 3"?2:n.type==="Switch"?(n.autoKey?.includes(":distribution:")?3:4):5;
        for (let i=0;i<state.sites.length;i++) {
          let y=100;
          for (let tier=0;tier<=5;tier++) {
            const nodes=state.nodes.filter(n => n.site===state.sites[i].id && level(n)===tier).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
            nodes.forEach((n,j)=>{ n.x=i*1040+45+(j%4)*245; n.y=y+Math.floor(j/4)*155; });
            if (nodes.length) y+=Math.ceil(nodes.length/4)*155+70;
          }
        }
        if (refresh) render();
      }
      /**
       * Entradas: Factor solicitado por botones.
       * Proceso / salida: Limita escala entre 0,25 y 3; modifica solo ancho visual del SVG, sin cambiar coordenadas del modelo.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function zoomTopology(factor) { topologyZoom=Math.max(.25,Math.min(3,topologyZoom*factor)); const svg=$("toposvg"); if(svg) svg.style.width=(Number(svg.dataset.width)*topologyZoom)+"px"; }
      // Iconos vectoriales originales, sin fuentes ni imágenes de terceros.
      /**
       * Entradas: Tipo de equipo de la lista permitida.
       * Proceso / salida: Devuelve trazados SVG originales embebidos; no utiliza fuentes, Internet ni recursos protegidos.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function deviceIcon(type) {
        const paths={
          Router:'<ellipse cx="19" cy="18" rx="17" ry="12"/><path d="M7 18h24m-8-5 8 5-8 5m-8-10-8 5 8 5"/>',
          Switch:'<rect x="2" y="9" width="34" height="20" rx="3"/><path d="M7 15h4m4 0h4m4 0h4m4 0h3M7 23h4m4 0h4m4 0h4"/>',
          "Switch capa 3":'<rect x="2" y="9" width="34" height="20" rx="3"/><path d="M7 15h24M12 21h14m-10-4-4 4 4 4m6-8 4 4-4 4"/>',
          Firewall:'<path d="M3 5h32v29H3zM3 15h32M3 25h32M13 5v10m12 0v10M13 25v9"/>',
          Servidor:'<rect x="7" y="2" width="24" height="34" rx="3"/><path d="M11 10h16M11 18h16M11 27h10"/>',
          PC:'<path d="M3 5h32v23H3zM19 28v7M10 35h18"/>',
          "Cámara":'<path d="M3 10h24v18H3zM27 15l9-5v18l-9-5M12 28v7"/>',
          Impresora:'<path d="M9 12V3h20v9M3 12h32v18H3zM9 22h20v14H9z"/>',
          "Access Point":'<path d="M4 27h30v8H4zM19 26V15M10 17q9-9 18 0M4 10q15-15 30 0"/>'
        };
        return `<g stroke="currentColor" stroke-width="1.8" fill="none">${paths[type]||paths.PC}</g>`;
      }
      /**
       * Entradas: Nodos, enlaces, posiciones y plan actual.
       * Proceso / salida: Devuelve SVG autónomo con iconos, carriles, títulos y detalles escapados; sirve para pantalla y descarga.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function svgTopology() {
        const w=Math.max(1040,state.sites.length*1040,...state.nodes.map(n=>n.x+230)),
          h=Math.max(550,...state.nodes.map(n=>n.y+145));
        let out=`<svg id="toposvg" data-width="${w}" style="width:${w*topologyZoom}px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${t("Topología de red")}"><rect width="100%" height="100%" fill="#f4f8fc"/>`;
        state.sites.forEach((site,i)=>{out+=`<rect x="${i*1040+8}" y="55" width="1024" height="${h-65}" rx="16" fill="#e9f1f7" stroke="#b5cad8"/><text x="${i*1040+28}" y="83" font-size="18" fill="#16354f">${esc(site.name)}</text>`;});
        state.links.forEach((l,i)=>{
          const a=node(l.a),b=node(l.b);if(!a||!b)return;
          const wan=a.site!==b.site, color=wan?"#8748b6":l.type==="routed"?"#168592":l.type==="trunk"?"#d68513":"#547a54";
          const x1=a.x+195,x2=b.x+195,y1=a.y+43,y2=b.y+43,
            gutter1=x1+10+(i%4)*6,gutter2=x2+10+(i%4)*6;
          // Los carriles quedan fuera de las cajas, incluso al saltar niveles.
          const lane=wan?18:Math.max(a.y,b.y)+104+(i%7)*6;
          const label=wan?"WAN ":l.type.toUpperCase()+" ", detail=l.type==="routed"?(row(l.network)?.network||"?")+"/30":l.type==="access"?"V"+l.vlan:"802.1Q";
          const path=x1===x2 ? `M${x1} ${y1} H${gutter1} V${y2} H${x2}` : `M${x1} ${y1} H${gutter1} V${lane} H${gutter2} V${y2} H${x2}`;
          out+=`<g><title>${esc(a.name+" ↔ "+b.name+" · "+label+detail)}</title><path d="${path}" fill="none" stroke="${color}" stroke-width="${wan?3:2}" ${l.type==="access"?'stroke-dasharray="4 3"':""}/>${state.links.length<=12 || wan ? `<text x="${(gutter1+gutter2)/2}" y="${lane-5}" text-anchor="middle" font-size="10" fill="${color}" stroke="#f4f8fc" stroke-width="3" paint-order="stroke">${esc(label+detail)}</text>` : ""}</g>`;
        });
        for(const n of state.nodes) {
          const ip=n.ip||connected(n).filter(l=>l.type==="routed").map(l=>endpoint(l,n,n.vendor).ip).filter(Boolean).join(" · ");
          // El título accesible conserva detalles completos cuando la etiqueta abrevia.

      function bindDrag() {

          `<div class="notice warn">${t("Mapee puertos MikroTik reales en Topología y deje IP/red del nodo vacíos. Solo Router; bridge/VLAN filtering para LAN, /30 para enlaces enrutados. No se modelan VRRP, LACP, VRF, CAPsMAN, IPv6 ni NAT. No reclame gateways de cores u otros routers/firewalls. SSH solo desde Gestión; MAC y servicios innecesarios deshabilitados. Sin permisos de tráfico explícitos se bloquea forward: revise políticas antes de uso. Cuentas/claves y configuración existente requieren revisión externa. Las opciones de OSPF/DHCP/relay/ruta son compartidas entre fabricantes.")}</div>` + mikrotikControls() + catalogControls("MikroTik") +
          `<div class="card"><div class="actions"><select id="confNode" aria-label="${t("Equipo a configurar")}">${nodes.map((n) => `<option value="${n.id}">${esc(n.name)}</option>`).join("")}</select><button class="primary" onclick="generateSelected('MikroTik')">${t("Generar equipo")}</button><button onclick="generateAll('MikroTik')">${t("Generar todos los MikroTik")}</button><button onclick="downloadAll('MikroTik')">${t("Descargar todos")}</button></div>${nodes.length ? nodes.map((n) => configBlock(n, "MikroTik")).join("") : `<div class="empty">${t("Añada un Router MikroTik y sus enlaces explícitos en Topología.")}</div>`}</div>`;

      function trunkCommands(c, lan) {

          ? [
              "switchport mode trunk",

      } // Mantiene separadas las sintaxis de los fabricantes.
      function wildcard(mask) {
        return ipStr(4294967295 - ipNum(mask));
      } // Masque inversé exact utilisé pour OSPF.
      function generateSelected(vendor) {
        if (vendor === "MikroTik") return generateMikroTikFromForm(false);
        if (vendor === "Fortinet") return generateFortinetFromForm(false);

            text: result,
            revision: state.revision,

      } // Ne marque une configuration comme générée qu'après succès.
      function generateAll(vendor) {

        if (vendor === "Fortinet") return generateFortinetFromForm(true);

      } // Génération atomique de la marque entière.
      function configBlock(n, v) {

        return `<div style="margin-top:24px"><div class="headingrow"><h3>${esc(n.name)} · ${v}</h3><div class="actions"><button class="small" onclick="copyConfig('${n.id}','${v}')">${t("Copier configuration")}</button><button class="small" onclick="downloadConfig('${n.id}','${v}')">${t("Télécharger")}</button></div></div><pre class="console">${esc(item.text)}</pre></div>`;
      } // Les sorties CLI sont affichées comme texte, jamais interprétées en HTML.
      function compareView() {

        return (

          ) +
          configControls() + `<p class="notice warn">${t("Comparación: el modelo solo se aplica a su fabricante real. La otra sintaxis usa interfaces genéricas; no certifica un equipo equivalente.")}</p>` +
          `<div class="card"><div class="actions"><select aria-label="${t("Équipe pour comparaison")}" onchange="selectedNode=this.value;render()">${ns.map((x) => `<option value="${x.id}" ${n?.id === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select><button class="primary" onclick="generateCompare('${n?.id || ""}')">${t("Générer les deux syntaxes")}</button></div></div>${n ? `<div class="two"><div>${configBlock(n, "Cisco") || `<div class="card empty">${t("Cisco · en attente de génération")}</div>`}</div><div>${configBlock(n, "Huawei") || `<div class="card empty">${t("Huawei · en attente de génération")}</div>`}</div></div>` : `<div class="card empty">${t("Une topologie est requise.")}</div>`}`
        );
      } // Comparaison sans changer le fabricant du dispositif réel.
      function generateCompare(id) {
        if (changeOpts() === false) return;
        safe(() => {

          if (!n) fail(t("Sélectionnez un équipement."));

      } // Les deux résultats correspondent au même équipement et aux mêmes réseaux.
      async function copyConfig(id, v) {
        const item = state.configs[id + "-" + v];
        if (!item) return toast(t("Genere las configuraciones antes de descargar."), true);
        try {

            );

      } // Repli fonctionnel lorsque Clipboard API n'est pas disponible sous file://.
      function downloadConfig(id, v) {

      } // Export par hostname et marque.
      function downloadAll(v) {

      } // Un seul fichier contient des blocs nommés pour tous les équipements générés.
      /* =================== Cohérence, ciberdéfense et tableau de bord =================== */
      function topologyIssues() {
        const out = [],
          warn = (msg, block = false) => out.push({ msg, block });
        for (let i = 0; i < state.plan.length; i++) {
          const r = state.plan[i];
          if (r.kind === "vlan" && !isHost(r.gateway, r))
            warn("Gateway invalide pour " + r.name, true);
          for (let j = i + 1; j < state.plan.length; j++) {
            const b = state.plan[j];
            if (r.net <= b.end && b.net <= r.end)
              warn("Solapamiento " + r.name + " / " + b.name, true);
          }
        }
        for (const n of state.nodes) {
          if (!connected(n).length) warn(n.name + " sin enlaces.");
          if (mikrotikNode(n) && connected(n).length) {
            try { mikrotikInterfaces(n); } catch (e) { warn(e.message, true); }
          }
          if (n.type === "Switch" && !n.ip)
            warn(n.name + " sin dirección de gestión.");
          if (n.type === "Switch capa 3") {
            const cores = state.nodes.filter(
              (x) => x.site === n.site && x.type === n.type,
            );
            if (cores.length === 2 && cores[0].vendor !== cores[1].vendor)
              warn(
                "Cores con fabricantes distintos en " +
                  siteName(n.site) +
                  ": HSRP y VRRP no forman un mismo grupo.",
                true,
              );
            if (
              cores.length !==
              (state.sites.find((s) => s.id === n.site).redundant ? 2 : 1)
            )
              warn(
                "Cantidad de cores incoherente en " +
                  siteName(n.site) +
                  ". Regenere desde el plan.",
                true,
              );
          }
          if (n.ip) {
            const r = row(n.network);
            if (!r || !isHost(n.ip, r))
              warn("IP fuera de red: " + n.name, true);
            else if (
              state.sites.find((s) => s.id === r.site)?.redundant &&
              availableIPs(r, 2).includes(n.ip)
            )
              warn("IP física de core usada por " + n.name, true);
            if (state.nodes.some((x) => x.id !== n.id && x.ip === n.ip))
              warn("IP duplicada: " + n.ip, true);
          }
        }
        for (const l of state.links) {
          try {
            validateLink(
              l,
              state.links.filter((x) => x.id !== l.id),
            );
            if (l.type === "routed" && !l.network)
              warn("Enlace sin red /30.", true);
          } catch (e) {
            warn(e.message, true);
          }
        }
        const groups = new Map();
        for (const l of state.links.filter((l) => l.bundle)) {
          const key = [l.a, l.b].sort().join("-") + "-" + l.bundle;
          groups.set(key, (groups.get(key) || 0) + 1);
        }
        for (const [key, n] of groups)
          if (n < 2)
            warn("Grupo LACP " + key + " requiere al menos dos enlaces.", true);
        return out;
      } // Validación transversal, independiente del gráfico.
      function securityWarnings() {
        const out = topologyIssues().map((x) => x.msg);
        if (!state.opts.ssh)
          out.push("SSH / STelnet deshabilitado en la propuesta.");
        if (state.opts.static)
          out.push(
            "Ruta 0.0.0.0/0: " +
              (state.staticReason || t("sin justificación")) +
              ".",
          );
        if (state.nodes.length)
          out.push(
            "SSH se restringe al origen de la VLAN Gestión cuando existe. Los trunks y la ACL administrativa no aíslan el tráfico entre servicios; completar reglas de firewall.",
          );
        if (state.sites.length > 1 && state.project.interconnect)
          out.push(
            "WAN de laboratorio sin cifrado: en producción requiere VPN/MPLS/SD-WAN y contrato del ISP.",
          );
        if (Object.keys(state.configs).length)
          out.push(
            "Los marcadores de secretos no son credenciales válidas; sustitúyalos fuera de esta herramienta.",
          );
        if (state.sites.some((s) => s.redundant) && state.opts.dhcp)
          out.push(
            "DHCP se configura solo en el core primario. HSRP/VRRP no replica concesiones DHCP.",
          );
        for (const item of Object.values(state.configs)) {
          if (
            /transport input.*telnet|protocol inbound.*telnet|(?<!undo )telnet server enable/i.test(
              item.text,
            )
          )
            out.push("Se detectó Telnet habilitado.");
          if (
            /(?:secret|password|token|api.key)\s+(?!<CAMBIAR_EN_PRODUCCION>)(?:\S+)/i.test(
              item.text.replace(
                /username operador privilege 1 secret <CAMBIAR_EN_PRODUCCION>|local-user operador password irreversible-cipher <CAMBIAR_EN_PRODUCCION>|ssh user operador authentication-type password/g,
                "",
              ),
            )
          )
            out.push(
              "Revisar texto de autenticación: posible secreto literal.",
            );
        }
        return [...new Set(out)];
      } // Advertencias reales derivadas de opciones y textos generados.
      const policies = [
        "La herramienta no solicita ni guarda contraseñas, tokens, API keys o claves privadas. Las configuraciones contienen marcadores de sustitución.",
        "En una arquitectura futura con backend, administrar secretos externamente mediante variables de entorno o un gestor de secretos.",
        "Con IA pública utilizar únicamente datos de laboratorio o de ejemplo.",

        "Aplicar mínimo privilegio; el usuario SSH propuesto comienza en nivel 1.",
        "Tratar la salida de IA como propuesta técnica y verificarla antes de implementar.",
      ]; // Políticas solicitadas, visibles en la aplicación.
      function securityView() {

        );
      } // Enlaces de consulta opcionales; la aplicación funciona sin red.
      function dashboard() {

        return (

            )}<div class="statusrow"><span>${t("Advertencias de seguridad")}</span><span class="badge warn">${warnings.length}</span></div></div><div class="actions" style="margin-top:18px"><button class="primary" onclick="go(1)">${t("Continuar diseño →")}</button><button onclick="downloadReport()">${t("Descargar resumen HTML")}</button><button onclick="window.print()">${t("Imprimir / PDF")}</button></div></div><div class="card"><h2>${t("Sedes del proyecto")}</h2>${state.sites.map((s) => `<div class="statusrow"><div><strong>${esc(s.name)}</strong><br><small>${s.users} ${t("usuarios ·")} ${s.floors} ${t("pisos ·")} ${proposal(s).bandwidth} ${t("Mbps sugeridos")}</small></div><span class="badge dim">${s.redundant ? t("2 cores") : t("1 core")}</span></div>`).join("")}<div class="notice">${t("Las cantidades son estimaciones preliminares. Los equipos representativos del gráfico y los comandos generados se cuentan por separado del inventario.")}</div></div></div><div class="card"><h2>${t("Ruta de trabajo")}</h2><div class="grid">${[
            ["01", "Levantamiento", t("Usuarios y servicios por sede.")],

        );
      } // Resume hechos calculados, no pruebas de producción.
      function download(name, content, mime) {
        const blob = new Blob([content], { type: mime + ";charset=utf-8" }),
          url = URL.createObjectURL(blob),
          a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      } // Descargas autónomas sin backend.
      function exportJSON() {
        download(
          "WAN-proyecto.json",
          JSON.stringify({ state, imageData }, null, 2),
          "application/json",
        );
        toast(
          t("Proyecto exportado. Guarde este JSON junto al HTML para transportar sus datos."),
        );
      } // Guarda el proyecto completo, con imagen opcional.
      function saveLocal() {
        safe(() => {
          localStorage.setItem(
            "WAN-Architect-v4",

          );

        });
      } // Los errores de cuota/file:// se comunican; JSON ofrece una copia alternativa.
      function loadLocal() {
        safe(() => {
          const raw =
            localStorage.getItem("WAN-Architect-v4") ??
            localStorage.getItem("WAN-Architect-v3") ??
            localStorage.getItem("WAN-Architect-v2");
          if (raw === null) fail(t("No hay proyecto guardado en este navegador."));
          const parsed = validateImport(JSON.parse(raw));
          if (!confirm(t("¿Reemplazar el proyecto actual por el guardado?")))
            return;
          applyImport(parsed);
          toast(t("Proyecto cargado."));
        });
      } // La lectura local pasa por el mismo validador que una importación externa.
      async function importJSON(input) {
        try {
          const file = input.files[0];
          if (!file) return;
          if (file.size > 10 * 1024 * 1024)
            fail(t("JSON demasiado grande (máximo 10 MB)."));
          const parsed = validateImport(JSON.parse(await file.text()));
          if (!confirm(t("¿Reemplazar el proyecto actual por este JSON?"))) return;
          applyImport(parsed);
          toast(t("Proyecto importado y validado."));
        } catch (e) {
          toast(t(e.message), true);
        } finally {
          input.value = "";
        }

      function privateIPv4Block(value, label) {
        label=t(label);
        let block;
        try {
          block = subnet(value);
        } catch (e) {
          fail(t("{0}: bloque IPv4 inválido. {1}", [label, e.message]));

          "Gateway",
          "Primera IP",
          "Última IP",
          "Broadcast",
        ];
        const cell = (x) =>
          '"' +
          String(x ?? "")
            .replace(/"/g, '""')
            .replace(/^([=+@-])/, "\t$1") +
          '"';
        const rows = state.plan.map((r) => [
          siteName(r.site),
          r.id || r.kind,
          r.name,
          r.hostsRequested,
          r.available,
          r.network,
          r.prefix,
          r.mask,
          r.gateway,
          r.first,
          r.last,
          r.broadcast,
        ]);
        download(
          uiLanguage === "en" ? "addressing-plan.csv" : "plan-direccionamiento.csv",
          "\ufeff" +
            [head.map(x => t(x)), ...rows].map((r) => r.map(cell).join(";")).join("\r\n"),
          "text/csv",
        );
      } // CSV compatible con separador regional español y protección de fórmulas.
      function downloadReport() {
        const body =
          dashboard() +
          planTable() +
          `<div class="card"><h2>${t("Topología")}</h2>${state.nodes.length ? svgTopology() : t("No generada")}</div><div class="card"><h2>${t("Advertencias")}</h2><ul>${securityWarnings()
            .map((w) => `<li>${esc(localizeMessage(w))}</li>`)
            .join(
              "",
            )}</ul></div><div class="card"><h2>${t("Configuraciones generadas")}</h2>${Object.entries(
            state.configs,
          )
            .map(
              ([k, v]) =>
                `<h3>${esc(k)}</h3><pre class="console">${esc(v.text)}</pre>`,
            )
            .join("")}</div>`;
        download(
          uiLanguage === "en" ? "WAN-summary.html" : "WAN-resumen.html",
          `<!DOCTYPE html><html lang="${uiLanguage}"><head><meta charset="UTF-8"><title>${t("Resumen WAN")}</title><style>` +
            $("view").ownerDocument.querySelector("style").textContent +
            "main{margin:0}button{display:none}</style></head><body><main>" +
            body +
            "</main></body></html>",
          "text/html",
        );
      } // Informe estático con datos reales del proyecto actual.
      /* Consola opcional: todo estado de sesión es efímero y ajeno a state/JSON. */
      let sshMode="simulation", sshDevice="", sshHistory="", sshSocket=null,
        sshTerminal=null, sshFit=null, sshObserver=null, sshLibrary=null, sshStatusCode="disconnected", sshConnecting=false, sshGeneration=0;
      const sshLabels={disconnected:"Desconectado",connecting:"Conectando",connected:"Conectado",ended:"Sesión finalizada",
        authentication:"Error de autenticación",network:"Error de red",host_key:"Clave de host desconocida o modificada: verifique la huella con el servicio local.",
        unauthorized:"Sesión local no autorizada",destination_denied:"Destino no autorizado por el servicio local",invalid_request:"Solicitud SSH no válida",terminal_unsupported:"El equipo no permite shell/PTY interactivo."};

      /** Cambia solo la pestaña visual; abandonar una sesión real la cierra. */
      function sshTab(mode) { sshMode=mode==="real"?"real":"simulation"; render(); }
      /** Busca una selección estable; jamás cambia marcas o datos del dispositivo. */
      function sshSelected() { return state.nodes.find(n=>n.id===sshDevice)||null; }
      /** Solo IP explícita de Gestión: nunca se infiere desde WAN/SVI/gateway. */
      function sshManagementAddress(n) {
        return n && row(n.network)?.role==="Gestión" && ["Switch","Switch capa 3","Router","Firewall"].includes(n.type) ? n.ip||"" : "";
      }
      /** Renderiza HTML escapado; simulación no descarga librerías ni abre conexiones. */
      function sshConsoleView() {
        const n=sshSelected(), real=sshMode==="real",
          service=location.hostname==="127.0.0.1" && location.protocol==="http:" && !!document.querySelector('meta[name="wan-ssh-service"]');
        const select=`<select id="sshDevice" onchange="sshChooseDevice(this.value)"><option value="">${t("Conexión manual / seleccione equipo")}</option>${state.nodes.map(n=>`<option value="${esc(n.id)}" ${n.id===sshDevice?"selected":""}>${esc(n.name)} · ${esc(n.vendor)}</option>`).join("")}</select>`;
        return title(t("Consola SSH"),t("Simulación educativa y conexión real son independientes. Nunca se aplican configuraciones automáticamente."))+`<p><a href="docs/manual-ssh.md" target="_blank" rel="noopener">${t("Manual de consola SSH")}</a></p>`+
          `<div class="card"><div class="actions" role="tablist" aria-label="${t("Modalidad SSH")}"><button role="tab" aria-selected="${!real}" onclick="sshTab('simulation')">${t("Simulación")}</button><button role="tab" aria-selected="${real}" onclick="sshTab('real')">${t("Conexión real")}</button></div><div class="field"><label for="sshDevice">${t("Dispositivo de la topología")}</label>${select}</div>${n?`<p>${esc(n.name)} · ${esc(n.vendor)} · ${t(n.type)}</p><p class="mono">${esc(connected(n).map(l=>endpoint(l,n,n.vendor).iface||"—").join(" · "))}</p>`:""}
          ${real ? `<div class="notice">${t("La conexión manual no requiere VLSM. Use únicamente equipos autorizados. Cambiar idioma, pestaña o módulo cierra la sesión; no se guarda el historial real.")}</div><div id="sshService" class="notice ${service?"":"warn"}">${t(service?"Servicio local disponible":"Servicio no disponible: inicie Python y abra http://127.0.0.1:8765 (o el puerto configurado).")}</div><div class="grid">${field(t("IP o hostname autorizado"),"sshHost",sshManagementAddress(n))}${field(t("Puerto SSH"),"sshPort",22,"number",'min="1" max="65535"')}${field(t("Usuario SSH"),"sshUser","")}<div class="field"><label for="sshMethod">${t("Autenticación")}</label><select id="sshMethod" onchange="sshAuthMethod()"><option value="password">${t("Contraseña")}</option><option value="key">${t("Clave privada")}</option></select></div><div id="sshPasswordBox" class="field"><label for="sshPassword">${t("Contraseña")}</label><input id="sshPassword" type="password" maxlength="1024" autocomplete="off"></div><div id="sshKeyBox" class="field hidden"><label for="sshPrivateKey">${t("Clave privada (solo memoria)")}</label><textarea id="sshPrivateKey" maxlength="32768" autocomplete="off" spellcheck="false"></textarea><label for="sshPassphrase">${t("Frase de clave (opcional)")}</label><input id="sshPassphrase" type="password" maxlength="1024" autocomplete="off"></div></div><label class="check"><input type="checkbox" id="sshAuthorization">${t("Autorizo esta conexión al destino configurado en mi servicio local")}</label><p>${t("Si falta IP de gestión explícita, introdúzcala manualmente. No use una IP WAN o gateway como administración sin verificarla.")}</p><div class="actions"><button class="primary" id="sshConnect" ${service?"":"disabled"} onclick="sshConnect()">${t("Conectar")}</button><button id="sshDisconnect" disabled onclick="sshDisconnect()">${t("Desconectar")}</button><button id="sshRealClear" disabled onclick="sshClearReal()">${t("Limpiar consola")}</button></div><p id="sshConnectionStatus" role="status">${t(sshLabels[sshStatusCode]||sshLabels.disconnected)}</p><div id="sshTerminal" class="ssh-terminal" aria-label="${t("Terminal SSH real")}"></div>`
          : `<div class="notice warn">${t("SIMULACIÓN: no existe conexión SSH ni acceso a equipos. Respuestas derivadas del proyecto, no del sistema operativo del dispositivo.")}</div>${!confirmedPlan()?`<p class="notice warn">${t("Plan no confirmado: confirme VLAN/VLSM para consultar datos simulados.")}</p>`:""}<p>${t("Comandos soportados")}: ${esc(sshCommands(n).join(" · "))}</p><pre id="sshSimulation" class="ssh-terminal" role="log" aria-label="${t("Terminal simulada")}">${esc(sshHistory)}</pre><label for="sshCommand">${t("Comando simulado")}</label><div class="actions"><input id="sshCommand" class="mono" maxlength="500" onkeydown="if(event.key==='Enter'){event.preventDefault();sshRunSimulation()}"><button onclick="sshRunSimulation()">${t("Enviar comando")}</button><button id="sshSimClear" ${sshHistory?"":"disabled"} onclick="sshClearSimulation()">${t("Limpiar consola")}</button><button onclick="sshResetSimulation()">${t("Reiniciar simulación")}</button></div>`}</div>`;
      }
      /** Selección no sensible; n.ip solo se considera administración si pertenece a Gestión. */
      function sshChooseDevice(id) { sshDevice=state.nodes.some(n=>n.id===id)?id:"";sshHistory="";render(); }
      /** Lista cerrada por fabricante: no pretende emular un NOS completo. */
      function sshCommands(n) {
        return ["help",...(n?.vendor==="Cisco"?["show running-config","show ip interface brief","show vlan brief","show ip route"]:
          n?.vendor==="Huawei"?["display current-configuration","display ip interface brief","display vlan","display ip routing-table"]:
          n?.vendor==="Fortinet"?["show","show system interface","get router info routing-table all"]:
          n?.vendor==="MikroTik"?["/export","/ip address print","/interface print","/ip route print"]:[])];
      }
      /** Resuelve una consulta de lectura: no interpreta programas ni envía red. */
      function sshRunSimulation() {
        const command=$("sshCommand").value.trim(), n=sshSelected();$("sshCommand").value="";
        let output;
        if (command==="help"||command==="?") output=sshCommands(n).join("\n");
        else if (!n) output=t("Seleccione un dispositivo para simular.");
        else if (!sshCommands(n).includes(command)) output=t("Comando no disponible en el simulador");
        else if (!confirmedPlan()) output=t("Plan no confirmado: confirme VLAN/VLSM para consultar datos simulados.");
        else if (["show running-config","display current-configuration","show","/export"].includes(command)) {
          const item=state.configs[n.id+"-"+n.vendor];
          output=item?.revision===state.revision?item.text:t("Genere primero la configuración de este equipo en su módulo.");
        } else if (/vlan$|vlan brief$/.test(command)) output=state.plan.filter(r=>r.kind==="vlan"&&r.site===n.site).map(r=>`VLAN ${r.id} ${r.name} ${r.network}/${r.prefix}`).join("\n");
        else if (/route|routing-table/.test(command)) output=t("Inventario del plan; no es una tabla de rutas aprendidas.")+"\n"+state.plan.map(r=>`${r.network}/${r.prefix} ${r.name}`).join("\n");
        else output=connected(n).map(l=>{const e=endpoint(l,n,n.vendor);return `${e.iface||"—"} ${e.ip||n.ip||"—"} ${l.type}`;}).join("\n");
        sshHistory=(sshHistory+"\n"+t("SIMULACIÓN")+" "+(n?.name||"WAN")+"> "+command+"\n"+output+"\n").slice(-40000);
        $("sshSimulation").textContent=sshHistory;$("sshSimClear").disabled=false;$("sshSimulation").scrollTop=$("sshSimulation").scrollHeight;
      }
      /** Limpiar/reiniciar solo afectan al buffer educativo en memoria. */
      function sshClearSimulation() { sshHistory="";if($("sshSimulation"))$("sshSimulation").textContent="";if($("sshSimClear"))$("sshSimClear").disabled=true; }
      /** Reinicia la entrada/buffer educativo y confirma la acción; no cambia el proyecto. */
      function sshResetSimulation() { sshClearSimulation();if($("sshCommand"))$("sshCommand").value="";toast(t("Simulación reiniciada.")); }
      /** Cambia campos de credenciales y borra los que dejan de utilizarse. */
      function sshAuthMethod() {
        const key=$("sshMethod").value==="key";
        $("sshKeyBox").classList.toggle("hidden",!key);$("sshPasswordBox").classList.toggle("hidden",key);
        $("sshPassword").value="";$("sshPrivateKey").value="";$("sshPassphrase").value="";
      }
      /** Recursos locales opcionales: la simulación nunca los necesita. */
      function sshLoadTerminal() {
        if (window.Terminal&&window.FitAddon) return Promise.resolve();
        if (sshLibrary) return sshLibrary;
        const style=document.createElement("link");style.rel="stylesheet";style.href="ssh_service/static/xterm.css";document.head.append(style);
        const load=src=>new Promise((resolve,reject)=>{const script=document.createElement("script");script.src=src;script.onload=resolve;script.onerror=()=>reject(Error(t("Recursos locales de terminal no disponibles.")));document.head.append(script);});
        sshLibrary=load("ssh_service/static/xterm.js").then(()=>load("ssh_service/static/addon-fit.js")).catch(e=>{sshLibrary=null;throw e;});return sshLibrary;
      }
      /** Refleja solo estados recibidos o locales; connected exige autenticación del servidor. */
      function sshSetStatus(code) {
        sshStatusCode=code;
        const busy=["connected","connecting"].includes(code);
        for(const id of ["sshHost","sshPort","sshUser","sshMethod","sshPassword","sshPrivateKey","sshPassphrase","sshAuthorization","sshDevice"])if($(id))$(id).disabled=busy;
        if($("sshConnectionStatus"))$("sshConnectionStatus").textContent=t(sshLabels[code]||sshLabels.network);
        if($("sshConnect"))$("sshConnect").disabled=["connected","connecting"].includes(code);
        if($("sshDisconnect"))$("sshDisconnect").disabled=!["connected","connecting"].includes(code);
      }
      /** Abre una sesión explícita. Nunca usa ni envía state/configs/CLI al servicio. */
      async function sshConnect() {
        let payload=null, generation=sshGeneration;
        try {
          if (!document.querySelector('meta[name="wan-ssh-service"]') || location.hostname!=="127.0.0.1" || location.protocol!=="http:") throw Error(t("Servicio SSH local no disponible."));
          if (!$("sshAuthorization").checked) throw Error(t("Confirme que autoriza la conexión."));
          if (sshSocket||sshConnecting) return;
          const host=$("sshHost").value.trim(),user=$("sshUser").value.trim(),port=Number($("sshPort").value);
          if(!host||!user||!Number.isInteger(port)||port<1||port>65535) throw Error(t("Indique host, puerto y usuario válidos."));
          if(sshTerminal)sshDispose();
          generation=sshGeneration;sshConnecting=true;sshSetStatus("connecting");
          await sshLoadTerminal();
          if(generation!==sshGeneration||!$("sshTerminal")||page!==13||sshMode!=="real")return;
          sshTerminal=new Terminal({cursorBlink:true,scrollback:1000,convertEol:false,fontSize:14});
          sshFit=new FitAddon.FitAddon();sshTerminal.loadAddon(sshFit);sshTerminal.open($("sshTerminal"));sshFit.fit();
          const response=await fetch("/ssh/bootstrap",{headers:{"X-WAN-Client":"ssh-ui"},credentials:"same-origin",cache:"no-store"});
          if(!response.ok)throw Error(t("Sesión local no autorizada"));
          const auth=await response.json();
          if(generation!==sshGeneration||!$("sshTerminal"))return;
          payload={type:"connect",token:auth.token,host,port,user,method:$("sshMethod").value,
            password:$("sshPassword").value,privateKey:$("sshPrivateKey").value,passphrase:$("sshPassphrase").value,
            cols:Math.max(20,Math.min(300,sshTerminal.cols)),rows:Math.max(5,Math.min(120,sshTerminal.rows))};
          // Las referencias a secretos se vacían inmediatamente; nunca se guardan en el modelo.
          $("sshPassword").value="";$("sshPrivateKey").value="";$("sshPassphrase").value="";
          sshSetStatus("connecting");
          const socket=new WebSocket(`ws://${location.host}/ssh/ws`);sshSocket=socket;sshConnecting=false;
          socket.onopen=()=>{if(sshSocket!==socket||!payload){socket.close();return;}socket.send(JSON.stringify(payload));payload=null;};
          socket.onmessage=event=>{
            if(sshSocket!==socket)return;
            const message=JSON.parse(event.data);
            if(message.type==="output"&&typeof message.data==="string"){sshTerminal?.write(Uint8Array.from(atob(message.data),c=>c.charCodeAt(0)),()=>{if(socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:"ack"}));});if($("sshRealClear"))$("sshRealClear").disabled=false;}
            else if(message.type==="status")sshSetStatus(message.status);
            else if(message.type==="error")sshSetStatus(Object.hasOwn(sshLabels,message.code)?message.code:"network");
          };
          socket.onerror=()=>{if(sshSocket===socket)sshSetStatus("network");};
          socket.onclose=()=>{payload=null;if(sshSocket===socket){sshSocket=null;if(["connecting","connected"].includes(sshStatusCode))sshSetStatus("ended");}};
          sshTerminal.onData(data=>{if(socket.readyState===WebSocket.OPEN&&sshStatusCode==="connected")socket.send(JSON.stringify({type:"input",data}));});
          sshObserver=new ResizeObserver(()=>{
            if(!sshTerminal||!$("sshTerminal"))return;sshFit.fit();
            if(socket.readyState===WebSocket.OPEN&&sshStatusCode==="connected")socket.send(JSON.stringify({type:"resize",cols:Math.max(20,Math.min(300,sshTerminal.cols)),rows:Math.max(5,Math.min(120,sshTerminal.rows))}));
          });sshObserver.observe($("sshTerminal"));sshTerminal.focus();
        } catch(error) {payload=null;if(generation!==sshGeneration)return;sshDispose();sshSetStatus("network");toast(error.message,true);}
      }
      /** Cierre idempotente al salir de vista, cambiar idioma o desconectar. */
      function sshDispose() {
        sshGeneration++;sshConnecting=false;
        const socket=sshSocket;sshSocket=null;
        if(socket){socket.onclose=null;socket.onerror=null;socket.onmessage=null;socket.close();}
        sshObserver?.disconnect();sshObserver=null;sshTerminal?.dispose();sshTerminal=null;sshFit=null;sshStatusCode="disconnected";
        for(const id of ["sshPassword","sshPrivateKey","sshPassphrase"])if($(id))$(id).value="";
      }
      /** Desconecta por orden del usuario y muestra fin de sesión, incluso al cancelar conexión. */
      function sshDisconnect() {sshDispose();sshSetStatus("ended");}
      /** Borra solo la pantalla xterm; jamás envía clear ni otros comandos al dispositivo. */
      function sshClearReal() {sshTerminal?.clear();if($("sshRealClear"))$("sshRealClear").disabled=true;}
      window.addEventListener("pagehide",()=>sshDispose());

      render(); // Primer render: no genera topologías ni pruebas ficticias automáticamente.
    </script>
  </body>
</html>
