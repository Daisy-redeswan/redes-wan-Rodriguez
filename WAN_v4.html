<!DOCTYPE html>
<!-- WAN Architect: aplicación autónoma; no ejecuta comandos sobre equipos reales. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WAN Architect · Diseño empresarial</title>
    <meta
      name="description"
      content="Diseño WAN local, VLSM, topología y propuestas Cisco IOS / Huawei VRP."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1830'/%3E%3Cpath d='M8 9h16v6H8zM8 22h16M16 15v7' fill='none' stroke='%235ee2c1' stroke-width='3'/%3E%3C/svg%3E"
    />
    <style>
      /* Variables de color compartidas por todas las etapas. */
      :root {
        --bg: #f2f5fa;
        --ink: #17273f;
        --muted: #64748b;
        --line: #dce3ed;
        --nav: #101e35;
        --accent: #087f71;
        --blue: #2869b6;
        --white: #fff;
        --warn: #aa6200;
        --red: #bb3543;
      }
      /* La estructura conserva el menú en escritorio y permite apilarlo en móvil. */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.55 system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      a {
        color: var(--blue);
      }
      aside {
        position: fixed;
        width: 240px;
        inset: 0 auto 0 0;
        background: var(--nav);
        color: white;
        padding: 28px 18px;
        overflow: auto;
      }
      main {
        margin-left: 240px;
        max-width: 1700px;
        padding: 26px 36px 80px;
      }
      .brand {
        font-size: 22px;
        font-weight: 750;
        letter-spacing: -0.7px;
      }
      .brand b {
        color: #61ddc3;
      }
      .subbrand {
        color: #9bacc5;
        font-size: 11px;
        letter-spacing: 2px;
        margin-bottom: 30px;
      }
      nav button {
        border: 0;
        background: transparent;
        color: #bdcce0;
        width: 100%;
        text-align: left;
        padding: 11px 12px;
        border-radius: 7px;
        margin: 2px 0;
      }
      nav button.active {
        background: #233c55;
        color: #74e3cf;
      }
      nav button span {
        font: 11px monospace;
        margin-right: 12px;
        opacity: 0.6;
      }
      .local {
        border-top: 1px solid #34445c;
        margin-top: 25px;
        padding: 18px 10px;
        color: #9bacc5;
        font-size: 12px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 30px;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--accent);
        text-transform: uppercase;
      }
      h1 {
        font-size: 32px;
        line-height: 1.2;
        letter-spacing: -1px;
        margin: 10px 0;
      }
      h2 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        margin: 6px 0 18px;
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      button,
      .filebtn {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
        color: var(--ink);
        padding: 8px 12px;
        display: inline-block;
        white-space: nowrap;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      button.danger {
        color: var(--red);
      }
      button:hover,
      .filebtn:hover {
        filter: brightness(0.96);
      }
      button.small {
        padding: 4px 9px;
        font-size: 12px;
      }
      .card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 22px;
        margin: 18px 0;
        box-shadow: 0 3px 9px #17273f03;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 16px;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      label {
        font-size: 12px;
        font-weight: 650;
        color: #465a73;
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #cfd9e6;
        border-radius: 5px;
        padding: 9px 10px;
        color: var(--ink);
        background: white;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid #71c5b8;
        outline-offset: 1px;
      }
      input[type="checkbox"] {
        width: auto;
        accent-color: var(--accent);
      }
      textarea {
        min-height: 90px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
      }
      .hint,
      small {
        color: var(--muted);
        font-size: 12px;
      }
      .notice {
        border-left: 3px solid var(--accent);
        background: #eef9f5;
        border-radius: 3px;
        padding: 12px 16px;
        margin: 14px 0;
      }
      .notice.warn {
        border-color: #df9a38;
        background: #fff6e7;
        color: #895820;
      }
      .notice.error {
        border-color: var(--red);
        background: #fff0f1;
        color: var(--red);
      }
      .badge {
        display: inline-block;
        background: #e7f7f1;
        color: var(--accent);
        font-size: 11px;
        border-radius: 20px;
        padding: 3px 9px;
      }
      .badge.warn {
        background: #fff0d9;
        color: var(--warn);
      }
      .badge.dim {
        background: #eaf0f7;
        color: var(--muted);
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 14px;
      }
      .metric {
        padding: 18px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      .metric strong {
        display: block;
        font-size: 29px;
        font-weight: 650;
      }
      .metric span {
        color: var(--muted);
        font-size: 12px;
      }
      .tablewrap {
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      th {
        text-align: left;
        background: #f6f8fc;
        color: #617289;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        white-space: nowrap;
      }
      th,
      td {
        padding: 11px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      td input,
      td select {
        padding: 5px;
        min-width: 90px;
      }
      td .num {
        min-width: 65px;
        width: 72px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      .console {
        background: #102139;
        color: #d2e7ed;
        font:
          12px/1.6 ui-monospace,
          Consolas,
          monospace;
        padding: 20px;
        border-radius: 8px;
        white-space: pre;
        overflow: auto;
        min-height: 220px;
        max-height: 650px;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 45px;
      }
      .stepfoot {
        display: flex;
        justify-content: space-between;
        margin-top: 25px;
      }
      .sitehead {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 18px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        background: #eef4fb;
        padding: 7px 12px;
        border-radius: 5px;
        font-size: 12px;
      }
      .diagram {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fbff;
      }
      .diagram svg {
        display: block;
        min-width: 650px;
      }
      svg text {
        font-family: system-ui, sans-serif;
      }
      svg .node {
        cursor: grab;
      }
      svg .node:hover rect {
        stroke: #087f71;
        stroke-width: 2;
      }
      .imageframe {
        position: relative;
        overflow: auto;
        max-height: 650px;
        background: #e8edf5;
      }
      .imageframe img {
        display: block;
        max-width: 100%;
        max-height: 600px;
      }
      .imageframe svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .progressline {
        display: flex;
        gap: 4px;
        margin-bottom: 25px;
      }
      .progressline div {
        height: 4px;
        flex: 1;
        background: #dbe5ef;
        border-radius: 8px;
      }
      .progressline div.done {
        background: var(--accent);
      }
      details {
        margin: 10px 0;
      }
      summary {
        cursor: pointer;
        color: var(--blue);
        font-weight: 600;
      }
      .toast {
        position: fixed;
        right: 25px;
        bottom: 25px;
        background: var(--nav);
        color: white;
        padding: 14px 22px;
        border-radius: 8px;
        z-index: 100;
        max-width: 500px;
      }
      .toast.error {
        background: #a32e3c;
      }
      .headingrow {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 10px;
      }
      .quote {
        border-left: 2px solid #cee5de;
        padding-left: 16px;
      }
      dialog {
        border: 0;
        border-radius: 12px;
        width: min(700px, 94vw);
        max-height: 90vh;
        box-shadow: 0 15px 70px #001a4c44;
        padding: 24px;
      }
      dialog::backdrop {
        background: #101e3570;
      }
      dialog .actions {
        margin-top: 20px;
      }
      .statuslist {
        display: grid;
        gap: 8px;
      }
      .statusrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .port {
        font-size: 10px;
        color: var(--muted);
      }
      .toolbar {
        background: #edf3f9;
        padding: 12px;
        border-radius: 8px;
        margin: 12px 0;
      }
      .hidden {
        display: none !important;
      }
      .sitecount {
        min-width: 190px;
      }
      ul {
        padding-left: 20px;
      }
      li {
        margin: 5px 0;
      }
      /* Impresión genera un informe sin la navegación ni las acciones interactivas. */
      @media (max-width: 950px) {
        aside {
          position: static;
          width: auto;
          padding: 15px;
        }
        aside .subbrand,
        aside .local {
          display: none;
        }
        nav {
          display: flex;
          overflow: auto;
          margin-top: 10px;
        }
        nav button {
          width: auto;
          white-space: nowrap;
        }
        main {
          margin: 0;
          padding: 20px;
        }
        .two {
          grid-template-columns: 1fr;
        }
        .topbar {
          flex-wrap: wrap;
        }
        h1 {
          font-size: 27px;
        }
      }
      @media print {
        aside,
        .topbar,
        .stepfoot,
        button,
        .filebtn {
          display: none !important;
        }
        main {
          margin: 0;
          padding: 0;
        }
        .card {
          break-inside: avoid;
        }
        .console {
          max-height: none;
          white-space: pre-wrap;
          color: black;
          background: white;
        }
        .diagram {
          overflow: visible;
        }
        body {
          background: white;
        }
      }
      .card, .field, .two > *, .grid > * { min-width:0; }
      .sitehead { flex-wrap:wrap; }
      .sitehead .actions, .sitecount { max-width:100%; }
      .language-control { display:flex; align-items:center; gap:6px; font-size:13px; }
      .language-control select { width:auto; min-width:100px; }
      /* Lienzo grande autónomo: desplazamiento y zoom sin comprimir etiquetas. */
      .diagram { overflow: auto; max-height: 75vh; overscroll-behavior: contain; }
      .diagram svg { max-width: none; display: block; height: auto; }
      .node { cursor: grab; outline: none; }
      .node:focus rect { stroke: #d17700; stroke-width: 3; }
      /* La ficha confirmada usa deshabilitación nativa accesible sin perder sus valores. */
      #siteFields { border: 0; padding: 0; margin: 14px 0; min-width: 0; }
      #siteFields:disabled { opacity: .85; }
      /* Consolas acotadas: texto seguro, contraste y desplazamiento propio. */
      .ssh-terminal { background:#101c2d; color:#d4e5ec; min-height:280px; height:360px; max-width:100%; overflow:auto; padding:12px; white-space:pre-wrap; overflow-wrap:anywhere; }
      #sshTerminal { padding:8px; white-space:normal; }
      #sshKeyBox textarea { min-height:120px; font-family:monospace; }
      /* La pestaña activa se identifica por estado accesible, no por texto fijo. */
      [role="tab"][aria-selected="true"] { background:#008579; color:white; border-color:#008579; }
    </style>
  </head>
  <body>
    <!-- Menú: cada etapa consume los datos validados de las anteriores. -->
    <aside>
      <div class="brand">WAN <b>Architect</b></div>
      <div class="subbrand" data-i18n="DISEÑO · PLAN · CONFIGURACIÓN">DISEÑO · PLAN · CONFIGURACIÓN</div>
      <nav id="nav"></nav>
      <div class="local">
        ● <span data-i18n="Aplicación local y autónoma">Aplicación local y autónoma</span><br /><span data-i18n="Los comandos se revisan y aplican manualmente.">Los comandos se revisan y aplican manualmente.</span><br /><br /><span data-i18n="Corte 3 · Telecomunicaciones">Corte 3 · Telecomunicaciones</span>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div>
          <span class="eyebrow" data-i18n="Workspace de ingeniería">Workspace de ingeniería</span>
          <div id="projectLabel">Proyecto sin guardar</div>
        </div>
        <div class="actions">
          <label class="language-control"><span data-i18n="Idioma">Idioma</span><select id="languageSelect" aria-label="Idioma" onchange="setLanguage(this.value)"><option value="es">Español</option><option value="en">English</option></select></label>
          <button onclick="saveLocal()" data-i18n="Guardar proyecto">Guardar proyecto</button
          ><button onclick="loadLocal()" data-i18n="Cargar guardado">Cargar guardado</button
          ><button onclick="exportJSON()" data-i18n="Exportar JSON">Exportar JSON</button
          ><label class="filebtn" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.querySelector('input').click()}"
             data-i18n-label="Importar JSON">Importar JSON<input
              type="file"
              accept=".json,application/json"
              class="hidden"
              onchange="importJSON(this)" /></label
          ><button onclick="newProject()" data-i18n="Nuevo">Nuevo</button>
        </div>
      </header>
      <div id="progress" class="progressline"></div>
      <section id="view"></section>
      <footer id="stepfoot" class="stepfoot"></footer>
    </main>
    <!-- Un único diálogo sirve para editar equipos, enlaces y confirmar datos. -->
    <dialog id="modal"><div id="modalbody"></div></dialog>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <script src="data/catalogo-interfaces.js"></script>

    "Mapee interfaces Fortinet reales en Topología y deje vacíos IP/red del nodo: se derivan del plan y de sus enlaces. Hostname e interfaces son obligatorios; rutas estáticas proceden de enlaces reales. No se crean VDOM ni se habilita multi-VDOM; las VLAN usan el contexto interno root. No se generan HA, LACP, NAT ni permisos de tránsito implícitos. OSPF usa área 0 y LAN pasivas; verifique adyacencias y rutas de retorno. Un firewall no puede reclamar gateways ya usados por cores. Las opciones compartidas de OSPF/DHCP/relay/ruta afectan a todas las marcas.": "Map real Fortinet interfaces in Topology and leave node IP/network empty: addresses derive from the plan and links. Hostname and interfaces are required; static routes come from real links. No VDOMs or multi-VDOM are enabled; VLANs use the internal root context. HA, LACP, NAT and implicit forwarding permissions are not generated. OSPF uses area 0 and passive LANs; verify adjacencies and return routes. A firewall cannot claim gateways already used by cores. OSPF/DHCP/relay/route options are shared across manufacturers.",
    "Mapee puertos MikroTik reales en Topología y deje IP/red del nodo vacíos. Solo Router; bridge/VLAN filtering para LAN, /30 para enlaces enrutados. No se modelan VRRP, LACP, VRF, CAPsMAN, IPv6 ni NAT. No reclame gateways de cores u otros routers/firewalls. SSH solo desde Gestión; MAC y servicios innecesarios deshabilitados. Sin permisos de tráfico explícitos se bloquea forward: revise políticas antes de uso. Cuentas/claves y configuración existente requieren revisión externa. Las opciones de OSPF/DHCP/relay/ruta son compartidas entre fabricantes.": "Map real MikroTik ports in Topology and leave node IP/network empty. Router only; bridge/VLAN filtering for LAN and /30 for routed links. VRRP, LACP, VRF, CAPsMAN, IPv6 and NAT are not modeled. Do not claim core or other router/firewall gateways. SSH is restricted to Management; MAC access and unnecessary services are disabled. Without explicit traffic permissions, forwarding is blocked: review policies before use. Accounts/keys and existing configuration require external review. OSPF/DHCP/relay/route options are shared across manufacturers.",

       * Proceso / salida: Devuelve HTML escapado para datos y bloque propio; no escribe estado.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function projectView() {
        // confirmed es opcional en v4: ausente nunca implica una ficha confirmada.
        const s = state.sites[selectedSite] || state.sites[0];

        return (
          title(
            t("Datos del proyecto"),
            t("Registre cada sede por separado. Confirme los cambios para que estimación, VLAN, direccionamiento y topología utilicen la misma información."),
          ) +
          `<div class="notice">${t("Flujo: datos → estimación → confirmar VLAN → VLSM → topología → configuraciones. Cambiar datos confirmados invalida las etapas dependientes.")}</div><div class="card"><h2>${t("Identificación y alcance")}</h2><div class="grid">${field(t("Nombre del proyecto *"), "pname", state.project.name)}${field(t("Empresa *"), "pcompany", state.project.company)}${field(t("Actividad * (ej. clínica, educación, comercio)"), "pactivity", state.project.activity)}<div class="field"><label for="ptype">${t("Infraestructura")}</label><select id="ptype">${optsHTML(["Casa", "Oficina", "Edificio", "Campus", "Varias sedes"], state.project.type)}</select></div><div class="field"><label for="psegment">${t("Criterio de segmentación")}</label><select id="psegment">${optsHTML(["Servicios", "Departamentos"], state.project.segmentation)}</select></div>${field(t("Número de sedes (1–12)"), "sitecount", state.sites.length, "number", 'min="1" max="12"')}</div><label class="check"><input id="pinter" type="checkbox" ${state.project.interconnect ? "checked" : ""}>${t("Interconectar las sedes mediante enlaces WAN enrutados")}</label><div class="actions"><button class="primary" onclick="saveProject()">${t("Confirmar datos del proyecto")}</button><button onclick="resizeSites()">${t("Aplicar número de sedes")}</button><button onclick="demo()">${t("Cargar ejemplo de laboratorio")}</button></div></div><div class="card"><div class="sitehead"><h2>${t("Ficha individual de la sede")}</h2><div class="actions"><select class="sitecount" aria-label="${t("Sede activa")}" onchange="selectSite(+this.value)">${state.sites.map((x, i) => `<option value="${i}" ${i === selectedSite ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select><button class="danger" onclick="removeSite()">${t("Eliminar sede")}</button></div></div><div id="siteStatus" class="badge ${s.confirmed && !siteEditing.has(s.id) ? "" : "warn"}">${t(s.confirmed && !siteEditing.has(s.id) ? "Sede confirmada" : "Sede pendiente o en edición")}</div>${s.confirmed && !siteEditing.has(s.id) ? `<p>${esc(s.name)} · ${s.users} ${t("Usuarios")} · ${s.floors} ${t("Pisos")} · ${esc(s.ipv4Base || state.project.base)}</p>` : ""}<fieldset id="siteFields" ${s.confirmed && !siteEditing.has(s.id) ? "disabled" : ""}><div class="grid">${field(t("Nombre de sede *"), "sname", s.name)}${field(t("Bloque IPv4 de la sede (opcional)"), "sipv4Base", s.ipv4Base, "text", 'placeholder="10.10.0.0/16" aria-describedby="siteIpv4Help"')}${field(t("Número de pisos"), "sfloors", s.floors, "number", 'min="1" max="50"')}${field("Usuarios", "susers", s.users, "number", 'min="1" max="100000"')}${field(t("Dispositivos personales por usuario"), "sratio", s.ratio, "number", 'min="1" max="10" step="0.1"')}${field(t("Pisos más concurridos (separados por coma)"), "sbusy", s.busy)}${field(t("Áreas / departamentos (separados por coma)"), "sareas", s.areas)}${field(t("Ancho de banda Mbps (0 = sugerir)"), "sbw", s.bandwidth, "number", 'min="0" max="100000"')}</div><div class="grid" style="margin-top:16px">${[
            ["wifi", "WiFi"],
            ["voip", t("Telefonía IP")],
            ["cctv", t("Cámaras IP")],
            ["printing", "Impresoras"],
            ["server", "Servidores"],
            ["redundant", t("Dos cores con HSRP / VRRP")],
          ]
            .map(
              ([k, l]) =>
                `<label class="check"><input id="s${k}" type="checkbox" ${s[k] ? "checked" : ""}>${t(l)}</label>`,
            )
            .join(
              "",
            )}</div><div id="siteIpv4Help" class="hint">${t("Opcional: deje vacío para conservar el comportamiento heredado. Este bloque se valida y delimita la asignación VLSM automática de sus VLAN.")}</div><div class="hint">${t("La redundancia reserva un gateway virtual y dos IP físicas por VLAN. Los pisos concurridos se usan para identificar prioridad de cobertura; la cantidad de AP requiere luego un estudio RF.")}</div></fieldset><div class="actions" style="margin-top:16px">${s.confirmed && !siteEditing.has(s.id) ? `<button class="primary" onclick="editSite()">${t("Editar sede")}</button>` : `<button class="primary" onclick="saveSite()">${t("Confirmar esta sede")}</button>`}</div></div>`
        );
      }
      function saveProject() {
        safe(() => {
          const p = {
            ...state.project,
            name: text($("pname").value, "Proyecto"),
            company: text($("pcompany").value, "Empresa"),
            activity: text($("pactivity").value, "Actividad"),
            type: $("ptype").value,
            segmentation: $("psegment").value,
            interconnect: $("pinter").checked,
          };
          state.project = p;
          invalidate();
          render();
          toast(t("Datos confirmados. Continúe con las fichas de sede."));
        });
      } // Confirmación atómica del formulario general.
      function resizeSites() {
        safe(() => {
          const n = num($("sitecount").value, 1, 12, "Sedes");
          if (
            n < state.sites.length &&
            !confirm(
              t("Se eliminarán las últimas sedes y sus diseños. ¿Continuar?"),
            )
          )
            return;
          while (state.sites.length < n) {
            let i = 1;
            while (state.sites.some((s) => s.id === "s" + i)) i++;
            state.sites.push(siteDefault(i));
          }
          state.sites = state.sites.slice(0, n);
          selectedSite = 0;
          invalidate();
          render();
        });
      } // Cantidad e identidad de sedes permanecen coherentes.
      function removeSite() {
        if (state.sites.length === 1)
          return toast(t("Se requiere al menos una sede."), true);
        if (
          confirm(t("¿Eliminar esta sede y los datos de diseño dependientes?"))
        ) {
          state.sites.splice(selectedSite, 1);
          selectedSite = 0;
          invalidate();
          render();
        }
      } // Nunca elimina datos sin confirmar.
      /**
       * Entradas: Ficha visible con nombre, bloque, usuarios y opciones.
       * Proceso / salida: Valida una candidata completa; igualdad conserva diseño y cambio real invalida solo dependencias locales.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function saveSite() {
        // Solo el éxito publica confirmed=true; un error conserva ficha y borrador.
        safe(() => {
          const old = state.sites[selectedSite],
            s = {
              ...old,
              confirmed: true,
              name: text($("sname").value, "Sede"),
              ipv4Base: $("sipv4Base").value.trim(),
              floors: num($("sfloors").value, 1, 50, "Pisos"),
              users: num($("susers").value, 1, 100000, "Usuarios"),
              ratio: num(
                $("sratio").value,
                1,
                10,
                "Dispositivos por usuario",
                false,
              ),
              busy: text($("sbusy").value, "Pisos concurridos"),
              areas: text($("sareas").value, "Áreas", 500),
              bandwidth: num($("sbw").value, 0, 100000, "Mbps"),
              counts: old.counts,
            };
          const floors = s.busy
            .split(",")
            .map((x) => num(x.trim(), 1, s.floors, "Piso concurrido"));
          if (!floors.length) fail(t("Indique los pisos concurridos."));
          for (const k of [
            "wifi",
            "voip",
            "cctv",
            "printing",
            "server",
            "redundant",
          ])
            s[k] = $("s" + k).checked;
          if (state.sites.some((x) => x.id !== s.id && x.name === s.name))
            fail(t("Use un nombre de sede único."));
          validateSiteBlocks(
            state.project,
            state.sites.map((x) => (x.id === s.id ? s : x)),
          );
          // No guardar una intención manual que quedaría fuera del nuevo pool.
          manualVlanNetworks(state.project,state.sites.map(x=>x.id===s.id?s:x),state.vlans,state.nodes);
          // Confirmar sin cambios no destruye un diseño válido.
          if (JSON.stringify({...old,confirmed:true}) !== JSON.stringify(s)) {
            const addressOnly = Object.keys(old).filter(k => !["name","ipv4Base","bandwidth","confirmed"].includes(k)).every(k => JSON.stringify(old[k])===JSON.stringify(s[k]));
            state.sites[selectedSite] = s;
            if (!addressOnly || old.ipv4Base!==s.ipv4Base) invalidateSite(s.id, !addressOnly);
            // Un nombre o ancho de banda no altera redes ni interfaces.
            else if (old.name!==s.name) {
              const ids=state.nodes.filter(n=>n.site===s.id).map(n=>n.id);
              state.configs=Object.fromEntries(Object.entries(state.configs).filter(([key])=>!ids.some(id=>key.startsWith(id+"-"))));
            }
          }
          state.sites[selectedSite].confirmed=true;
          siteEditing.delete(s.id); sitePending.delete(s.id); siteSnapshots.delete(s.id);
          formDrafts.delete("site:"+s.id);
          render();
          toast(t("Sede confirmada."));
        });
      } // Valida pisos, usuarios y nombres antes de reemplazar una ficha.
      /**
       * Entradas: Cantidades reales o fórmulas estimadas por sede.
       * Proceso / salida: Devuelve formulario o resumen confirmado junto con infraestructura y ancho de banda, sin cambiar fórmulas.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function estimateView() {
        return (
          title(
            t("Estimación e infraestructura"),
            t("Las cantidades son hipótesis de planificación editables. No representan una medición real ni un estudio de cobertura."),
          ) +
          state.sites
            .map((s, i) => {
              const c = counts(s),
                p = proposal(s);
              return `<div class="card"><h2>${esc(s.name)}</h2><p>${s.users} ${t("usuarios ·")} ${s.floors} ${t("pisos · prioridad de cobertura: pisos")} ${esc(s.busy)}</p><div class="grid">${s.counts && !inventoryEditing.has(s.id) ? countKeys.map(k => `<div class="chip"><strong>${c[k]}</strong> ${t(countLabels[k])}</div>`).join("") : countKeys.map((k) => field(countLabels[k], `c${i}_${k}`, c[k], "number", 'min="0" max="1000000"')).join("")}</div><div class="actions" style="margin-top:16px">${s.counts && !inventoryEditing.has(s.id) ? `<span class="badge">${t("Inventario confirmado")}</span><button class="primary" onclick="editCounts(${i})">${t("Editar inventario")}</button>` : `<span id="inventoryStatus${i}" class="badge warn">${t("Editar inventario")}</span><button class="primary" onclick="saveCounts(${i})">${t("Confirmar inventario de esta sede")}</button>`}<button onclick="resetCounts(${i})">${t("Restaurar estimación")}</button></div><div class="notice">${t("Criterios: 1 PC por usuario; móviles = usuarios × (dispositivos personales − 1); telefonía IP = usuarios si se solicita; impresoras = 1/20 usuarios; AP = máximo entre pisos y clientes/25; cámaras = 4/piso; servidores = 2 si se solicitan. Todos pueden corregirse según el levantamiento.")}</div><div class="chips">${Object.entries(
                {
                  Routers: p.routers,
                  "Switches de acceso": p.access,
                  Distribución: p.distribution,
                  "Cores capa 3": p.core,
                  "Firewalls recomendados": p.firewalls,
                  AP: p.ap,
                  Servidores: p.servers,
                  "Mbps sugeridos": p.bandwidth,
                },
              )
                .map(
                  ([k, v]) =>
                    `<span class="chip"><strong>${v}</strong> ${t(k)}</span>`,
                )
                .join(
                  "",
                )}</div><p style="margin-top:12px">${t("Acceso:")} ${p.ports} ${t("puertos cableados / 44 puertos útiles, mínimo un switch por piso. Distribución: uno por tres pisos si hay más de tres. Core: uno o dos según redundancia. Firewall recomendado: uno por sede; su política depende del equipo y proveedor. Banda: 40% de usuarios simultáneos a 2 Mbps + 0,3 Mbps por móvil, mínimo 20 Mbps. No incluye vídeo masivo ni enlaces de respaldo.")}</p></div>`;
            })
            .join("") +
          `<button class="primary" onclick="proposeVlans()">${t("Proponer segmentación y continuar →")}</button>`
        );
      }
      /**
       * Entradas: Cantidades visibles, dentro de límites numéricos.
       * Proceso / salida: Valida todo antes de confirmar; diferencias reales invalidan su sede, cantidades iguales no destruyen diseño.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function saveCounts(i) {
        safe(() => {
          const c = {};
          for (const k of countKeys)
            c[k] = num($(`c${i}_${k}`).value, 0, 1000000, countLabels[k]);
          if (!state.sites[i].wifi && (c.ap || c.mobile))
            fail(t("Habilite WiFi en la ficha antes de asignar AP o móviles."));
          const site=state.sites[i];
          // Igualdad semántica: confirmar las mismas cantidades no invalida.
          if (countKeys.some(k => counts(site)[k] !== c[k])) invalidateSite(site.id, true);
          site.counts = c;
          inventoryEditing.delete(site.id);
          formDrafts.delete("inventory");
          render();
          toast(t("Inventario confirmado."));
        });
      } // Un inventario editado alimenta la propuesta y sus VLAN.
      /**
       * Entradas: Índice de sede y confirmación nativa del usuario.
       * Proceso / salida: Cancelar conserva todo; aceptar retira la personalización y aplica estimación vigente.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function resetCounts(i) {
        if (
          confirm(
            t("¿Restaurar estimaciones de esta sede y reiniciar el diseño dependiente?"),
          )
        ) {
          const site=state.sites[i];
          if (site.counts && countKeys.some(k => site.counts[k] !== estimated(site)[k])) invalidateSite(site.id, true);
          site.counts = null;
          inventoryEditing.delete(site.id);
          formDrafts.delete("inventory");
          render();
        }
      } // Restauración explícita, sin sobrescribir correcciones silenciosamente.
      /**
       * Entradas: inventario confirmado y opción explícita de reemplazar todo.
       * Salida: propuesta parcial para sedes sin VLAN o reemplazo completo confirmado.
       * Conserva claves, CIDR manuales y dependencias de otras sedes al completar faltantes.
       */
      function proposeVlans(replaceAll = false) {
        safe(() => {
          projectValid();
          const missing=new Set(state.sites.filter(site=>!state.vlans.some(v=>v.site===site.id)).map(site=>site.id));
          const partial=!replaceAll && state.vlans.length>0 && missing.size>0;
          if (
            !partial && state.vlans.length &&
            !confirm(
              t("¿Reemplazar VLAN y diseño actual por una nueva propuesta?"),
            )
          )
            return;
          const out = [], used=new Set(partial?state.vlans.map(v=>v.key):[]);
          let nextKey=state.vlans.length;
          for (const s of state.sites) {
            if (partial && !missing.has(s.id)) continue;
            const c = counts(s),
              p = proposal(s);
            let id = 10;
            const add = (name, role, hosts) => {
              if (hosts > 0) {
                let key="v"+out.length;
                while(used.has(key)) key="v"+(nextKey++);
                used.add(key);
                out.push({
                  key,
                  site: s.id,
                  id,
                  name,
                  role,
                  hosts,
                  dhcp: ["Datos", "WiFi", "Invitados", "Clínica"].includes(
                    role,
                  ),
                  gateway: "",
                  ipv4Cidr: "",
                });
                id += 10;
              }
            };
            if (state.project.segmentation === "Departamentos") {
              const areas = [
                ...new Set(
                  s.areas
                    .split(",")
                    .map((x) => x.trim())
                    .filter(Boolean),
                ),
              ];
              let remaining = c.pc;
              areas.forEach((a, i) => {
                const n =
                  Math.floor(c.pc / areas.length) +
                  (i < c.pc % areas.length ? 1 : 0);
                add(
                  a,
                  /cl[ií]nica|salud|hospital|m[eé]dic/i.test(
                    state.project.activity,
                  )
                    ? "Clínica"
                    : "Datos",
                  n,
                );
                remaining -= n;
              });
            } else add("Usuarios", "Datos", c.pc);
            add("WiFi corporativo", "WiFi", c.mobile);
            add("Telefonía", "VoIP", c.phones);
            add("Videovigilancia", "CCTV", c.cameras);
            add("Impresoras", "Impresoras", c.printers);
            add("Servidores", "Servidores", c.servers);
            add(
              "Gestión de red",
              "Gestión",
              p.routers + p.access + p.distribution + p.core + c.ap + 2,
            );
            if (
              /cl[ií]nica|salud|hospital|educa|colegio|universidad|hotel/i.test(
                state.project.activity,
              ) &&
              s.wifi
            )
              add("WiFi invitados", "Invitados", Math.ceil(s.users * 0.25));
          }
          if (partial) {
            state.vlans=[...state.vlans,...out];
            state.approved=false; state.revision++;
            Object.values(state.configs).forEach(item=>item.revision=state.revision);
          } else { state.vlans = out; invalidate("plan"); }
          formDrafts.delete("vlans"); vlanEditing=false;
          go(3);
          toast(t("Revise la propuesta y confirme las VLAN."));
        });
      } // El tipo de actividad modifica invitados y clasificación clínica.
      /* =================== VLAN, VLSM y gateway =================== */
      function siteName(id) {
        return state.sites.find((s) => s.id === id)?.name || "WAN";
      } // Traduce referencias estables a nombres visibles.
      /**
       * Entradas: Intenciones, aprobación y último plan efectivo.
       * Proceso / salida: Muestra fallback, tránsito, CIDR manual, estado pendiente/confirmado y redes calculadas; no asigna.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function vlanView() {
        const approved=confirmedPlan();
        return (
          title(
            t("VLAN y plan de direccionamiento"),
            "Confirme los segmentos; el VLSM los ordena por tamaño y asigna redes sin solaparse. Incluye tránsito router–core y WAN entre sedes.",
          ) +
          `<div class="card"><div class="grid">${field(t("Bloque predeterminado del proyecto"), "base", state.project.base)}${field(t("Bloque de tránsito (opcional)"), "transitBase", state.project.transitBase)}${field(t("Reserva de crecimiento (%)"), "growth", state.project.growth, "number", 'min="0" max="100"')}${field(t("DNS para DHCP"), "dns", state.project.dns)}</div><div class="notice">${t("Hosts solicitados son terminales; el cálculo añade crecimiento y una IP de gateway, o tres IP si hay dos cores. El gateway no cuenta como host disponible para terminales. Las redes de tránsito son /30 y no usan VLAN.")}</div><div class="actions"><button onclick="proposeVlans(true)">${t("Volver a proponer")}</button><button onclick="addVlan()">${t("Agregar VLAN")}</button><span id="vlanStatus" class="badge ${approved ? "" : "warn"}">${t(approved ? "VLAN confirmadas" : "Pendiente de confirmación")}</span><button class="primary" onclick="confirmVlans()">${t(state.approved ? "Recalcular VLAN" : "Confirmar VLAN y calcular VLSM")}</button></div></div><div class="card"><h2>${t("Segmentos editables por sede")}</h2><p id="vlanCidrHelp" class="hint">${t("Subred IPv4 / CIDR (opcional): deje vacío para asignación automática. Define la red completa de la VLAN; no es el gateway ni un rango DHCP.")}</p>${state.vlans.length ? `<div class="tablewrap"><table><thead><tr><th>${t("Sede")}</th><th>${t("VLAN")}</th><th>${t("Nombre")}</th><th>${t("Subred IPv4 / CIDR (opcional)")}</th><th>${t("Servicio")}</th><th>${t("Hosts terminales")}</th><th>${t("DHCP local")}</th><th>${t("Acción")}</th></tr></thead><tbody>${state.vlans.map((v, i) => `<tr><td><select id="vs${i}" aria-label="${t("Sede de VLAN")}">${state.sites.map((s) => `<option value="${s.id}" ${s.id === v.site ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></td><td><input class="num" aria-label="${t("VLAN")}" id="vi${i}" value="${v.id}" type="number" min="2" max="4094"></td><td><input aria-label="${t("Nombre VLAN")}" id="vn${i}" value="${esc(v.name)}"></td><td><input aria-label="${t("Subred IPv4 / CIDR (opcional)")}" id="vc${i}" value="${esc(v.ipv4Cidr || "")}" placeholder="${esc(approved ? (state.plan.find(r=>r.key===v.key)?.network ? state.plan.find(r=>r.key===v.key).network+'/'+state.plan.find(r=>r.key===v.key).prefix : t("Asignación automática pendiente")) : t("Asignación automática pendiente"))}" aria-describedby="vlanCidrHelp"></td><td><select aria-label="${t("Servicio")}" id="vr${i}">${optsHTML(roles, v.role)}</select></td><td><input class="num" aria-label="${t("Hosts")}" id="vh${i}" type="number" value="${v.hosts}"></td><td><input aria-label="${t("DHCP local")}" id="vd${i}" type="checkbox" ${v.dhcp ? "checked" : ""}></td><td><button class="small danger" onclick="deleteVlan(${i})">${t("Eliminar")}</button></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">${t("Confirme los datos y genere una propuesta desde Estimación, o agregue sus segmentos manualmente.")}</div>`}</div><button id="vlanNext" class="primary" ${approved?"":"disabled"} onclick="go(5)">${t("Continuar a Topología")}</button>${planTable()}`
        );
      }
      /**
       * Entradas: Filas actuales del formulario.
       * Proceso / salida: Incorpora primero ediciones válidas y añade una clave nueva; falla sin renderizar si otra fila es inválida.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function addVlan() {
        if (state.vlans.length) {
          const pending=safe(readVlans); if (!pending) return; state.vlans=pending;
        }
        formDrafts.delete("vlans"); vlanEditing=false;
        const i = state.vlans.length;
        state.vlans.push({
          key: "v" + Date.now(),
          site: state.sites[selectedSite]?.id || state.sites[0].id,
          id: Math.min(4094, 10 * (i + 1)),
          name: "Nuevo segmento",
          role: "Datos",
          hosts: 20,
          dhcp: true,
          gateway: "",
          ipv4Cidr: "",
        });
        invalidate("plan");
        render();
        toast(t("VLAN añadida a {0}.", [siteName(state.vlans.at(-1).site)]));
      } // Los segmentos nuevos pertenecen a la sede activa.
      /**
       * Entradas: Índice elegido y confirmación del usuario.
       * Proceso / salida: Lee todas las filas antes de eliminar una; conserva texto ante validación fallida e invalida el plan dependiente.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function deleteVlan(i) {
        if (
          confirm(t("¿Eliminar esta VLAN y reiniciar las etapas dependientes?"))
        ) {
          safe(() => {
            const vlans = readVlans();
            vlans.splice(i, 1);
            state.vlans = vlans;
            formDrafts.delete("vlans"); vlanEditing=false;
            invalidate("plan");
            render();
          });
        }
      } // Elimina también el plan que dependía del segmento.
      /**
       * Entradas: Controles de cada VLAN y opciones de direccionamiento visibles.
       * Proceso / salida: Devuelve candidatas validadas; comprueba IDs, gestión e intenciones manuales sin sustituir estado.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function readVlans() {
        const vlans = state.vlans.map((v, i) => ({
          ...v,
          site: $("vs" + i).value,
          id: num($("vi" + i).value, 2, 4094, "VLAN"),
          name: text($("vn" + i).value, "Nombre VLAN", 60),
          ipv4Cidr: $("vc" + i).value.trim(),
          gateway: vlanGatewayIntent(v),
          role: $("vr" + i).value,
          hosts: num($("vh" + i).value, 1, 1000000, "Hosts"),
          dhcp: $("vd" + i).checked,
        }));
        for (const s of state.sites) {
          const rows = vlans.filter((v) => v.site === s.id);
          if (new Set(rows.map((v) => v.id)).size !== rows.length)
            fail(t("VLAN duplicada en {0}", [s.name]));
          if (rows.filter((v) => v.role === "Gestión").length > 1)
            fail(t("Use una sola VLAN de gestión por sede."));
          if (!rows.length) fail(t("Se requiere al menos una VLAN en {0}", [s.name]));
        }
        if (vlans.some((v) => v.ipv4Cidr))
          manualVlanNetworks(
            {
              ...state.project,
              base: $("base").value.trim(),
              growth: num($("growth").value, 0, 100, "Reserva"),
              transitBase: $("transitBase").value.trim(),
            },
            state.sites,
            vlans,
            state.nodes,
          );
        return vlans;
      } // Permite repetir VLAN entre sedes, pero no dentro de una.
      /**
       * Entradas: Sedes, redundancia, interconexión y perfiles opcionales.
       * Proceso / salida: Devuelve solicitudes /30 por clave estable, incluidos firewall y router secundario; no inventa Internet.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function initialTransits() {
        const req = [];
        for (const s of state.sites) {
          for (let k = 0; k < (s.redundant ? 2 : 1); k++)
            req.push({
              key: "t-" + s.id + "-" + k,
              site: s.id,
              name: "Router ↔ Core " + (k + 1),
              kind: "transit",
              hosts: 2,
            });
        }
        for (const site of state.sites) {
          const profile=vendorProfile(site);
          if (profile.firewall) req.push({key:"f-"+site.id,site:site.id,name:"Firewall ↔ Router",kind:"transit",hosts:2});
          if (profile.backupRouter) for (let k=0;k<(site.redundant?2:1);k++) req.push({key:"b-"+site.id+"-"+k,site:site.id,name:"Router secundario ↔ Core",kind:"transit",hosts:2});
        }
        if (state.project.interconnect)
          state.sites
            .slice(1)
            .forEach((s) =>
              req.push({
                key: "w-" + s.id,
                site: "WAN",
                name: state.sites[0].name + " ↔ " + s.name,
                kind: "wan",
                hosts: 2,
              }),
            );
        return req;
      } // WAN en estrella; sedes desconectadas no reciben enlaces entre sí.
      /**
       * Entradas: Fallback candidato, proyecto y lista de sedes.
       * Proceso / salida: Devuelve pools numéricos independientes y reservas; valida RFC1918, alineación y separación.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function allocationPools(base, project = state.project, siteList = state.sites) {
        const b = privateIPv4Block(base, "Bloque global");
        if (b.prefix > 30) fail(t("El bloque base debe ser /30 o mayor."));
        project = { ...project, base };
        validateSiteBlocks(project, siteList);
        const sites = new Map(
          siteList
            .filter((s) => s.ipv4Base)
            .map((s) => [s.id, subnet(s.ipv4Base)]),
        );
        const transit = project.transitBase
          ? privateIPv4Block(project.transitBase, "Bloque de tránsito")
          : null;
        // El tránsito también puede ser independiente, pero nunca invadir LAN.
        if (transit && transit.prefix > 30) fail(t("Tránsito requiere /30 o mayor."));
        return { global: b, sites, transit };
      } // Reservas de pools; nunca modifica el estado confirmado.
      function findIPv4Space(pool, size, blocked) {
        let cursor = Math.ceil(pool.net / size) * size;
        const ranges = blocked
          .filter((r) => r.net <= pool.end && pool.net <= r.end)
          .slice()
          .sort((a, b) => a.net - b.net || a.end - b.end);
        for (const r of ranges) {
          if (r.end < cursor) continue;
          if (cursor + size - 1 < r.net) break;
          cursor = Math.ceil((r.end + 1) / size) * size;
        }
        return cursor + size - 1 <= pool.end ? cursor : null;
      } // Primer hueco CIDR contiguo; no confunde espacio total con alineación.
      function vlanGatewayIntent(v, previousPlan = state.plan) {
        const previous = previousPlan.find((r) => r.key === v.key);
        return previous && previous.gateway === previous.first && v.gateway === previous.first
          ? ""
          : v.gateway;
      } // Reconoce el valor automático anterior sin añadir campos al esquema.
      function manualVlanNetworks(project, sites, vlans, nodes = [], pools = null) {
        const manual = new Map();
        if (!vlans.some((v) => v.ipv4Cidr)) return manual;
        pools = pools || allocationPools(project.base, project, sites);
        for (const v of vlans) {
          if (!v.ipv4Cidr) continue;
          const site = sites.find((s) => s.id === v.site),
            label = t("Sede «{0}», VLAN {1} «{2}»", [site.name, v.id, v.name]),
            network = privateIPv4Block(v.ipv4Cidr, label),
            reserve = site.redundant ? 3 : 1,
            required = Math.ceil(v.hosts * (1 + project.growth / 100)) + reserve,
            pool = pools.sites.get(v.site) || pools.global;
          if (network.prefix > 30)
            fail(t("{0}: /31 y /32 no son aptos para LAN y sus reservas.", [label]));
          if (network.hosts < required)
            fail(t("{0}: capacidad insuficiente; requiere {1} IP útiles, disponibles {2}.", [label, required, network.hosts]));
          if (network.net < pool.net || network.end > pool.end)
            fail(t("{0}: la subred queda fuera del bloque de {1}", [label, site.ipv4Base ? "su sede." : "proyecto."]));
          for (const [id, block] of pools.sites)
            if (id !== v.site && network.net <= block.end && block.net <= network.end)
              fail(t("{0}: la subred invade el bloque reservado de otra sede.", [label]));
          if (pools.transit && network.net <= pools.transit.end && pools.transit.net <= network.end)
            fail(t("{0}: la subred se solapa con el bloque de tránsito.", [label]));
          for (const [key, other] of manual)
            if (network.net <= other.end && other.net <= network.end)
              fail(t("{0}: la subred se solapa con la VLAN «{1}».", [label, vlans.find((x) => x.key === key).name]));
          if (v.gateway) {
            let valid = false;
            try { valid = isHost(v.gateway, network); } catch (e) { /* Se informa con contexto de sede/VLAN. */ }
            if (!valid)
              fail(t("{0}: gateway manual inválido o fuera de la subred.", [label]));
            if (nodes.some((n) => n.network === v.key && n.ip === v.gateway))
              fail(t("{0}: gateway manual en conflicto con una IP reservada a un equipo.", [label]));
          }
          manual.set(v.key, network);
        }
        return manual;
      } // Valida y reserva intenciones; no asigna ni sustituye el plan efectivo.
      /**
       * Entradas: VLAN candidatas, fallback, crecimiento, solicitudes de tránsito y proyecto candidato.
       * Proceso / salida: Reserva manuales y redes no afectadas válidas; busca huecos CIDR en cada pool y devuelve un plan completo o lanza error.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function allocate(vlans, base, growth, transits, project = state.project) {
        const pools = allocationPools(base, project),
          manual = manualVlanNetworks({ ...project, base, growth }, state.sites, vlans, state.nodes, pools),
          b = pools.global,
          scoped = pools.sites.size > 0 || pools.transit !== null || manual.size > 0 || state.plan.length > 0,
          reserved = [...pools.sites.values(), ...(pools.transit ? [pools.transit] : [])],
          assigned = [...manual.values()];
        const fixed=new Map(manual);
        for (const v of vlans) {
          if (fixed.has(v.key)) continue;
          const old=state.plan.find(r => r.key===v.key && r.kind==="vlan"),
            previous=state.vlans.find(r => r.key===v.key), site=state.sites.find(s=>s.id===v.site),
            pool=pools.sites.get(v.site)||b;
          if (!old || !previous || previous.site!==v.site || previous.hosts!==v.hosts || previous.id!==v.id || old.required!==Math.ceil(v.hosts*(1+growth/100))+(site.redundant?3:1)) continue;
          if (old.net<pool.net || old.end>pool.end) continue;
          const blocked=[...assigned,...(pool===b?reserved:[])];
          if (blocked.some(r=>old.net<=r.end && r.net<=old.end)) continue;
          fixed.set(v.key,subnet(old.network+"/"+old.prefix)); assigned.push(old);
        }
        // Mantener /30 ya válidas evita renumerar enlaces de sedes no editadas.
        for (const transit of transits) {
          const old=state.plan.find(r=>r.key===transit.key && r.kind!=="vlan"), pool=pools.transit||b;
          if (!old || old.net<pool.net || old.end>pool.end || old.prefix!==30) continue;
          if ([...assigned,...(pool===b?reserved:[])].some(r=>old.net<=r.end && r.net<=old.end)) continue;
          fixed.set(transit.key,subnet(old.network+"/30")); assigned.push(old);
        }
        const req = vlans
          .map((v) => {
            const s = state.sites.find((s) => s.id === v.site),
              reserve = s.redundant ? 3 : 1,
              need = Math.ceil(v.hosts * (1 + growth / 100)) + reserve;
            const bits = Math.max(2, Math.ceil(Math.log2(need + 2)));
            return {
              ...v,
              kind: "vlan",
              reserve,
              required: need,
              prefix: fixed.get(v.key)?.prefix ?? 32 - bits,
              size: fixed.get(v.key)?.total ?? 2 ** bits,
            };
          })
          .concat(
            transits.map((t) => ({
              ...t,
              reserve: 0,
              required: 2,
              prefix: 30,
              size: 4,
            })),
          )
          .sort((a, b) => b.size - a.size || a.key.localeCompare(b.key));
        let cursor = b.net;
        const result = [];
        for (const r of req) {
          const pool = r.kind === "vlan"
            ? pools.sites.get(r.site) || b
            : pools.transit || b;
          cursor = fixed.has(r.key)
            ? fixed.get(r.key).net
            : scoped
            ? findIPv4Space(pool, r.size, [
                ...assigned,
                ...(pool === b ? reserved : []),
              ])
            : Math.ceil(cursor / r.size) * r.size;
          if (cursor === null || cursor + r.size - 1 > pool.end) {
            const site=state.sites.find(s=>s.id===r.site),
              total=req.filter(x=>x.site===r.site && x.kind==="vlan").reduce((n,x)=>n+2**Math.max(2,Math.ceil(Math.log2(x.required+2))),0),
              minimum=site?.ipv4Base && r.kind==="vlan" && !vlans.some(v=>v.site===r.site && v.ipv4Cidr) && total>pool.total
                ? t("Mínimo por capacidad del conjunto: /{0}.",[32-Math.ceil(Math.log2(total))]) : "";
            lastVlanFocus=r.kind==="vlan" ? "vh"+vlans.findIndex(v=>v.key===r.key) : "transitBase";
            fail(t("{0}: bloque {1}/{2}; hosts {3}, crecimiento {4}%, reserva {5}, requiere {6} IP útiles y /{7} ({8} direcciones). No existe hueco contiguo suficiente. {9}",[r.kind==="vlan"?siteName(r.site)+" · VLAN "+r.id+" «"+r.name+"»":r.name,pool.network,pool.prefix,r.hosts,growth,r.reserve,r.required,r.prefix,r.size,minimum]));
          }
          const info = subnet(ipStr(cursor) + "/" + r.prefix);
          const row = {
            ...r,
            ...info,
            key: r.key,
            site: r.site,
            kind: r.kind,
            hostsRequested: r.hosts,
            available: info.hosts - r.reserve,
            gateway: r.kind === "vlan" ? r.gateway || info.first : "",
            reserve: r.reserve,
          };
          if (row.gateway && !isHost(row.gateway, row))
            fail(
              t("Gateway de {0} fuera de su nueva subred. Bórrelo antes de recalcular.", [r.name]),
            );
          result.push(row);
          if (!fixed.has(r.key)) assigned.push({ net: info.net, end: info.end });
          cursor += r.size;
        }
        return result;
      } // Alineación matemática al tamaño del bloque, con límite de capacidad.
      /**
       * Entradas: Formulario visible y último diseño confirmado.
       * Proceso / salida: Calcula antes de guardar; error conserva todo, igualdad mantiene aprobación y cambios invalidan dependencias diferenciales.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      /** Actualiza aprobación/previsualizaciones sin reconstruir ni perder el formulario. */
      function updateVlanStatus() {
        const approved=confirmedPlan();
        if($("vlanNext")) $("vlanNext").disabled=!approved;
        if($("vlanStatus")) { $("vlanStatus").textContent=t(approved?"VLAN confirmadas":"Pendiente de confirmación"); $("vlanStatus").className="badge"+(approved?"":" warn"); }
        state.vlans.forEach((v,i)=>{const el=$("vc"+i),r=state.plan.find(r=>r.key===v.key);if(el)el.placeholder=approved&&r?r.network+"/"+r.prefix:t("Asignación automática pendiente");});
      }
      function confirmVlans() {
        lastVlanFocus="base";
        const result=safe(() => {
          projectValid();
          if (!state.vlans.length) fail(t("Añada VLAN antes de calcular."));
          const vlans = readVlans(),
            base = $("base").value.trim(),
            growth = num($("growth").value, 0, 100, "Reserva"),
            dns = ipStr(ipNum($("dns").value.trim()));
          const transitBase = $("transitBase").value.trim();
          // El asignador recibe una intención candidata; no muta el proyecto.
          const plan = allocate(vlans, base, growth, initialTransits(), { ...state.project, transitBase });
          if (state.ipv6Plan.length && (state.ipv6Plan.length !== vlans.length ||
              state.ipv6Plan.some((r) => !vlans.some((v) => v.key === r.key && v.site === r.site)))) state.ipv6Plan = [];
          const unchanged = state.approved && base===state.project.base && growth===state.project.growth && dns===state.project.dns && transitBase===state.project.transitBase && JSON.stringify(plan)===JSON.stringify(state.plan);
          vlanEditing = false;
          formDrafts.delete("vlans");
          if (unchanged) { render(); toast(t("VLAN confirmadas")); return; }
          // Dependencias diferenciales: conservar equipos y CLI de sedes no afectadas.
          const changedSites=new Set(state.sites.filter(site => JSON.stringify(state.plan.filter(r=>r.kind==="vlan" && r.site===site.id))!==JSON.stringify(plan.filter(r=>r.kind==="vlan" && r.site===site.id))).map(site=>site.id));
          const changedTransits=new Set([...state.plan,...plan].filter(r=>r.kind!=="vlan" && !plan.some(n=>n.key===r.key && n.network===r.network && n.prefix===r.prefix) || r.kind!=="vlan" && !state.plan.some(n=>n.key===r.key && n.network===r.network && n.prefix===r.prefix)).map(r=>r.key));
          const affected=new Set(state.nodes.filter(n=>changedSites.has(n.site)).map(n=>n.id));
          state.links.filter(l=>changedTransits.has(l.network)).forEach(l=>{affected.add(l.a);affected.add(l.b);});
          const removed=new Set(state.nodes.filter(n=>n.autoKey && changedSites.has(n.site)).map(n=>n.id));
          state.links.filter(l=>removed.has(l.a)||removed.has(l.b)).forEach(l=>{affected.add(l.a);affected.add(l.b);});
          state.project = { ...state.project, base, growth, dns, transitBase };
          state.vlans = vlans;
          state.plan = plan;
          state.nodes = state.nodes.filter(n=>!removed.has(n.id));
          state.links = state.links.filter(l=>!removed.has(l.a)&&!removed.has(l.b));
          refreshPhysicalProfiles();
          state.configs = Object.fromEntries(Object.entries(state.configs).filter(([key])=>![...affected].some(id=>key.startsWith(id+"-"))));
          state.approved = true;
          state.revision++;
          Object.values(state.configs).forEach(item=>item.revision=state.revision);
          render();
          toast(t("VLSM validado y confirmado. Continúe con la topología."));
        });
        if (result===false) {
          vlanEditing=true;
          updateVlanStatus();
          ($(lastVlanFocus)||$("base"))?.focus();
        }
      } // Nada se guarda si una VLAN o el bloque resultan inválidos.
      /**
       * Entradas: Filas efectivas del plan.
       * Proceso / salida: Devuelve tabla de redes/gateways/capacidad y origen manual o automático; no confunde intención con resultado.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function planTable() {
        if (!state.plan.length) return "";
        return `<div class="card"><div class="headingrow"><h2>${t("Plan confirmado ·")} ${state.project.base}</h2><button onclick="downloadPlan()">${t("Descargar CSV")}</button></div><div class="tablewrap"><table><thead><tr><th>${t("Sede")}</th><th>${t("VLAN / enlace")}</th><th>${t("Nombre")}</th><th>${t("Solicitados")}</th><th>${t("Disponibles terminales")}</th><th>${t("Red")}</th><th>${t("Prefijo")}</th><th>${t("Máscara")}</th><th>${t("Gateway")}</th><th>${t("Primera IP")}</th><th>${t("Última IP")}</th><th>${t("Broadcast")}</th><th>${t("Verificar")}</th></tr></thead><tbody>${state.plan.map((r, i) => `<tr><td>${esc(siteName(r.site))}</td><td>${r.kind === "vlan" ? r.id : r.kind.toUpperCase()}${r.kind === "vlan" ? `<br><small>${t(r.ipv4Cidr ? "Manual" : "Automática")}</small>` : ""}</td><td>${esc(r.name)}</td><td>${r.hostsRequested}</td><td>${r.available}</td><td class="mono">${r.network}</td><td>/${r.prefix}</td><td class="mono">${r.mask}</td><td>${r.gateway ? `<button class="small mono" onclick="editGateway('${r.key}')">${r.gateway}</button>` : "—"}</td><td class="mono">${r.first}</td><td class="mono">${r.last}</td><td class="mono">${r.broadcast}</td><td><button class="small" onclick="inspectSubnet(${i})">${t("Validar")}</button></td></tr>`).join("")}</tbody></table></div><small>${t("Disponible = capacidad utilizable menos las direcciones de gateway/cores. El rango utilizable muestra también las IP reservadas; DHCP las excluye.")}</small></div>`;
      } // Las mismas filas alimentan subnetting, topología y CLI.
      function editGateway(key) {
        safe(() => {
          const r = state.plan.find((r) => r.key === key),
            v = prompt(
              t("Nuevo gateway dentro de {0}/{1} (vacío = selección automática)", [r.network, r.prefix]),
              r.gateway,
            );
          if (v === null) return;
          const custom = v.trim();
          const actual = custom || r.first;
          if (!isHost(actual, r))
            fail(t("Gateway fuera de la subred o reservado como red/broadcast."));
          if (state.nodes.some((n) => n.site === r.site && n.ip === actual))
            fail(t("La dirección ya está asignada a un equipo."));
          r.gateway = ipStr(ipNum(actual));
          state.vlans.find((v) => v.key === key).gateway = custom
            ? r.gateway
            : "";
          state.nodes = [];
          state.links = [];
          state.configs = {};
          state.revision++;
          render();
          toast(t("Gateway confirmado; regenere la topología."));
        });
      } // Un cambio de gateway nunca deja interfaces antiguas activas.
      function inspectSubnet(i) {
        state.calc = state.plan[i].network + "/" + state.plan[i].prefix;
        go(4);
      } // Verificación integrada de una fila del plan.
      /**
       * Entradas: Último cálculo y plan IPv4/IPv6.
       * Proceso / salida: Devuelve resultados completos sin el desplegable retirado; las funciones matemáticas permanecen separadas.
       * Seguridad: cadenas de usuario se validan o escapan; no se ejecutan CLI.
       */
      function subnetView() {
        const val = state.calc || "192.168.10.50/26";
        let result = "";
        try {
          const r = addressCalculation(val);
          result = addressResult(r);
        } catch (e) {
          result = `<div class="notice error">${esc(e.message)}</div>`;
        }
        return (
          title(
            t("Subnetting IPv4 / IPv6"),
            t("Compruebe IPv4/CIDR o IPv6/prefijo. IPv4: /31 punto a punto y /32 dirección única. IPv6: rango completo, sin broadcast ni descuento de dos direcciones."),
          ) +
          `<div class="card"><div class="grid">${field(t("Dirección IPv4 o IPv6 / prefijo CIDR"), "calc", val)}<div class="field"><label>${t("Acciones")}</label><div class="actions"><button class="primary" onclick="calculate()">${t("Calcular")}</button><button onclick="state.calc='192.168.10.50/26';render()">${t("Ejemplo obligatorio /26")}</button></div></div></div></div><div id="calcResult">${result}</div>${state.plan.length ? `<div class="card"><h3>${t("Validar una red del proyecto")}</h3><div class="chips">${state.plan.map((r, i) => `<button style="white-space:normal;overflow-wrap:anywhere;max-width:100%" onclick="inspectSubnet(${i})">${esc(siteName(r.site))} · ${esc(r.name)} · ${r.network}/${r.prefix}</button>`).join("")}</div></div>` : ""}`
        );
      }
      function subnetResult(r) {
        const rows = {
          "IP ingresada": r.ip,
          "Prefijo CIDR": "/" + r.prefix,
          "Máscara decimal": r.mask,
          "Máscara binaria": r.binary,
          "Dirección de red": r.network,
          Broadcast: r.broadcast,
          "Primer host": r.first,
          "Último host": r.last,
          "Direcciones totales": r.total,
          "Hosts utilizables": r.hosts,
          "Bits de red": r.prefix,
          "Bits de host": r.hostbits,
          "Tipo de IP": r.type,
        };
        return `<div class="card"><h2>${t("Resultado calculado")}</h2><div class="metrics">${[
          ["Red", r.network],
          ["Broadcast", r.broadcast],
          ["Hosts", r.hosts],
          [t("Máscara"), r.mask],
        ]
          .map(
            ([k, v]) =>
              `<div class="metric"><strong style="font-size:20px">${v}</strong><span>${t(k)}</span></div>`,
          )
          .join(
            "",
          )}</div><div class="tablewrap" style="margin-top:16px"><table>${Object.entries(
