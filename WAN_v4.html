<!DOCTYPE html>
<!-- WAN Architect: aplicación autónoma; no ejecuta comandos sobre equipos reales. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WAN Architect · Diseño empresarial</title>
    <meta
      name="description"
      content="Diseño WAN local, VLSM, topología y propuestas Cisco IOS / Huawei VRP."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1830'/%3E%3Cpath d='M8 9h16v6H8zM8 22h16M16 15v7' fill='none' stroke='%235ee2c1' stroke-width='3'/%3E%3C/svg%3E"
    />
    <style>
      /* Variables de color compartidas por todas las etapas. */
      :root {
        --bg: #f2f5fa;
        --ink: #17273f;
        --muted: #64748b;
        --line: #dce3ed;
        --nav: #101e35;
        --accent: #087f71;
        --blue: #2869b6;
        --white: #fff;
        --warn: #aa6200;
        --red: #bb3543;
      }
      /* La estructura conserva el menú en escritorio y permite apilarlo en móvil. */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.55 system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      a {
        color: var(--blue);
      }
      aside {
        position: fixed;
        width: 240px;
        inset: 0 auto 0 0;
        background: var(--nav);
        color: white;
        padding: 28px 18px;
        overflow: auto;
      }
      main {
        margin-left: 240px;
        max-width: 1700px;
        padding: 26px 36px 80px;
      }
      .brand {
        font-size: 22px;
        font-weight: 750;
        letter-spacing: -0.7px;
      }
      .brand b {
        color: #61ddc3;
      }
      .subbrand {
        color: #9bacc5;
        font-size: 11px;
        letter-spacing: 2px;
        margin-bottom: 30px;
      }
      nav button {
        border: 0;
        background: transparent;
        color: #bdcce0;
        width: 100%;
        text-align: left;
        padding: 11px 12px;
        border-radius: 7px;
        margin: 2px 0;
      }
      nav button.active {
        background: #233c55;
        color: #74e3cf;
      }
      nav button span {
        font: 11px monospace;
        margin-right: 12px;
        opacity: 0.6;
      }
      .local {
        border-top: 1px solid #34445c;
        margin-top: 25px;
        padding: 18px 10px;
        color: #9bacc5;
        font-size: 12px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 30px;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--accent);
        text-transform: uppercase;
      }
      h1 {
        font-size: 32px;
        line-height: 1.2;
        letter-spacing: -1px;
        margin: 10px 0;
      }
      h2 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        margin: 6px 0 18px;
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      button,
      .filebtn {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
        color: var(--ink);
        padding: 8px 12px;
        display: inline-block;
        white-space: nowrap;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      button.danger {
        color: var(--red);
      }
      button:hover,
      .filebtn:hover {
        filter: brightness(0.96);
      }
      button.small {
        padding: 4px 9px;
        font-size: 12px;
      }
      .card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 22px;
        margin: 18px 0;
        box-shadow: 0 3px 9px #17273f03;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 16px;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      label {
        font-size: 12px;
        font-weight: 650;
        color: #465a73;
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #cfd9e6;
        border-radius: 5px;
        padding: 9px 10px;
        color: var(--ink);
        background: white;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid #71c5b8;
        outline-offset: 1px;
      }
      input[type="checkbox"] {
        width: auto;
        accent-color: var(--accent);
      }
      textarea {
        min-height: 90px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
      }
      .hint,
      small {
        color: var(--muted);
        font-size: 12px;
      }
      .notice {
        border-left: 3px solid var(--accent);
        background: #eef9f5;
        border-radius: 3px;
        padding: 12px 16px;
        margin: 14px 0;
      }
      .notice.warn {
        border-color: #df9a38;
        background: #fff6e7;
        color: #895820;
      }
      .notice.error {
        border-color: var(--red);
        background: #fff0f1;
        color: var(--red);
      }
      .badge {
        display: inline-block;
        background: #e7f7f1;
        color: var(--accent);
        font-size: 11px;
        border-radius: 20px;
        padding: 3px 9px;
      }
      .badge.warn {
        background: #fff0d9;
        color: var(--warn);
      }
      .badge.dim {
        background: #eaf0f7;
        color: var(--muted);
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 14px;
      }
      .metric {
        padding: 18px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      .metric strong {
        display: block;
        font-size: 29px;
        font-weight: 650;
      }
      .metric span {
        color: var(--muted);
        font-size: 12px;
      }
      .tablewrap {
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      th {
        text-align: left;
        background: #f6f8fc;
        color: #617289;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        white-space: nowrap;
      }
      th,
      td {
        padding: 11px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      td input,
      td select {
        padding: 5px;
        min-width: 90px;
      }
      td .num {
        min-width: 65px;
        width: 72px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      .console {
        background: #102139;
        color: #d2e7ed;
        font:
          12px/1.6 ui-monospace,
          Consolas,
          monospace;
        padding: 20px;
        border-radius: 8px;
        white-space: pre;
        overflow: auto;
        min-height: 220px;
        max-height: 650px;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 45px;
      }
      .stepfoot {
        display: flex;
        justify-content: space-between;
        margin-top: 25px;
      }
      .sitehead {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 18px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        background: #eef4fb;
        padding: 7px 12px;
        border-radius: 5px;
        font-size: 12px;
      }
      .diagram {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fbff;
      }
      .diagram svg {
        display: block;
        min-width: 650px;
      }
      svg text {
        font-family: system-ui, sans-serif;
      }
      svg .node {
        cursor: grab;
      }
      svg .node:hover rect {
        stroke: #087f71;
        stroke-width: 2;
      }
      .imageframe {
        position: relative;
        overflow: auto;
        max-height: 650px;
        background: #e8edf5;
      }
      .imageframe img {
        display: block;
        max-width: 100%;
        max-height: 600px;
      }
      .imageframe svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .progressline {
        display: flex;
        gap: 4px;
        margin-bottom: 25px;
      }
      .progressline div {
        height: 4px;
        flex: 1;
        background: #dbe5ef;
        border-radius: 8px;
      }
      .progressline div.done {
        background: var(--accent);
      }
      details {
        margin: 10px 0;
      }
      summary {
        cursor: pointer;
        color: var(--blue);
        font-weight: 600;
      }
      .toast {
        position: fixed;
        right: 25px;
        bottom: 25px;
        background: var(--nav);
        color: white;
        padding: 14px 22px;
        border-radius: 8px;
        z-index: 100;
        max-width: 500px;
      }
      .toast.error {
        background: #a32e3c;
      }
      .headingrow {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 10px;
      }
      .quote {
        border-left: 2px solid #cee5de;
        padding-left: 16px;
      }
      dialog {
        border: 0;
        border-radius: 12px;
        width: min(700px, 94vw);
        max-height: 90vh;
        box-shadow: 0 15px 70px #001a4c44;
        padding: 24px;
      }
      dialog::backdrop {
        background: #101e3570;
      }
      dialog .actions {
        margin-top: 20px;
      }
      .statuslist {
        display: grid;
        gap: 8px;
      }
      .statusrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .port {
        font-size: 10px;
        color: var(--muted);
      }
      .toolbar {
        background: #edf3f9;
        padding: 12px;
        border-radius: 8px;
        margin: 12px 0;
      }
      .hidden {
        display: none !important;
      }
      .sitecount {
        min-width: 190px;
      }
      ul {
        padding-left: 20px;
      }
      li {
        margin: 5px 0;
      }
      /* Impresión genera un informe sin la navegación ni las acciones interactivas. */
      @media (max-width: 950px) {
        aside {
          position: static;
          width: auto;
          padding: 15px;
        }
        aside .subbrand,
        aside .local {
          display: none;
        }
        nav {
          display: flex;
          overflow: auto;
          margin-top: 10px;
        }
        nav button {
          width: auto;
          white-space: nowrap;
        }
        main {
          margin: 0;
          padding: 20px;
        }
        .two {
          grid-template-columns: 1fr;
        }
        .topbar {
          flex-wrap: wrap;
        }
        h1 {
          font-size: 27px;
        }
      }
      @media print {
        aside,
        .topbar,
        .stepfoot,
        button,
        .filebtn {
          display: none !important;
        }
        main {
          margin: 0;
          padding: 0;
        }
        .card {
          break-inside: avoid;
        }
        .console {
          max-height: none;
          white-space: pre-wrap;
          color: black;
          background: white;
        }
        .diagram {
          overflow: visible;
        }
        body {
          background: white;
        }
      }
    </style>
  </head>
  <body>
    <!-- Menú: cada etapa consume los datos validados de las anteriores. -->
    <aside>
      <div class="brand">WAN <b>Architect</b></div>
      <div class="subbrand">DISEÑO · PLAN · CONFIGURACIÓN</div>
      <nav id="nav"></nav>
      <div class="local">
        ● Aplicación local y autónoma<br />Los comandos se revisan y aplican
        manualmente.<br /><br />Segundo corte · Telecomunicaciones
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div>
          <span class="eyebrow">Workspace de ingeniería</span>
          <div id="projectLabel">Proyecto sin guardar</div>
        </div>
        <div class="actions">
          <button onclick="saveLocal()">Guardar proyecto</button
          ><button onclick="loadLocal()">Cargar guardado</button
          ><button onclick="exportJSON()">Exportar JSON</button
          ><label class="filebtn"
            >Importar JSON<input
              type="file"
              accept=".json,application/json"
              class="hidden"
              onchange="importJSON(this)" /></label
          ><button onclick="newProject()">Nuevo</button>
        </div>
      </header>
      <div id="progress" class="progressline"></div>
      <section id="view"></section>
      <footer id="stepfoot" class="stepfoot"></footer>
    </main>
    <!-- Un único diálogo sirve para editar equipos, enlaces y confirmar datos. -->
    <dialog id="modal"><div id="modalbody"></div></dialog>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <script>
      "use strict"; // Impide variables globales accidentales y mantiene errores visibles durante desarrollo.
      /* =================== Estado, validadores y aritmética IPv4 =================== */
      const $ = (id) => document.getElementById(id); // Acceso centralizado a elementos por ID.
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        ); // Evita inyectar HTML desde nombres y JSON importados.
      const steps = [
        "Resumen",
        "Datos del proyecto",
        "Estimación e infraestructura",
        "VLAN y VLSM",
        "Subnetting IPv4",
        "Topología",
        "Configuración Cisco",
        "Configuración Huawei",
        "Comparación",
        "Ciberdefensa y uso de IA",
        "Evidencias Corte 2",
      ]; // Etapas visibles del flujo.
      const kinds = [
        "Router",
        "Switch",
        "Switch capa 3",
        "Firewall",
        "Access Point",
        "Servidor",
        "PC",
        "ISP",
      ]; // Tipos de nodos admitidos.
      const roles = [
        "Datos",
        "WiFi",
        "VoIP",
        "CCTV",
        "Impresoras",
        "Servidores",
        "Gestión",
        "Invitados",
        "Clínica",
      ]; // Categorías de segmentación.
      const countKeys = [
        "pc",
        "mobile",
        "phones",
        "printers",
        "ap",
        "cameras",
        "servers",
      ]; // Inventario de terminales, sin duplicar teléfonos móviles.
      const countLabels = {
        pc: "Computadores",
        mobile: "Móviles / teléfonos personales",
        phones: "Teléfonos IP",
        printers: "Impresoras",
        ap: "Access Points",
        cameras: "Cámaras IP",
        servers: "Servidores",
      }; // Etiquetas del inventario.
      let page = 0,
        selectedSite = 0,
        selectedNode = "",
        imageData = "",
        imageMode = false; // Preferencias temporales de la interfaz.
      let state = fresh(); // Se inicia vacío; los datos de demostración solo se cargan por acción explícita.
      function fresh() {
        return {
          version: 2,
          project: {
            name: "",
            company: "",
            activity: "",
            type: "Oficina",
            interconnect: true,
            segmentation: "Servicios",
            base: "10.20.0.0/16",
            growth: 20,
            dns: "1.1.1.1",
          },
          sites: [siteDefault(1)],
          vlans: [],
          plan: [],
          nodes: [],
          links: [],
          approved: false,
          configs: {},
          opts: {
            basic: true,
            ssh: true,
            vlans: true,
            interfaces: true,
            ospf: true,
            dhcp: true,
            relay: false,
            static: false,
          },
          relay: "",
          staticNext: "",
          staticReason: "",
          revision: 0,
        };
      } // Esquema exportable, sin credenciales.
      function siteDefault(n) {
        return {
          id: "s" + n,
          name: "Sede " + n,
          floors: 1,
          users: 25,
          ratio: 2,
          busy: "1",
          areas: "Administración, Operaciones",
          wifi: true,
          voip: false,
          cctv: false,
          printing: true,
          server: false,
          redundant: false,
          bandwidth: 0,
          counts: null,
        };
      } // Valores iniciales editables y explícitos.
      function fail(msg) {
        throw Error(msg);
      } // Todas las validaciones fallan antes de modificar el estado.
      function num(v, min, max, label, integer = true) {
        const n = Number(v);
        if (
          v === "" ||
          !Number.isFinite(n) ||
          n < min ||
          n > max ||
          (integer && !Number.isInteger(n))
        )
          fail(
            label +
              ": valor entre " +
              min +
              " y " +
              max +
              (integer ? " (entero)." : "."),
          );
        return n;
      } // Límites numéricos compartidos.
      function text(v, label, max = 100) {
        v = String(v ?? "").trim();
        if (!v || v.length > max || /[\u0000-\u001f]/.test(v))
          fail(label + ": texto obligatorio, máximo " + max + " caracteres.");
        return v;
      } // Valida texto; el render siempre lo escapa.
      function hostname(v) {
        v = text(v, "Hostname", 63);
        if (!/^[A-Za-z][A-Za-z0-9-]*$/.test(v) || v.endsWith("-"))
          fail("Hostname: iniciar con letra y usar letras, números o guiones.");
        return v;
      } // También evita introducir comandos nuevos.
      function commandName(v) {
        return (
          String(v)
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-zA-Z0-9_-]/g, "_")
            .slice(0, 32) || "RED"
        );
      } // Convierte etiquetas humanas a identificadores de CLI.
      function ipNum(ip) {
        if (typeof ip !== "string" || !/^\d{1,3}(\.\d{1,3}){3}$/.test(ip))
          fail("IPv4 inválida: " + ip);
        const a = ip.split(".").map(Number);
        if (a.some((n) => n > 255)) fail("IPv4 inválida: " + ip);
        return a.reduce((n, o) => n * 256 + o, 0);
      } // Aritmética de enteros sin signo, segura incluso con /0.
      function ipStr(n) {
        return [24, 16, 8, 0]
          .map((b) => Math.floor(n / 2 ** b) % 256)
          .join(".");
      } // Convierte un número de 32 bits a decimal con puntos.
      function ipType(n) {
        const a = Math.floor(n / 16777216),
          b = Math.floor(n / 65536) % 256;
        if (a === 127) return "Loopback";
        if (
          a === 10 ||
          (a === 172 && b >= 16 && b <= 31) ||
          (a === 192 && b === 168)
        )
          return "Privada RFC 1918";
        if (a === 169 && b === 254) return "Link-local";
        if (a >= 224 && a <= 239) return "Multicast";
        if (a === 0 || a >= 240 || n === 4294967295) return "Reservada";
        if (a === 100 && b >= 64 && b <= 127) return "Compartida CGNAT";
        const third = Math.floor(n / 256) % 256;
        if (
          (a === 192 && b === 0 && (third === 0 || third === 2)) ||
          (a === 198 &&
            (b === 18 || b === 19 || (b === 51 && third === 100))) ||
          (a === 203 && b === 0 && third === 113)
        )
          return "Especial / documentación (ver IANA)";
        return "Pública (clasificación preliminar)";
      } // No confunde multicast ni loopback con IP privada.
      function subnet(value) {
        const m = String(value)
          .trim()
          .match(/^([^/]+)\/(\d{1,2})$/);
        if (!m) fail("Ingrese IPv4/CIDR, por ejemplo 192.168.10.50/26.");
        const ip = ipNum(m[1]),
          p = num(m[2], 0, 32, "CIDR"),
          size = 2 ** (32 - p),
          net = Math.floor(ip / size) * size,
          last = net + size - 1,
          mask = 4294967296 - size;
        return {
          ip: ipStr(ip),
          prefix: p,
          mask: ipStr(mask),
          binary: ipStr(mask)
            .split(".")
            .map((x) => (+x).toString(2).padStart(8, "0"))
            .join("."),
          network: ipStr(net),
          broadcast: p >= 31 ? "No aplica (/31 o /32)" : ipStr(last),
          first: ipStr(net + (p < 31 ? 1 : 0)),
          last: ipStr(last - (p < 31 ? 1 : 0)),
          hosts: p < 31 ? size - 2 : size,
          total: size,
          net,
          end: last,
          type: ipType(ip),
          hostbits: 32 - p,
        };
      } // /31 se interpreta solo como punto a punto; /32 es una única dirección.
      function isHost(ip, row) {
        const n = ipNum(ip);
        return n > row.net && n < row.end;
      } // Las VLAN de esta herramienta siempre utilizan /30 o redes mayores.
      function safe(fn) {
        try {
          return fn();
        } catch (e) {
          toast(e.message, true);
          return false;
        }
      } // Las acciones muestran errores comprensibles sin dejar mutaciones parciales.
      function toast(msg, error = false) {
        $("toast").textContent = msg;
        $("toast").className = "toast" + (error ? " error" : "");
        clearTimeout(toast.timer);
        toast.timer = setTimeout(
          () => $("toast").classList.add("hidden"),
          6000,
        );
      } // Aviso accesible de guardado, validación o error.
      function invalidate(level = "project") {
        state.revision++;
        state.configs = {};
        if (level === "project") {
          state.vlans = [];
          state.plan = [];

      } // Solo se reconstruye la etapa visible.

          routers: 1,
          access,
          distribution,
          core,

          servers: c.servers,
          ports,

      } // 44 puertos útiles por switch de 48 deja cuatro para uplinks y expansión.

      } // Evita generar propuestas sin datos obligatorios.

rio", "sratio", s.ratio, "number", 'min="1" max="10" step="0.1"')}${field("Pisos más concurridos (separados por coma)", "sbusy", s.busy)}${field("Áreas / departamentos (separados por coma)", "sareas", s.areas)}${field("Ancho de banda Mbps (0 = sugerir)", "sbw", s.bandwidth, "number", 'min="0" max="100000"')}</div><div class="grid" style="margin-top:16px">${[

      function estimateView() {

            .map((s, i) => {

      function saveCounts(i) {

            } else add("Usuarios", "Datos", c.pc);

      } // El tipo de actividad modifica invitados y clasificación clínica.
      /* =================== VLAN, VLSM y gateway =================== */
      function siteName(id) {
        return state.sites.find((s) => s.id === id)?.name || "WAN";
      } // Traduce referencias estables a nombres visibles.
      function vlanView() {

          title(
            "VLAN y plan de direccionamiento",

          ) +
          `<div class="card"><div class="grid">${field("Bloque IPv4 base", "base", state.project.base)}${field("Reserva de crecimiento (%)", "growth", state.project.growth, "number", 'min="0" max="100"')}${field("DNS para DHCP", "dns", state.project.dns)}</div><div class="notice">Hosts solicitados son terminales; el cálculo añade crecimiento y una IP de gateway, o tres IP si hay dos cores. El gateway no cuenta como host disponible para terminales. Las redes de tránsito son /30 y no usan VLAN.</div><div class="actions"><button onclick="proposeVlans()">Volver a proponer</button><button onclick="addVlan()">Agregar VLAN</button><button class="primary" onclick="confirmVlans()">Confirmar VLAN y calcular VLSM</button></div></div><div class="card"><h2>Segmentos editables por sede</h2>${state.vlans.length ? `<div class="tablewrap"><table><thead><tr><th>Sede</th><th>VLAN</th><th>Nombre</th><th>Servicio</th><th>Hosts terminales</th><th>DHCP local</th><th>Acción</th></tr></thead><tbody>${state.vlans.map((v, i) => `<tr><td><select id="vs${i}" aria-label="Sede de VLAN">${state.sites.map((s) => `<option value="${s.id}" ${s.id === v.site ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></td><td><input class="num" aria-label="VLAN" id="vi${i}" value="${v.id}" type="number" min="2" max="4094"></td><td><input aria-label="Nombre VLAN" id="vn${i}" value="${esc(v.name)}"></td><td><select aria-label="Servicio" id="vr${i}">${optsHTML(roles, v.role)}</select></td><td><input class="num" aria-label="Hosts" id="vh${i}" type="number" value="${v.hosts}"></td><td><input aria-label="DHCP local" id="vd${i}" type="checkbox" ${v.dhcp ? "checked" : ""}></td><td><button class="small danger" onclick="deleteVlan(${i})">Eliminar</button></td></tr>`).join("")}</tbody></table></div>` : '<div class="empty">Confirme los datos y genere una propuesta desde Estimación, o agregue sus segmentos manualmente.</div>'}</div>${planTable()}<details class="card"><summary>¿Qué significan VLSM, CIDR y gateway?</summary><p>VLSM asigna tamaños diferentes a las subredes. CIDR /n indica cuántos bits identifican la red. El gateway es la dirección del equipo que lleva el tráfico fuera de la VLAN. Una VLAN separa dominios de broadcast; necesita políticas de acceso para aportar aislamiento de seguridad.</p></details>`
        );
      }
      function addVlan() {
        const i = state.vlans.length;
        state.vlans.push({
          key: "v" + Date.now(),
          site: state.sites[selectedSite]?.id || state.sites[0].id,

      } // Los segmentos nuevos pertenecen a la sede activa.
      function deleteVlan(i) {
        if (
          confirm("¿Eliminar esta VLAN y reiniciar las etapas dependientes?")
        ) {
          state.vlans.splice(i, 1);
          invalidate("plan");
          render();
        }
      } // Elimina también el plan que dependía del segmento.
      function readVlans() {
        const vlans = state.vlans.map((v, i) => ({
          ...v,
          site: $("vs" + i).value,
          id: num($("vi" + i).value, 2, 4094, "VLAN"),

          if (new Set(rows.map((v) => v.id)).size !== rows.length)
            fail("VLAN duplicada en " + s.name);
          if (rows.filter((v) => v.role === "Gestión").length > 1)
            fail("Use una sola VLAN de gestión por sede.");
          if (!rows.length) fail("Se requiere al menos una VLAN en " + s.name);
        }

      } // Permite repetir VLAN entre sedes, pero no dentro de una.
      function initialTransits() {
        const req = [];
        for (const s of state.sites) {
          for (let k = 0; k < (s.redundant ? 2 : 1); k++)
            req.push({
              key: "t-" + s.id + "-" + k,
              site: s.id,
              name: "Router ↔ Core " + (k + 1),
              kind: "transit",
              hosts: 2,
            });
        }
        if (state.project.interconnect)
          state.sites
            .slice(1)
            .forEach((s) =>
              req.push({
                key: "w-" + s.id,
                site: "WAN",
                name: state.sites[0].name + " ↔ " + s.name,
                kind: "wan",
                hosts: 2,
              }),
            );
        return req;
      } // WAN en estrella; sedes desconectadas no reciben enlaces entre sí.
      function allocate(vlans, base, growth, transits) {
        const b = subnet(base);
        if (b.prefix > 30) fail("El bloque base debe ser /30 o mayor.");
        if (
          !b.type.startsWith("Privada") ||
          !ipType(b.end).startsWith("Privada") ||
          Math.floor(b.net / 16777216) !== Math.floor(b.end / 16777216)
        )
          fail(
            "Use un bloque completo privado RFC1918 para el plan de laboratorio.",
          );
        const req = vlans
          .map((v) => {
            const s = state.sites.find((s) => s.id === v.site),
              reserve = s.redundant ? 3 : 1,
              need = Math.ceil(v.hosts * (1 + growth / 100)) + reserve;
            const bits = Math.max(2, Math.ceil(Math.log2(need + 2)));
            return {
              ...v,
              kind: "vlan",
              reserve,
              required: need,
              prefix: 32 - bits,
              size: 2 ** bits,
            };
          })
          .concat(
            transits.map((t) => ({
              ...t,
              reserve: 0,
              required: 2,
              prefix: 30,
              size: 4,
            })),
          )
          .sort((a, b) => b.size - a.size || a.key.localeCompare(b.key));
        let cursor = b.net;
        const result = [];
        for (const r of req) {
          cursor = Math.ceil(cursor / r.size) * r.size;
          if (cursor + r.size - 1 > b.end)
            fail(
              "El bloque base no tiene espacio suficiente. Amplíelo o reduzca hosts.",
            );
          const info = subnet(ipStr(cursor) + "/" + r.prefix);
          const row = {
            ...r,
            ...info,
            key: r.key,
            site: r.site,
            kind: r.kind,
            hostsRequested: r.hosts,
            available: info.hosts - r.reserve,
            gateway: r.kind === "vlan" ? r.gateway || info.first : "",
            reserve: r.reserve,
          };
          if (row.gateway && !isHost(row.gateway, row))
            fail(
              "Gateway de " +
                r.name +
                " fuera de su nueva subred. Bórrelo antes de recalcular.",
            );

      function confirmVlans() {

      } // Las mismas filas alimentan subnetting, topología y CLI.
      function editGateway(key) {

      function inspectSubnet(i) {

      } // Verificación integrada de una fila del plan.

          ) +
          `<div class="card"><div class="grid">${field("Dirección IPv4 / prefijo CIDR", "calc", val)}<div class="field"><label>Acciones</label><div class="actions"><button class="primary" onclick="calculate()">Calcular</button><button onclick="state.calc='192.168.10.50/26';render()">Ejemplo obligatorio /26</button></div></div></div></div><div id="calcResult">${result}</div>${state.plan.length ? `<div class="card"><h3>Validar una red del proyecto</h3><div class="chips">${state.plan.map((r, i) => `<button onclick="inspectSubnet(${i})">${esc(siteName(r.site))} · ${esc(r.name)} · ${r.network}/${r.prefix}</button>`).join("")}</div></div>` : ""}<details class="card"><summary>Interpretación</summary><p>La dirección de red identifica la subred. Broadcast alcanza todos sus hosts en redes convencionales. La máscara separa bits de red y de host. /0 tiene 4.294.967.296 direcciones; no debe confundirse con una política que permita todo tráfico.</p></details>`
        );
      }
      function subnetResult(r) {
        const rows = {
          "IP ingresada": r.ip,
          "Prefijo CIDR": "/" + r.prefix,
          "Máscara decimal": r.mask,
          "Máscara binaria": r.binary,

        return `<div class="card"><h2>Resultado calculado</h2><div class="metrics">${[

      } // El ejemplo /26 resulta en red .0 y broadcast .63, por la misma fórmula.
      function calculate() {
        safe(() => {
          const value = $("calc").value.trim(),
            r = subnet(value);
          state.calc = value;
          state.subnetOK = true;
          $("calcResult").innerHTML = subnetResult(r);
        });
      } // El estado de la rúbrica solo cambia tras cálculo válido.
      /* =================== Topología y asignación de interfaces =================== */
      function row(key) {
        return state.plan.find((r) => r.key === key);
      } // Referencias por clave, sin duplicar direccionamiento.
      function node(id) {
        return state.nodes.find((n) => n.id === id);
      } // Búsqueda de nodo.
      function routed(n) {
        return n && ["Router", "Switch capa 3"].includes(n.type);
      } // Solo roles soportados reciben comandos de enrutamiento.
      function switching(n) {
        return n && ["Switch", "Switch capa 3"].includes(n.type);
      } // Roles con VLAN y puertos de switching.
      function configurable(n) {
        return routed(n) || switching(n);
      } // Firewalls y endpoints necesitan software específico, no IOS/VRP genérico.
      function availableIPs(r, n, excluded = []) {
        const skip = new Set([r.gateway, ...excluded].filter(Boolean));
        const out = [];
        for (let x = r.net + 1; x < r.end && out.length < n; x++) {
          const ip = ipStr(x);
          if (!skip.has(ip)) out.push(ip);
        }
        if (out.length < n) fail("No hay suficientes IP libres en " + r.name);
        return out;
      } // Respeta gateway virtual y direcciones ya reservadas.
      function coreAddress(n, r) {
        const cores = state.nodes
          .filter((x) => x.site === n.site && x.type === "Switch capa 3")
          .sort((a, b) => a.id.localeCompare(b.id));
        if (cores.length > 2)
          fail("Este diseño admite máximo dos cores por sede.");
        return cores.length === 2
          ? availableIPs(r, 2)[cores.indexOf(n)]
          : r.gateway;
      } // Los dos cores jamás comparten la IP física, a diferencia del ejemplo del prompt.
      function buildTopology() {
        safe(() => {
          if (!state.approved || !state.plan.length)
            fail("Confirme primero VLAN y VLSM.");
          if (
            state.nodes.length &&
            !confirm("¿Reemplazar toda la topología y las ediciones manuales?")
          )
            return;
          const estimatedNodes = state.sites.reduce((total, s) => {
            const p = proposal(s),
              c = counts(s);
            return (
              total +
              1 +
              p.core +
              p.distribution +
              p.access +
              c.ap +
              c.servers +
              Math.min(c.pc, 3)
            );
          }, 0);
          if (estimatedNodes > 500)
            fail(
              "El inventario supera 500 nodos gráficos. Reduzca AP/servidores del laboratorio o diseñe menos sedes por archivo.",
            );
          const nodes = [],
            links = [];
          let nid = 1,
            lid = 1;
          const add = (name, type, site, x, y, extra = {}) => {
            const n = {
              id: "n" + nid++,
              name: hostname(name),
              type,
              vendor: "Cisco",
              site,
              ip: "",
              network: "",
              x,
              y,
              ...extra,
            };
            nodes.push(n);
            return n;
          };
          const connect = (a, b, type, key = "", vlan = 0) => {
            const ia =
                links.filter((l) => l.a === a.id || l.b === a.id).length + 1,
              ib = links.filter((l) => l.a === b.id || l.b === b.id).length + 1;
            links.push({
              id: "l" + lid++,
              a: a.id,
              b: b.id,
              type,
              network: key,
              vlan,
              bundle: 0,
              ac: "GigabitEthernet0/" + ia,
              bc: "GigabitEthernet0/" + ib,
              ah: "GigabitEthernet0/0/" + ia,
              bh: "GigabitEthernet0/0/" + ib,
            });
          };
          const routers = [];
          let maxHeight = 600;
          for (let i = 0; i < state.sites.length; i++) {
            const s = state.sites[i],
              p = proposal(s),
              c = counts(s),
              x = 40 + i * 600,
              router = add("R-" + (i + 1), "Router", s.id, x + 220, 85);
            routers.push(router);
            const cores = [];
            for (let k = 0; k < p.core; k++) {
              const core = add(
                "CORE-" + (i + 1) + "-" + (k + 1),
                "Switch capa 3",
                s.id,
                x + 120 + k * 220,
                220,
              );
              cores.push(core);
              connect(router, core, "routed", "t-" + s.id + "-" + k);
            }
            if (cores.length === 2) connect(cores[0], cores[1], "trunk");
            const dist = [];
            for (let k = 0; k < p.distribution; k++) {
              const d = add(
                "DIST-" + (i + 1) + "-" + (k + 1),
                "Switch",
                s.id,
                x + 40 + (k % 3) * 175,
                360 + Math.floor(k / 3) * 100,
              );
              dist.push(d);
              cores.forEach((core) => connect(core, d, "trunk"));
            }
            const acc = [];
            let accessY = dist.length
              ? 480 + Math.floor((dist.length - 1) / 3) * 100
              : 370;
            for (let k = 0; k < p.access; k++) {
              const a = add(
                "ACC-" + (i + 1) + "-" + (k + 1),
                "Switch",
                s.id,
                x + 20 + (k % 3) * 180,
                accessY + Math.floor(k / 3) * 100,
              );
              acc.push(a);
              if (dist.length) connect(dist[k % dist.length], a, "trunk");
              else cores.forEach((core) => connect(core, a, "trunk"));
            }
            const endpointY = accessY + Math.ceil(acc.length / 3) * 100 + 20;
            let ek = 0;
            const endpoint = (name, type, role, quantity) => {
              const nets = state.plan.filter(
                (r) => r.site === s.id && r.kind === "vlan" && r.role === role,
              );
              if (!nets.length || !quantity) return;
              for (let k = 0; k < quantity; k++) {
                const r = nets[k % nets.length],
                  n = add(
                    name + "-" + (i + 1) + "-" + (k + 1),
                    type,
                    s.id,
                    x + 20 + (ek % 3) * 180,
                    endpointY + Math.floor(ek / 3) * 100,
                    { network: r.key },
                  );
                connect(
                  acc[ek % acc.length],
                  n,
                  type === "Access Point" ? "trunk" : "access",
                  "",
                  r.id,
                );
                ek++;
              }
            };
            endpoint("AP", "Access Point", "Gestión", c.ap);
            endpoint("SRV", "Servidor", "Servidores", c.servers);
            endpoint(
              "PC",
              "PC",
              state.plan.some((r) => r.site === s.id && r.role === "Clínica")
                ? "Clínica"
                : "Datos",
              Math.min(c.pc, 3),
            );
            const nets = state.plan.filter(
              (r) => r.site === s.id && r.kind === "vlan",
            );
            for (const r of nets) {
              const assigned = nodes.filter(
                (n) =>
                  n.site === s.id &&
                  (n.network === r.key ||
                    (r.role === "Gestión" && n.type === "Switch")),
              );
              const physical =
                cores.length === 2 ? availableIPs(r, 2) : [r.gateway];
              const ips = availableIPs(r, assigned.length, physical);
              assigned.forEach((n, j) => {
                n.ip = ips[j];
                n.network = r.key;
              });
            }
            maxHeight = Math.max(
              maxHeight,
              endpointY + Math.ceil(ek / 3) * 100 + 60,
            );
          }
          if (nodes.length > 500)
            fail(
              "Más de 500 equipos: reduzca inventario para representar esta topología en pantalla.",
            );
          if (state.project.interconnect)
            routers
              .slice(1)
              .forEach((r, i) =>
                connect(routers[0], r, "routed", "w-" + state.sites[i + 1].id),
              );
          state.nodes = nodes;
          state.links = links;
          state.configs = {};
          state.revision++;
          selectedNode = "";
          render();
          toast("Topología construida con las VLAN y subredes confirmadas.");
        });
      } // Cada enlace routed consume exactamente una red /30 del plan.
      function topologyView() {
        return (
          title(
            "Topología de red",
            "El gráfico muestra sedes, equipos, VLAN y redes del plan. Arrastre un equipo para moverlo; haga clic para editarlo. Los enlaces WAN representan un laboratorio enrutado.",
          ) +
          `<div class="card"><div class="actions"><button class="primary" onclick="buildTopology()">Generar desde el plan</button><button onclick="editNode()">Agregar equipo</button><button onclick="editLink()">Crear enlace</button><button onclick="downloadSVG()">Descargar topología SVG</button><button onclick="imageMode=false;render()">Vista automática</button><label class="filebtn">Cargar imagen<input type="file" class="hidden" accept="image/png,image/jpeg,image/webp" onchange="loadImage(this)"></label>${imageData ? '<button onclick="imageMode=!imageMode;render()">Ver / ocultar imagen</button>' : ""}</div><div class="notice warn">Diseño preliminar: se recomiendan ${state.sites.length} firewalls; el gráfico base se centra en switching y enrutamiento de laboratorio. La conexión WAN privada no crea VPN, cifrado ni un servicio del ISP. PC son representativos; el inventario completo está en Estimación. Los AP empresariales reciben trunks de gestión/WiFi/invitados; su configuración SSID y mapeo VLAN se completa en el controlador del fabricante.</div>${imageData && imageMode ? `<div class="notice">Interpretación asistida manual: marque equipos y enlaces con los editores usando esta imagen como referencia. El HTML local no incluye un modelo de visión ni OCR y no afirma haber reconocido dispositivos automáticamente. La imagen no se transmite a ningún servidor.</div><div class="imageframe"><img src="${imageData}" alt="Topología importada como referencia"></div>` : ""}<div class="diagram">${state.nodes.length ? svgTopology() : '<div class="empty">Confirme el VLSM y pulse «Generar desde el plan», o agregue equipos manualmente.</div>'}</div></div><div class="two"><div class="card"><h2>Equipos · ${state.nodes.length}</h2><div class="tablewrap"><table><thead><tr><th>Nombre / sede</th><th>Tipo</th><th>Fabricante / IP</th><th>Acción</th></tr></thead><tbody>${state.nodes
            .map(
              (n) =>
                `<tr><td>${esc(n.name)}<br><small>${esc(siteName(n.site))}</small></td><td>${n.type}</td><td>${n.vendor}<br><span class="mono">${esc(
                  n.ip ||
                    connected(n)
                      .filter((l) => l.type === "routed")
                      .map((l) => endpoint(l, n, n.vendor).ip)
                      .join(" · ") ||
                    "Interfaces / SVI",
                )}</span></td><td><button class="small" onclick="editNode('${n.id}')">Editar</button> <button class="small danger" onclick="deleteNode('${n.id}')">×</button></td></tr>`,
            )
            .join(
              "",
            )}</tbody></table></div></div><div class="card"><h2>Enlaces · ${state.links.length}</h2><div class="tablewrap"><table><thead><tr><th>Extremos</th><th>Tipo / red</th><th>Acción</th></tr></thead><tbody>${state.links.map((l) => `<tr><td>${esc(node(l.a)?.name)} ↔ ${esc(node(l.b)?.name)}</td><td>${l.type}${l.bundle ? " · LACP " + l.bundle : ""}<br><small>${l.network ? row(l.network)?.network + "/" + row(l.network)?.prefix : l.type === "access" ? "VLAN " + l.vlan : "VLAN permitidas de sede"}</small></td><td><button class="small" onclick="editLink('${l.id}')">Editar</button> <button class="small danger" onclick="deleteLink('${l.id}')">×</button></td></tr>`).join("")}</tbody></table></div></div></div>`
        );
      }
      function svgTopology() {
        const w = Math.max(
            650,
            state.sites.length * 600 + 40,
            ...state.nodes.map((n) => n.x + 180),
          ),
          h = Math.max(500, ...state.nodes.map((n) => n.y + 160));
        let out = `<svg id="toposvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d7e3ed"/></pattern></defs><rect width="100%" height="100%" fill="url(#dots)"/>`;
        state.sites.forEach((s, i) => {
          out += `<rect x="${i * 600 + 10}" y="10" width="590" height="${h - 20}" rx="12" fill="#edf4fa" fill-opacity=".6" stroke="#d2dfeb"/><text x="${i * 600 + 30}" y="40" font-size="16" fill="#263e59" font-weight="700">${esc(s.name)}</text>`;
        });
        for (const l of state.links) {
          const a = node(l.a),
            b = node(l.b);
          if (!a || !b) continue;
          const x1 = a.x + 75,
            y1 = a.y + 28,
            x2 = b.x + 75,
            y2 = b.y + 28,
            label =
              l.type === "routed"
                ? row(l.network)?.network + "/" + row(l.network)?.prefix
                : l.type === "access"
                  ? "VLAN " + l.vlan
                  : "TRUNK" + (l.bundle ? " · LACP " + l.bundle : "");
          out += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${l.type === "routed" ? "#338fa0" : "#a8bacd"}" stroke-width="${l.type === "routed" ? 3 : 2}" ${l.type === "routed" ? 'stroke-dasharray="7 4"' : ""}/><rect x="${(x1 + x2) / 2 - 65}" y="${(y1 + y2) / 2 - 10}" width="130" height="18" rx="3" fill="#f8fbff"/><text x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 + 3}" text-anchor="middle" font-size="9" fill="#376080">${esc(label)}</text>`;
        }
        for (const n of state.nodes) {
          const vl = state.plan.filter(
            (r) => r.site === n.site && r.kind === "vlan",
          );
          out += `<g class="node" data-id="${n.id}" transform="translate(${n.x},${n.y})"><rect width="150" height="62" rx="7" fill="${routed(n) ? "#16354f" : "white"}" stroke="#94b4c9"/><text x="75" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="${routed(n) ? "#fff" : "#19324e"}">${esc(n.name)}</text><text x="75" y="39" text-anchor="middle" font-size="10" fill="${routed(n) ? "#9ed8d7" : "#637e95"}">${n.type} · ${n.vendor}</text><text x="75" y="54" text-anchor="middle" font-size="9" fill="${routed(n) ? "#9ed8d7" : "#637e95"}">${esc(n.ip || "Ver interfaces")}</text>${n.type === "Switch capa 3" ? `<text x="75" y="76" text-anchor="middle" font-size="9" fill="#376080">${esc(vl.map((r) => "V" + r.id + " " + r.gateway + "/" + r.prefix).join(" · "))}</text>` : ""}</g>`;
        }
        return out + "</svg>";
      } // El SVG es exportable; etiquetas provienen del plan real.
      function bindDrag() {
        const svg = $("toposvg");
        if (!svg) return;
        let drag = null,
          moved = false;
        const point = (e) => {
          const p = svg.createSVGPoint();
          p.x = e.clientX;
          p.y = e.clientY;
          return p.matrixTransform(svg.getScreenCTM().inverse());
        };
        svg.onpointerdown = (e) => {
          const g = e.target.closest(".node");
          if (!g) return;
          const n = node(g.dataset.id),
            p = point(e);
          drag = { n, g, dx: p.x - n.x, dy: p.y - n.y };
          moved = false;
          svg.setPointerCapture(e.pointerId);
        };
        svg.onpointermove = (e) => {
          if (!drag) return;
          const p = point(e),
            x = Math.max(0, p.x - drag.dx),
            y = Math.max(55, p.y - drag.dy);
          if (Math.abs(x - drag.n.x) + Math.abs(y - drag.n.y) > 2) moved = true;
          drag.n.x = x;
          drag.n.y = y;
          drag.g.setAttribute("transform", `translate(${x},${y})`);
        };
        svg.onpointerup = (e) => {
          if (!drag) return;
          const id = drag.n.id;
          drag = null;
          if (moved) {
            render();
          } else editNode(id);
        };
      } // El arrastre solo cambia posición, sin invalidar las configuraciones.
      function modal(content) {
        $("modalbody").innerHTML = content;
        $("modal").showModal();
      } // Edición modal; confirmación guarda y cierra.
      function closeModal() {
        $("modal").close();
      } // Cierre accesible mediante botón o Escape nativo.
      function editNode(id = "") {
        const n = id
          ? node(id)
          : {
              name: "Equipo-" + (state.nodes.length + 1),
              type: "Switch",
              vendor: "Cisco",
              site: state.sites[0].id,
              ip: "",
              network: "",
              x: 50,
              y: 100,
            };
        modal(
          `<h2>${id ? "Editar" : "Agregar"} equipo</h2><div class="grid">${field("Hostname *", "nname", n.name)}<div class="field"><label>Tipo</label><select id="ntype">${optsHTML(kinds, n.type)}</select></div><div class="field"><label>Fabricante</label><select id="nvendor">${optsHTML(["Cisco", "Huawei"], n.vendor)}</select></div><div class="field"><label>Sede</label><select id="nsite">${state.sites.map((s) => `<option value="${s.id}" ${s.id === n.site ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>${field("IP de gestión / endpoint (opcional)", "nip", n.ip)}<div class="field"><label>VLAN de gestión / endpoint</label><select id="nnetwork"><option value="">Sin asignar</option>${state.plan
            .filter((r) => r.kind === "vlan")
            .map(
              (r) =>
                `<option value="${r.key}" ${r.key === n.network ? "selected" : ""}>${esc(siteName(r.site))} · V${r.id} ${esc(r.name)}</option>`,
            )
            .join(
              "",
            )}</select></div></div><p>Las IP de interfaces enrutadas y SVI se toman del plan. Para los equipos manuales, asigne una VLAN e IP si requieren administración. Los nombres no pueden contener comandos.</p><div class="actions"><button class="primary" onclick="saveNode('${id}')">Confirmar equipo</button><button onclick="closeModal()">Cancelar</button></div>`,
        );
      } // Editor permite los siete atributos solicitados.
      function saveNode(id) {
        safe(() => {
          const n = {
            ...(id ? node(id) : { id: "n" + Date.now(), x: 50, y: 100 }),
            name: hostname($("nname").value),
            type: $("ntype").value,
            vendor: $("nvendor").value,
            site: $("nsite").value,
            ip: $("nip").value.trim(),
            network: $("nnetwork").value,
          };
          if (state.nodes.some((x) => x.id !== id && x.name === n.name))
            fail("Hostname duplicado.");
          const r = row(n.network);
          if (n.ip) {
            n.ip = ipStr(ipNum(n.ip));
            if (
              !r ||
              r.site !== n.site ||
              !isHost(n.ip, r) ||
              n.ip === r.gateway
            )
              fail(
                "La IP debe pertenecer a la VLAN seleccionada y no ser el gateway.",
              );
            if (state.nodes.some((x) => x.id !== id && x.ip === n.ip))
              fail("IP duplicada.");
            const physical = state.sites.find((s) => s.id === r.site).redundant
              ? availableIPs(r, 2)
              : [r.gateway];
            if (physical.includes(n.ip)) fail("IP reservada para un core.");
          }
          if (r && r.site !== n.site)
            fail("VLAN y equipo deben pertenecer a la misma sede.");
          const connected = state.links.filter((l) => l.a === id || l.b === id);
          for (const l of connected) {
            if (l.type === "routed" && !routed(n))
              fail("Quite los enlaces enrutados antes de cambiar este tipo.");
            if (
              l.type === "trunk" &&
              !switching(n) &&
              n.type !== "Access Point"
            )
              fail("Un trunk requiere un switch en ambos extremos.");
            if (
              l.type !== "routed" &&
              node(l.a === id ? l.b : l.a).site !== n.site
