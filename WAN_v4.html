              fail("Los enlaces LAN no pueden cruzar sedes.");
          }
          if (
            n.type === "Switch capa 3" &&
            state.nodes.filter(
              (x) => x.id !== id && x.site === n.site && x.type === n.type,
            ).length >= 2
          )
            fail("Máximo dos cores por sede.");
          if (id) state.nodes[state.nodes.findIndex((x) => x.id === id)] = n;
          else state.nodes.push(n);
          invalidate("topology");
          closeModal();
          render();
        });
      } // Mantiene relaciones y unicidad incluso al editar equipos conectados.
      function deleteNode(id) {
        if (confirm("¿Eliminar equipo y todos sus enlaces?")) {
          state.nodes = state.nodes.filter((n) => n.id !== id);
          state.links = state.links.filter((l) => l.a !== id && l.b !== id);
          invalidate("topology");
          render();
        }
      } // Borra enlaces huérfanos en la misma operación.
      function editLink(id = "") {
        if (state.nodes.length < 2)
          return toast("Añada al menos dos equipos.", true);
        const l = id
          ? state.links.find((l) => l.id === id)
          : {
              a: state.nodes[0].id,
              b: state.nodes[1].id,
              type: "trunk",
              network: "",
              vlan: 10,
              bundle: 0,
              ac: "GigabitEthernet0/1",
              bc: "GigabitEthernet0/1",
              ah: "GigabitEthernet0/0/1",
              bh: "GigabitEthernet0/0/1",
            };
        const ns = (sel) =>
          state.nodes
            .map(
              (n) =>
                `<option value="${n.id}" ${n.id === sel ? "selected" : ""}>${esc(n.name)} · ${esc(siteName(n.site))}</option>`,
            )
            .join("");
        modal(
          `<h2>${id ? "Editar" : "Crear"} enlace</h2><div class="grid"><div class="field"><label>Equipo A</label><select id="la">${ns(l.a)}</select></div><div class="field"><label>Equipo B</label><select id="lb">${ns(l.b)}</select></div><div class="field"><label>Tipo</label><select id="ltype">${optsHTML(["trunk", "access", "routed"], l.type)}</select></div><div class="field"><label>Red de tránsito (routed)</label><select id="lnet"><option value="">Asignar nueva /30 desde VLSM</option>${state.plan
            .filter((r) => r.kind !== "vlan")
            .map(
              (r) =>
                `<option value="${r.key}" ${r.key === l.network ? "selected" : ""}>${esc(r.name)} · ${r.network}/30</option>`,
            )
            .join(
              "",
            )}</select></div>${field("VLAN (solo access)", "lvlan", l.vlan, "number")}${field("Grupo LACP (0 = sin agrupación)", "lbundle", l.bundle, "number")}${field("Interfaz A · Cisco", "lac", l.ac)}${field("Interfaz B · Cisco", "lbc", l.bc)}${field("Interfaz A · Huawei", "lah", l.ah)}${field("Interfaz B · Huawei", "lbh", l.bh)}</div><div class="notice">Trunk transporta las VLAN de la sede (hacia AP: gestión, WiFi e invitados). Access conecta un terminal a una VLAN. Routed utiliza /30 y OSPF. LACP requiere dos enlaces físicos entre los mismos switches con el mismo número de grupo; se usa modo activo en ambos extremos.</div><div class="actions"><button class="primary" onclick="saveLink('${id}')">Confirmar enlace</button><button onclick="closeModal()">Cancelar</button></div>`,
        );
      } // Interfaces de cada fabricante se editan separadamente.
      function interfaceName(v) {
        if (
          !/^(GigabitEthernet|TenGigabitEthernet|FastEthernet|Ethernet)\d+(\/\d+){1,3}$/.test(
            v,
          )
        )
          fail(
            "Interfaz inválida: " +
              v +
              ". Use GigabitEthernet0/1 o GigabitEthernet0/0/1.",
          );
        return v;
      } // No admite saltos de línea ni nombres de comandos.
      function saveLink(id) {
        safe(() => {
          const l = {
            id: id || "l" + Date.now(),
            a: $("la").value,
            b: $("lb").value,
            type: $("ltype").value,
            network: $("lnet").value,
            vlan:
              $("ltype").value === "access"
                ? num($("lvlan").value, 2, 4094, "VLAN")
                : 0,
            bundle: num($("lbundle").value, 0, 128, "LACP"),
            ac: interfaceName($("lac").value.trim()),
            bc: interfaceName($("lbc").value.trim()),
            ah: interfaceName($("lah").value.trim()),
            bh: interfaceName($("lbh").value.trim()),
          };
          validateLink(
            l,
            state.links.filter((x) => x.id !== id),
          );
          let plan = state.plan;
          if (l.type === "routed" && !l.network) {
            const base = subnet(state.project.base),
              occupied = state.plan;
            let cursor = base.net;
            while (
              cursor + 3 <= base.end &&
              occupied.some((r) => cursor <= r.end && cursor + 3 >= r.net)
            )
              cursor =
                Math.ceil(
                  (Math.max(
                    ...occupied
                      .filter((r) => cursor <= r.end && cursor + 3 >= r.net)
                      .map((r) => r.end),
                  ) +
                    1) /
                    4,
                ) * 4;
            if (cursor + 3 > base.end)
              fail("Sin espacio para una /30 adicional.");
            const info = subnet(ipStr(cursor) + "/30");
            l.network = "m-" + l.id;
            plan = state.plan.concat({
              ...info,
              key: l.network,
              kind: "transit",
              site: node(l.a).site === node(l.b).site ? node(l.a).site : "WAN",
              name: node(l.a).name + " ↔ " + node(l.b).name,
              hostsRequested: 2,
              available: 2,
              reserve: 0,
              gateway: "",
            });
          }
          state.plan = plan;
          if (id) state.links[state.links.findIndex((x) => x.id === id)] = l;
          else state.links.push(l);
          invalidate("topology");
          closeModal();
          render();
        });
      } // Asignación adicional conserva las subredes existentes y evita solapamiento.
      function validateLink(l, others) {
        if (l.a === l.b) fail("Un enlace requiere dos equipos diferentes.");
        const a = node(l.a),
          b = node(l.b);
        if (!a || !b) fail("Extremo inexistente.");
        if (l.type === "routed") {
          if (!routed(a) || !routed(b))
            fail("Routed solo entre router o switch capa 3.");
          if (l.bundle)
            fail("LACP se implementa en trunks, no en redes routed.");
          if (l.network && (!row(l.network) || row(l.network).kind === "vlan"))
            fail("Seleccione una red /30 de tránsito.");
          if (l.network && others.some((x) => x.network === l.network))
            fail("Esta /30 ya está en uso por otro enlace.");
        } else {
          if (a.site !== b.site)
            fail("Los enlaces LAN deben quedar en la misma sede.");
          if (
            l.type === "trunk" &&
            !(
              (switching(a) && (switching(b) || b.type === "Access Point")) ||
              (switching(b) && a.type === "Access Point")
            )
          )
            fail("Trunk requiere switches o un switch y un AP empresarial.");
          if (l.type === "access") {
            if (!switching(a) && !switching(b))
              fail("Access requiere un switch.");
            if (l.bundle) fail("Access no admite LACP.");
            if (
              !state.plan.some(
                (r) =>
                  r.site === a.site && r.kind === "vlan" && r.id === l.vlan,
              )
            )
              fail("La VLAN access no existe en esta sede.");
            const end = switching(a) ? b : a;
            if (end.network && row(end.network).id !== l.vlan)
              fail("La VLAN del terminal debe coincidir con el enlace access.");
          }
        }
        for (const side of ["a", "b"])
          for (const vendor of ["c", "h"]) {
            const name = l[side + vendor];
            for (const x of others) {
              if (
                (x.a === l[side] && x["a" + vendor] === name) ||
                (x.b === l[side] && x["b" + vendor] === name)
              )
                fail(
                  "Interfaz " + name + " ya utilizada en " + node(l[side]).name,
                );
            }
          }
        if (
          l.bundle &&
          others.some(
            (x) =>
              x.bundle === l.bundle &&
              (x.a === a.id || x.b === a.id || x.a === b.id || x.b === b.id) &&
              !(
                (x.a === a.id && x.b === b.id) ||
                (x.a === b.id && x.b === a.id)
              ),
          )
        )
          fail("El grupo LACP ya conecta otros equipos.");
      } // Rechaza interfaces duplicadas y grupos incoherentes.
      function deleteLink(id) {
        if (
          confirm(
            "¿Eliminar este enlace? La subred quedará reservada en el plan.",
          )
        ) {
          state.links = state.links.filter((l) => l.id !== id);
          invalidate("topology");
          render();
        }
      } // Las redes no se renumeran después de quitar un enlace.
      function loadImage(input) {
        safe(() => {
          const file = input.files[0];
          if (!file) return;
          if (
            !["image/png", "image/jpeg", "image/webp"].includes(file.type) ||
            file.size > 5 * 1024 * 1024
          )
            fail("Use PNG, JPEG o WebP de máximo 5 MB.");
          const reader = new FileReader();
          reader.onload = () => {
            imageData = reader.result;
            imageMode = true;
            render();
            toast("Imagen cargada para interpretación manual.");
          };
          reader.readAsDataURL(file);
        });
      } // No usa API externa, claves ni reconocimiento simulado.
      function downloadSVG() {
        if (!state.nodes.length)
          return toast("No hay topología para descargar.", true);
        download("topologia.svg", svgTopology(), "image/svg+xml");
      } // Exporta dibujo vectorial autónomo.
      /* =================== Generación de Cisco IOS y Huawei VRP =================== */
      function connected(n) {
        return state.links.filter((l) => l.a === n.id || l.b === n.id);
      } // Configuración limitada a interfaces realmente presentes.
      function endpoint(l, n, vendor) {
        const side = l.a === n.id ? "a" : "b",
          r = row(l.network);
        return {
          iface: l[side + (vendor === "Cisco" ? "c" : "h")],
          ip: r ? (side === "a" ? r.first : r.last) : "",
          r,
          peer: node(l.a === n.id ? l.b : l.a),
        };
      } // Los extremos routed reciben first/last de la misma /30.
      function routerId(n) {
        const index = state.nodes.findIndex((x) => x.id === n.id) + 1;
        return "10.255." + Math.floor(index / 254) + "." + ((index % 254) + 1);
      } // Router-ID único, no se copia 8.8.8.8 como loopback propia.
      // Huawei: ofrece equivalencias si la topología automática solo contiene Cisco.
      // No modifica fabricantes, nodos, enlaces, direccionamiento ni el generador Cisco.
      function configNodes(vendor) {
        const nodes = state.nodes.filter(
          (n) => configurable(n) && n.vendor === vendor,
        );
        return vendor === "Huawei" && !nodes.length
          ? state.nodes.filter(configurable)
          : nodes;
      }
      function configView(vendor) {
        const nodes = configNodes(vendor);
        return (
          title(
            "Configuración " + vendor,
            vendor === "Cisco"
              ? "Propuestas para IOS / IOS XE con VLAN, SVI, OSPF y SSH. Elija equipo o genere toda la marca."
              : "Propuestas para VRP con Vlanif, OSPF, AAA y STelnet. La equivalencia utiliza exactamente el mismo plan. Si no hay equipos marcados como Huawei, se ofrecen los equipos configurables de la topología como equivalentes VRP, sin cambiar su fabricante.",
          ) +
          configControls() +
          `<div class="card"><div class="actions"><select id="confNode" aria-label="Equipo a configurar">${nodes.map((n) => `<option value="${n.id}">${esc(n.name)} · ${esc(siteName(n.site))}</option>`).join("")}</select><button class="primary" onclick="generateSelected('${vendor}')">Generar equipo</button><button onclick="generateAll('${vendor}')">Generar todos los ${vendor}</button><button onclick="downloadAll('${vendor}')">Descargar todos</button></div><div class="notice warn">Configuración preliminar; ajuste interfaces y sintaxis al modelo/versión del equipo. &lt;CAMBIAR_EN_PRODUCCION&gt; exige reemplazo externo antes de aplicar. Los prompts interactivos de claves y guardado se atienden en el equipo. No se genera configuración genérica para firewall, AP, ISP, PC o servidor.</div>${nodes.length ? nodes.map((n) => configBlock(n, vendor)).join("") : '<div class="empty">Genere una topología y asigne equipos a esta marca. Para evaluar el mismo equipo con ambas sintaxis use Comparación.</div>'}</div>`
        );
      }
      function configControls() {
        return `<div class="card"><h3>Funciones a generar</h3><div class="grid">${Object.entries(
          {
            basic: "Hostname y seguridad básica",
            ssh: "SSH / STelnet con AAA",
            vlans: "Crear VLAN",
            interfaces: "Interfaces, trunks, SVI",
            ospf: "OSPF área 0 (redes del plan)",
            dhcp: "DHCP local (VLAN marcadas)",
            relay: "Relay DHCP externo",
            static: "Ruta estática por defecto",
          },
        )
          .map(
            ([k, l]) =>
              `<label class="check"><input id="o${k}" type="checkbox" ${state.opts[k] ? "checked" : ""} onchange="changeOpts()">${l}</label>`,
          )
          .join(
            "",
          )}</div><div class="grid">${field("Servidor DHCP externo (solo relay)", "relay", state.relay, "text", 'onchange="changeOpts()"')}${field("Siguiente salto de ruta por defecto", "staticNext", state.staticNext, "text", 'onchange="changeOpts()"')}${field("Justificación de la ruta por defecto", "staticReason", state.staticReason, "text", 'onchange="changeOpts()"')}</div><small>DHCP y relay son excluyentes. OSPF usa interfaces LAN pasivas. HSRP/VRRP se genera en sedes con dos cores. LACP se genera para grupos válidos creados en Topología.</small></div>`;
      } // Funciones reales, dependientes de los roles y selección.
      function changeOpts() {
        return safe(() => {
          const opts = {};
          for (const k of Object.keys(state.opts)) opts[k] = $("o" + k).checked;
          let relay = $("relay").value.trim(),
            next = $("staticNext").value.trim(),
            reason = $("staticReason").value.trim();
          if (relay) relay = ipStr(ipNum(relay));
          if (next) next = ipStr(ipNum(next));
          if (opts.relay && opts.dhcp) {
            render();
            fail("Elija DHCP local o relay, no ambos.");
          }
          const changed =
            JSON.stringify([
              state.opts,
              state.relay,
              state.staticNext,
              state.staticReason,
            ]) !== JSON.stringify([opts, relay, next, reason]);
          state.opts = opts;
          state.relay = relay;
          state.staticNext = next;
          state.staticReason = reason;
          if (changed) {
            state.configs = {};
            state.revision++;
          }
          return true;
        });
      } // Las opciones modificadas invalidan los textos generados.
      function assertReady(n) {
        if (!state.approved || !state.plan.length)
          fail("Confirme primero el plan.");
        hostname(n.name);
        if (!configurable(n))
          fail("El tipo seleccionado no dispone de plantilla IOS/VRP.");
        if (state.opts.relay && !state.relay)
          fail("Indique IP de DHCP externo para relay.");
        if (state.opts.static && (!state.staticNext || !state.staticReason))
          fail("Ruta por defecto requiere siguiente salto y justificación.");
        const problems = topologyIssues().filter((x) => x.block);
        if (problems.length) fail(problems.map((x) => x.msg).join(" · "));
        if (state.opts.static) {
          const usable = connected(n)
            .filter((l) => l.type === "routed")
            .map((l) => endpoint(l, n, "Cisco"));
          if (
            !usable.some(
              (e) =>
                e.peer &&
                e.r &&
                isHost(state.staticNext, e.r) &&
                state.staticNext !== e.ip,
            )
          )
            fail(
              "La ruta por defecto de " +
                n.name +
                " requiere un siguiente salto directamente conectado.",
            );
        }
        if (state.opts.ospf && !state.opts.interfaces)
          fail("OSPF requiere configurar interfaces.");
        if (state.opts.dhcp && !state.opts.interfaces)
          fail("DHCP requiere las interfaces gateway.");
        if (state.opts.interfaces && switching(n) && !state.opts.vlans)
          fail("Interfaces de switching requieren crear VLAN.");
      } // Bloqueos técnicos concretos, sin afirmar funcionalidad incompleta.
      function generate(n, vendor) {
        assertReady(n);
        const c = vendor === "Cisco",
          o = state.opts,
          lan = state.plan.filter(
            (r) => r.site === n.site && r.kind === "vlan",
          ),
          links = connected(n),
          core = n.type === "Switch capa 3",
          cores = state.nodes
            .filter((x) => x.site === n.site && x.type === "Switch capa 3")
            .sort((a, b) => a.id.localeCompare(b.id)),
          primary = cores[0]?.id === n.id;
        const lines = [],
          add = (...s) => lines.push(...s),
          sep = c ? "!" : "#";
        add(
          sep + " Propuesta " + vendor + " para " + n.name,
          sep +
            " Proyecto " +
            commandName(state.project.name) +
            " / " +
            commandName(siteName(n.site)),
          sep + " Revisar plataforma y sustituir los marcadores de secretos.",
          c ? "enable" : "system-view",
        );
        if (c) add("configure terminal");
        if (o.basic) {
          if (c)
            add(
              "hostname " + n.name,
              "no ip domain-lookup",
              "enable secret <CAMBIAR_EN_PRODUCCION>",
              "no ip http server",
              "no ip http secure-server",
              "service timestamps log datetime msec",
            );
          else add("sysname " + n.name, "undo telnet server enable");
        }
        if (o.ssh) {
          const mgmt = lan.find((r) => r.role === "Gestión");
          if (mgmt) {
            if (c)
              add(
                "ip access-list standard MGMT-SSH",
                "permit " + mgmt.network + " " + wildcard(mgmt.mask),
                "deny any",
                "exit",
              );
            else
              add(
                "acl number 2000",
                "rule 5 permit source " +
                  mgmt.network +
                  " " +
                  wildcard(mgmt.mask),
                "rule 10 deny",
                "quit",
              );
          }
          if (c)
            add(
              "ip domain-name laboratorio.local",
              "username operador privilege 1 secret <CAMBIAR_EN_PRODUCCION>",
              "crypto key generate rsa modulus 2048",
              "ip ssh version 2",
              "ip ssh time-out 60",
              "ip ssh authentication-retries 3",
              "line vty 0 15",
              "login local",
              "transport input ssh",
              "exec-timeout 10 0",
              ...(mgmt ? ["access-class MGMT-SSH in"] : []),
              "exit",
            );
          else
            add(
              "rsa local-key-pair create",
              sep + " Responder 2048 al prompt de longitud de clave si aplica.",
              "stelnet server enable",
              "aaa",
              "local-user operador password irreversible-cipher <CAMBIAR_EN_PRODUCCION>",
              "local-user operador privilege level 1",
              "local-user operador service-type ssh",
              "quit",
              "ssh user operador authentication-type password",
              "ssh user operador service-type stelnet",
              "user-interface vty 0 4",
              "authentication-mode aaa",
              "protocol inbound ssh",
              "idle-timeout 10 0",
              ...(mgmt ? ["acl 2000 inbound"] : []),
              "quit",
            );
        }
        if (core && c) add("ip routing");
        if (!c && core && (o.dhcp || o.relay)) add("dhcp enable");
        if (o.basic && switching(n)) {
          if (c) add("spanning-tree mode rapid-pvst");
          else add("stp mode mstp", "stp bpdu-protection");
          if (core) {
            if (c)
              add(
                "spanning-tree vlan " +
                  lan.map((r) => r.id).join(",") +
                  " root " +
                  (primary ? "primary" : "secondary"),
              );
            else add("stp root " + (primary ? "primary" : "secondary"));
          }
        }
        if (o.vlans && switching(n)) {
          for (const r of lan)
            add(
              "vlan " + r.id,
              "name " + commandName(r.name),
              c ? "exit" : "quit",
            );
        }
        if (o.interfaces) {
          const bundleDone = new Set();
          for (const l of links.filter((l) => l.bundle)) {
            if (bundleDone.has(l.bundle)) continue;
            bundleDone.add(l.bundle);
            add("interface " + (c ? "Port-channel" : "Eth-Trunk") + l.bundle);
            if (!c) add("mode lacp-static");
            add(
              ...trunkCommands(c, lan),
              c ? "no shutdown" : "undo shutdown",
              c ? "exit" : "quit",
            );
          }
          for (const l of links) {
            const e = endpoint(l, n, vendor);
            if (l.type === "access" && !switching(n)) continue;
            add("interface " + e.iface);
            if (l.type === "routed") {
              if (switching(n)) add(c ? "no switchport" : "undo portswitch");
              add("ip address " + e.ip + " " + e.r.mask);
            } else if (l.type === "trunk") {
              if (l.bundle) {
                add(
                  c
                    ? "channel-group " + l.bundle + " mode active"
                    : "eth-trunk " + l.bundle,
                );
              } else
                add(
                  ...trunkCommands(
                    c,
                    e.peer?.type === "Access Point"
                      ? lan.filter((r) =>
                          ["WiFi", "Gestión", "Invitados"].includes(r.role),
                        )
                      : lan,
                  ),
                );
            } else {
              add(
                c ? "switchport mode access" : "port link-type access",
                c
                  ? "switchport access vlan " + l.vlan
                  : "port default vlan " + l.vlan,
              );
              const peer = e.peer;
              if (!switching(peer) && !routed(peer))
                add(c ? "spanning-tree portfast" : "stp edged-port enable");
              if (c) add("spanning-tree bpduguard enable");
            }
            add(c ? "no shutdown" : "undo shutdown", c ? "exit" : "quit");
            if (l.bundle && !bundleDone.has(l.bundle)) {
              bundleDone.add(l.bundle);
              add("interface " + (c ? "Port-channel" : "Eth-Trunk") + l.bundle);
              if (!c) add("mode lacp-static");
              add(
                ...trunkCommands(c, lan),
                c ? "no shutdown" : "undo shutdown",
                c ? "exit" : "quit",
              );
            }
          }
          if (core) {
            for (const r of lan) {
              const physical = coreAddress(n, r);
              add(
                "interface " + (c ? "Vlan" : "Vlanif") + r.id,
                "ip address " + physical + " " + r.mask,
              );
              if (o.relay)
                add(
                  c ? "ip helper-address " + state.relay : "dhcp select relay",
                  ...(!c ? ["dhcp relay server-ip " + state.relay] : []),
                );
              if (cores.length === 2) {
                const group = 1;
                add(
                  c
                    ? "standby " + group + " ip " + r.gateway
                    : "vrrp vrid " + group + " virtual-ip " + r.gateway,
                  c
                    ? "standby " + group + " priority " + (primary ? 150 : 100)
                    : "vrrp vrid " +
                        group +
                        " priority " +
                        (primary ? 150 : 100),
                  c
                    ? "standby " + group + " preempt"
                    : "vrrp vrid " + group + " preempt-mode timer delay 10",
                );
              }
              if (o.dhcp && !c && primary && r.dhcp) add("dhcp select global");
              add(c ? "no shutdown" : "undo shutdown", c ? "exit" : "quit");
            }
          } else if (n.type === "Switch" && n.ip && n.network) {
            const r = row(n.network);
            add(
              "interface " + (c ? "Vlan" : "Vlanif") + r.id,
              "ip address " + n.ip + " " + r.mask,
              c ? "no shutdown" : "undo shutdown",
              c ? "exit" : "quit",
              c
                ? "ip default-gateway " + r.gateway
                : "ip route-static 0.0.0.0 0.0.0.0 " + r.gateway,
            );
          }
        }
        if (o.ospf && routed(n)) {
          if (c) {
            add(
              "router ospf 1",
              "router-id " + routerId(n),
              "passive-interface default",
            );
            for (const l of links.filter((l) => l.type === "routed")) {
              const e = endpoint(l, n, vendor);
              add(
                "no passive-interface " + e.iface,
                "network " + e.r.network + " " + wildcard(e.r.mask) + " area 0",
              );
            }
            if (core)
              for (const r of lan)
                add(
                  "network " + r.network + " " + wildcard(r.mask) + " area 0",
                );
            add("exit");
          } else {
            add("ospf 1 router-id " + routerId(n));
            if (core)
              for (const r of lan) add("silent-interface Vlanif" + r.id);
            add("area 0.0.0.0");
            for (const l of links.filter((l) => l.type === "routed")) {
              const e = endpoint(l, n, vendor);
              add("network " + e.r.network + " " + wildcard(e.r.mask));
            }
            if (core)
              for (const r of lan)
                add("network " + r.network + " " + wildcard(r.mask));
            add("quit", "quit");
          }
        }
        if (o.dhcp && core && primary) {
          for (const r of lan.filter((r) => r.dhcp)) {
            const reserved = [
              r.gateway,
              ...(cores.length === 2 ? availableIPs(r, 2) : []),
              ...state.nodes
                .filter((x) => x.site === r.site && x.network === r.key && x.ip)
                .map((x) => x.ip),
            ];
            if (c) {
              for (const ip of [...new Set(reserved)])
                add("ip dhcp excluded-address " + ip);
              add(
                "ip dhcp pool VLAN-" + r.id,
                "network " + r.network + " " + r.mask,
                "default-router " + r.gateway,
                "dns-server " + state.project.dns,
                "lease 1",
                "exit",
              );
            } else {
              add(
                "ip pool VLAN-" + r.id,
                "network " + r.network + " mask " + r.mask,
                "gateway-list " + r.gateway,
                "dns-list " + state.project.dns,
              );
              for (const ip of [...new Set(reserved)].filter(
                (ip) => ip !== r.gateway,
              ))
                add("excluded-ip-address " + ip);
              add("lease day 1", "quit");
            }
          }
        }
        if (o.static && routed(n))
          add(
            c
              ? "ip route 0.0.0.0 0.0.0.0 " + state.staticNext
              : "ip route-static 0.0.0.0 0.0.0.0 " + state.staticNext,
          );
        add(c ? "end" : "return", c ? "write memory" : "save");
        return lines.join("\n");
      } // Cada comando procede del proyecto confirmado y de los enlaces del equipo.
      function trunkCommands(c, lan) {
        return c
          ? [
              "switchport mode trunk",
              "switchport trunk allowed vlan " + lan.map((r) => r.id).join(","),
            ]
          : [
              "port link-type trunk",
              "port trunk allow-pass vlan " + lan.map((r) => r.id).join(" "),
            ];
      } // Mantiene separadas las sintaxis de los fabricantes.
      function wildcard(mask) {
        return ipStr(4294967295 - ipNum(mask));
      } // Masque inversé exact utilisé pour OSPF.
      function generateSelected(vendor) {
        if (changeOpts() === false) return;
        safe(() => {
          const n = node($("confNode").value);
          if (!n) fail("Sélectionnez un équipement.");
          const result = generate(n, vendor);
          state.configs[n.id + "-" + vendor] = {
            text: result,
            revision: state.revision,
          };
          render();
          toast("Configuration générée pour " + n.name);
        });
      } // Ne marque une configuration comme générée qu'après succès.
      function generateAll(vendor) {
        if (changeOpts() === false) return;
        safe(() => {
          const ns = configNodes(vendor);
          if (!ns.length) fail("Aucun équipement " + vendor + " à configurer.");
          const outputs = ns.map((n) => [n, generate(n, vendor)]);
          for (const [n, t] of outputs)
            state.configs[n.id + "-" + vendor] = {
              text: t,
              revision: state.revision,
            };
          render();
          toast(outputs.length + " configurations générées.");
        });
      } // Génération atomique de la marque entière.
      function configBlock(n, v) {
        const item = state.configs[n.id + "-" + v];
        if (!item) return "";
        return `<div style="margin-top:24px"><div class="headingrow"><h3>${esc(n.name)} · ${v}</h3><div class="actions"><button class="small" onclick="copyConfig('${n.id}','${v}')">Copier configuration</button><button class="small" onclick="downloadConfig('${n.id}','${v}')">Télécharger</button></div></div><pre class="console">${esc(item.text)}</pre></div>`;
      } // Les sorties CLI sont affichées comme texte, jamais interprétées en HTML.
      function compareView() {
        const ns = state.nodes.filter(configurable);
        const n = node(selectedNode) || ns[0];
        return (
          title(
            "Cisco IOS | Huawei VRP",
            "Comparez le même rôle logique et le même adressage. Le choix du fabricant dans la topologie limite uniquement les exports par marque.",
          ) +
          configControls() +
          `<div class="card"><div class="actions"><select aria-label="Équipe pour comparaison" onchange="selectedNode=this.value;render()">${ns.map((x) => `<option value="${x.id}" ${n?.id === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select><button class="primary" onclick="generateCompare('${n?.id || ""}')">Générer les deux syntaxes</button></div></div>${n ? `<div class="two"><div>${configBlock(n, "Cisco") || '<div class="card empty">Cisco · en attente de génération</div>'}</div><div>${configBlock(n, "Huawei") || '<div class="card empty">Huawei · en attente de génération</div>'}</div></div>` : '<div class="card empty">Une topologie est requise.</div>'}`
        );
      } // Comparaison sans changer le fabricant du dispositif réel.
      function generateCompare(id) {
        if (changeOpts() === false) return;
        safe(() => {
          const n = node(id);
          if (!n) fail("Sélectionnez un équipement.");
          const ci = generate(n, "Cisco"),
            hw = generate(n, "Huawei");
          state.configs[n.id + "-Cisco"] = {
            text: ci,
            revision: state.revision,
          };
          state.configs[n.id + "-Huawei"] = {
            text: hw,
            revision: state.revision,
          };
          selectedNode = id;
          render();
        });
      } // Les deux résultats correspondent au même équipement et aux mêmes réseaux.
      async function copyConfig(id, v) {
        const item = state.configs[id + "-" + v];
        if (!item) return;
        try {
          await navigator.clipboard.writeText(item.text);
          toast("Configuration copiée.");
        } catch (e) {
          const ta = document.createElement("textarea");
          ta.value = item.text;
          ta.style.position = "fixed";
          document.body.append(ta);
          ta.select();
          let ok = false;
          try {
            ok = document.execCommand("copy");
          } catch (e) {}
          ta.remove();
          if (ok) toast("Configuration copiée.");
          else
            modal(
              `<h2>Copie manuelle</h2><p>Le navigateur bloque la copie automatique en mode fichier. Sélectionnez le texte puis Ctrl+C.</p><textarea id="manualcopy" style="height:300px">${esc(item.text)}</textarea><button onclick="$('manualcopy').select()">Sélectionner tout</button> <button onclick="closeModal()">Fermer</button>`,
            );
        }
      } // Repli fonctionnel lorsque Clipboard API n'est pas disponible sous file://.
      function downloadConfig(id, v) {
        const item = state.configs[id + "-" + v];
        if (item)
          download(
            node(id).name + "-" + v.toLowerCase() + ".txt",
            item.text,
            "text/plain",
          );
      } // Export par hostname et marque.
      function downloadAll(v) {
        const entries = Object.entries(state.configs).filter(
          ([k, x]) => k.endsWith("-" + v) && x.revision === state.revision,
        );
        if (!entries.length)
          return toast(
            "Générez les configurations avant de télécharger.",
            true,
          );
        download(
          "topologie-" + v.toLowerCase() + ".txt",
          entries
            .map(([k, x]) => x.text)
            .join("\n\n" + "=".repeat(60) + "\n\n"),
          "text/plain",
        );
      } // Un seul fichier contient des blocs nommés pour tous les équipements générés.
      /* =================== Cohérence, ciberdéfense et tableau de bord =================== */
      function topologyIssues() {
        const out = [],
          warn = (msg, block = false) => out.push({ msg, block });
        for (let i = 0; i < state.plan.length; i++) {
          const r = state.plan[i];
          if (r.kind === "vlan" && !isHost(r.gateway, r))
            warn("Gateway invalide pour " + r.name, true);
          for (let j = i + 1; j < state.plan.length; j++) {
            const b = state.plan[j];
            if (r.net <= b.end && b.net <= r.end)
              warn("Solapamiento " + r.name + " / " + b.name, true);
          }
        }
        for (const n of state.nodes) {
          if (!connected(n).length) warn(n.name + " sin enlaces.");
          if (n.type === "Switch" && !n.ip)
            warn(n.name + " sin dirección de gestión.");
          if (n.type === "Switch capa 3") {
            const cores = state.nodes.filter(
              (x) => x.site === n.site && x.type === n.type,
            );
            if (cores.length === 2 && cores[0].vendor !== cores[1].vendor)
              warn(
                "Cores con fabricantes distintos en " +
                  siteName(n.site) +
                  ": HSRP y VRRP no forman un mismo grupo.",
                true,
              );
            if (
              cores.length !==
              (state.sites.find((s) => s.id === n.site).redundant ? 2 : 1)
            )
              warn(
                "Cantidad de cores incoherente en " +
                  siteName(n.site) +
                  ". Regenere desde el plan.",
                true,
              );
          }
          if (n.ip) {
            const r = row(n.network);
            if (!r || !isHost(n.ip, r))
              warn("IP fuera de red: " + n.name, true);
            else if (
              state.sites.find((s) => s.id === r.site)?.redundant &&
              availableIPs(r, 2).includes(n.ip)
            )
              warn("IP física de core usada por " + n.name, true);
            if (state.nodes.some((x) => x.id !== n.id && x.ip === n.ip))
              warn("IP duplicada: " + n.ip, true);
          }
        }
        for (const l of state.links) {
          try {
            validateLink(
              l,
              state.links.filter((x) => x.id !== l.id),
            );
            if (l.type === "routed" && !l.network)
              warn("Enlace sin red /30.", true);
          } catch (e) {
            warn(e.message, true);
          }
        }
        const groups = new Map();
        for (const l of state.links.filter((l) => l.bundle)) {
          const key = [l.a, l.b].sort().join("-") + "-" + l.bundle;
          groups.set(key, (groups.get(key) || 0) + 1);
        }
        for (const [key, n] of groups)
          if (n < 2)
            warn("Grupo LACP " + key + " requiere al menos dos enlaces.", true);
        return out;
      } // Validación transversal, independiente del gráfico.
      function securityWarnings() {
        const out = topologyIssues().map((x) => x.msg);
        if (!state.opts.ssh)
          out.push("SSH / STelnet deshabilitado en la propuesta.");
        if (state.opts.static)
          out.push(
            "Ruta 0.0.0.0/0: " +
              (state.staticReason || "sin justificación") +
              ".",
          );
        if (state.nodes.length)
          out.push(
            "SSH se restringe al origen de la VLAN Gestión cuando existe. Los trunks y la ACL administrativa no aíslan el tráfico entre servicios; completar reglas de firewall.",
          );
        if (state.sites.length > 1 && state.project.interconnect)
          out.push(
            "WAN de laboratorio sin cifrado: en producción requiere VPN/MPLS/SD-WAN y contrato del ISP.",
          );
        if (Object.keys(state.configs).length)
          out.push(
            "Los marcadores de secretos no son credenciales válidas; sustitúyalos fuera de esta herramienta.",
          );
        if (state.sites.some((s) => s.redundant) && state.opts.dhcp)
          out.push(
            "DHCP se configura solo en el core primario. HSRP/VRRP no replica concesiones DHCP.",
          );
        for (const item of Object.values(state.configs)) {
          if (
            /transport input.*telnet|protocol inbound.*telnet|(?<!undo )telnet server enable/i.test(
              item.text,
            )
          )
            out.push("Se detectó Telnet habilitado.");
          if (
            /(?:secret|password|token|api.key)\s+(?!<CAMBIAR_EN_PRODUCCION>)(?:\S+)/i.test(
              item.text.replace(
                /username operador privilege 1 secret <CAMBIAR_EN_PRODUCCION>|local-user operador password irreversible-cipher <CAMBIAR_EN_PRODUCCION>|ssh user operador authentication-type password/g,
                "",
              ),
            )
          )
            out.push(
              "Revisar texto de autenticación: posible secreto literal.",
            );
        }
        return [...new Set(out)];
      } // Advertencias reales derivadas de opciones y textos generados.
      const policies = [
        "La herramienta no solicita ni guarda contraseñas, tokens, API keys o claves privadas. Las configuraciones contienen marcadores de sustitución.",
        "En una arquitectura futura con backend, administrar secretos externamente mediante variables de entorno o un gestor de secretos.",
        "Con IA pública utilizar únicamente datos de laboratorio o de ejemplo.",
        "No suministrar credenciales, IP públicas sensibles ni topologías confidenciales a servicios públicos de IA.",
        "Validar todas las entradas antes de construir el diseño o los comandos.",
        "Revisar las configuraciones generadas antes de aplicarlas.",
        "No ejecutar automáticamente configuraciones sobre equipos reales.",
        "Modificar únicamente infraestructura autorizada.",
        "Preferir SSH a Telnet y deshabilitar servicios administrativos innecesarios.",
        "Aplicar mínimo privilegio; el usuario SSH propuesto comienza en nivel 1.",
        "Tratar la salida de IA como propuesta técnica y verificarla antes de implementar.",
      ]; // Políticas solicitadas, visibles en la aplicación.
      function securityView() {
        const warnings = securityWarnings();
        return (
          title(
            "Ciberdefensa y uso de IA",
            "Las entradas se validan y los secretos se sustituyen por marcadores. La herramienta no realiza conexiones a equipos ni envía sus datos a IA.",
          ) +
          `<div class="card"><h2>Validaciones actuales</h2>${warnings.length ? warnings.map((w) => `<div class="notice warn">${esc(w)}</div>`).join("") : '<div class="notice">Sin advertencias en los datos actuales. Esto no equivale a una auditoría de infraestructura real.</div>'}<div class="notice">No se solicitan secretos. Telnet no se habilita. Los hostnames e interfaces rechazan saltos de línea y comandos. Los textos importados se escapan antes de mostrarlos.</div></div><div class="card"><h2>Políticas de ciberdefensa y uso de IA</h2><ol>${policies.map((p) => `<li>${p}</li>`).join("")}</ol></div><div class="card"><h3>Referencias técnicas oficiales</h3><p>Plantillas genéricas para laboratorio; verificar modelo y versión antes de aplicar.</p><ul><li><a target="_blank" rel="noopener" href="https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_config-dhcp-server-xe.html">Cisco IOS XE: DHCP server</a></li><li><a target="_blank" rel="noopener" href="https://info.support.huawei.com/hedex/api/pages/EDOC1100334321/AEM1020X/06/resources/dc/dc_cfg_login_0006.html">Huawei: acceso por STelnet</a></li><li><a target="_blank" rel="noopener" href="https://www.rfc-editor.org/rfc/rfc3021">RFC 3021: redes /31 punto a punto</a></li></ul></div>`
        );
      } // Enlaces de consulta opcionales; la aplicación funciona sin red.
      function dashboard() {
        const users = state.sites.reduce((a, s) => a + s.users, 0),
          devices = state.sites.reduce(
            (a, s) => a + Object.values(counts(s)).reduce((a, v) => a + v, 0),
            0,
          ),
          routers = state.sites.reduce((a, s) => a + proposal(s).routers, 0),
          switches = state.sites.reduce(
            (a, s) =>
              a +
              proposal(s).access +
              proposal(s).distribution +
              proposal(s).core,
            0,
          ),
          ap = state.sites.reduce((a, s) => a + counts(s).ap, 0),
          warnings = securityWarnings();
        return (
          title(
            state.project.name || "Diseñe su red WAN",
            "Un proyecto conectado de extremo a extremo: requisitos por sede, segmentación, direccionamiento y propuestas de configuración.",
          ) +
          `<div class="metrics">${[
            ["Sedes", state.sites.length],
            ["Usuarios", users],
            ["Terminales estimados", devices],
            ["Routers sugeridos", routers],
            ["Switches sugeridos", switches],
            ["Access Points", ap],
            ["VLAN", state.vlans.length],
            ["Subredes", state.plan.length],
          ]
            .map(
              ([k, v]) =>
                `<div class="metric"><strong>${v}</strong><span>${k}</span></div>`,
            )
            .join(
              "",
            )}</div><div class="two"><div class="card"><h2>Estado del diseño</h2><div class="statuslist">${[
            [
              "Datos de " + (state.project.company || "la empresa"),
              !!state.project.name && !!state.project.activity,
            ],
            [
              "Direccionamiento sin solapamientos",
              state.plan.length > 0 &&
                !topologyIssues().some((x) =>
                  /Solapamiento|Gateway/.test(x.msg),
                ),
            ],
            [
              "Topología",
              state.nodes.length > 0 &&
                state.links.length > 0 &&
                !topologyIssues().some((x) => x.block),
            ],
            [
              "Cisco generado",
              Object.keys(state.configs).some((k) => k.endsWith("-Cisco")),
            ],
            [
              "Huawei generado",
              Object.keys(state.configs).some((k) => k.endsWith("-Huawei")),
            ],
          ]
            .map(
              ([k, ok]) =>
                `<div class="statusrow"><span>${esc(k)}</span>${badge(ok)}</div>`,
            )
            .join(
              "",
            )}<div class="statusrow"><span>Advertencias de seguridad</span><span class="badge warn">${warnings.length}</span></div></div><div class="actions" style="margin-top:18px"><button class="primary" onclick="go(1)">Continuar diseño →</button><button onclick="downloadReport()">Descargar resumen HTML</button><button onclick="window.print()">Imprimir / PDF</button></div></div><div class="card"><h2>Sedes del proyecto</h2>${state.sites.map((s) => `<div class="statusrow"><div><strong>${esc(s.name)}</strong><br><small>${s.users} usuarios · ${s.floors} pisos · ${proposal(s).bandwidth} Mbps sugeridos</small></div><span class="badge dim">${s.redundant ? "2 cores" : "1 core"}</span></div>`).join("")}<div class="notice">Las cantidades son estimaciones preliminares. Los equipos representativos del gráfico y los comandos generados se cuentan por separado del inventario.</div></div></div><div class="card"><h2>Ruta de trabajo</h2><div class="grid">${[
            ["01", "Levantamiento", "Usuarios y servicios por sede."],
            ["02", "Segmentación", "VLAN revisables según actividad."],
            ["03", "Plan IP", "VLSM para LAN, core y WAN."],
            ["04", "Configuración", "Mismos datos, dos fabricantes."],
          ]
            .map(
              ([n, l, d]) =>
                `<div><span class="eyebrow">${n}</span><h3>${l}</h3><p>${d}</p></div>`,
            )
            .join("")}</div></div>`
        );
      } // Resume hechos calculados, no pruebas de producción.
      function evidenceView() {
        const ci = Object.values(state.configs).some(
            (x) =>
              /hostname .+\nvlan |hostname /s.test(x.text) &&
              /interface Vlan\d/.test(x.text),
          ),
          hw = Object.values(state.configs).some(
            (x) => /sysname /.test(x.text) && /interface Vlanif/.test(x.text),
          );
        return (
          title(
            "Evidencias Corte 2",
            "Capture los resultados reales de su proyecto. El documento y los commits se verifican fuera de esta aplicación.",
          ) +
          `<div class="card"><h2>Capturas para la entrega</h2><div class="tablewrap"><table><thead><tr><th>Archivo</th><th>Qué debe verse</th><th>Abrir</th></tr></thead><tbody>${[
            [
              "01-subnetting.png",
              "IP, prefijo, red, broadcast y hosts del ejemplo o una subred del proyecto.",
              4,
            ],
            [
              "02-topologia.png",
              "Equipos, nombres, enlaces, sedes, VLAN y redes del plan.",
              5,
            ],
            [
              "03-config-cisco.png",
              "Hostname, VLAN y dirección IP. Seleccione un core para incluir SVI.",
              6,
            ],
            [
              "04-config-huawei.png",
              "Sysname, VLAN y dirección IP. Use Comparación si no tiene un core Huawei.",
              7,
            ],
            [
              "05-github-commits.png",
              "Captura directamente en GitHub con al menos cinco commits claros. No se crean ni verifican commits aquí.",
              -1,
            ],
          ]
            .map(
              ([f, d, i]) =>
                `<tr><td class="mono">${f}</td><td>${d}</td><td>${i >= 0 ? `<button onclick="go(${i})">Ver sección</button>` : "Verificar en GitHub"}</td></tr>`,
            )
            .join(
              "",
            )}</tbody></table></div></div><div class="card"><h2>Cumplimiento Corte 2</h2><div class="statuslist">${[
            [
              "Subnetting funcional — 20%",
              !!state.subnetOK,
              "Ejecute un cálculo válido.",
            ],
            [
              "Carga de topología — 15%",
              state.nodes.length > 0 && state.links.length > 0,
              "Genere o transcriba su topología.",
            ],
            [
              "Configuración Cisco + Huawei — 25%",
              ci && hw,
              "Genere ambas sintaxis con VLAN e IP.",
            ],
            [
              "Ciberdefensa aplicada — 10%",
              true,
              "Validaciones y políticas incorporadas; revisar advertencias.",
            ],
            [
              "Documento — 10%",
              false,
              "Verificación externa: no se ha comprobado ningún PDF.",
            ],
            [
              "Repositorio GitHub — 20%",
              false,
              "Verificación externa: no se ha comprobado ningún repositorio ni commits.",
            ],
          ]
            .map(
              ([label, ok, d]) =>
                `<div class="statusrow"><div>${label}<br><small>${d}</small></div>${badge(ok)}</div>`,
            )
            .join(
              "",
            )}</div><div class="notice warn">Estos indicadores no certifican la calificación. Capturas, PDF, pruebas con simulador/equipos y repositorio deben existir realmente para sustentarlos.</div></div><div class="card"><h3>Glosario para sustentar</h3><div class="grid">${Object.entries(
            {
              VLAN: "Segmento lógico de capa 2.",
              Gateway: "Salida de una subred hacia otras redes.",
              CIDR: "Prefijo /n: bits que identifican la red.",
              Broadcast:
                "Dirección para todos los hosts de una subred convencional.",
              VLSM: "Subredes de tamaños variables según capacidad requerida.",
              WAN: "Interconexión de redes entre ubicaciones.",
              Trunk: "Enlace de capa 2 que transporta varias VLAN.",
              Access: "Puerto de capa 2 asignado a una sola VLAN.",
              ISP: "Proveedor de conectividad.",
              OSPF: "Protocolo que calcula rutas usando el estado de los enlaces.",
              LACP: "Agrupa enlaces físicos en un enlace lógico.",
              HSRP_VRRP: "Gateway virtual redundante entre dos equipos.",
            },
          )
            .map(([k, v]) => `<div><strong>${k}</strong><p>${v}</p></div>`)
            .join("")}</div></div>`
        );
      } // Rúbrica: documento y GitHub siempre quedan pendientes de verificación externa.
      /* =================== Persistencia local y archivos =================== */
      function download(name, content, mime) {
        const blob = new Blob([content], { type: mime + ";charset=utf-8" }),
          url = URL.createObjectURL(blob),
          a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      } // Descargas autónomas sin backend.
      function exportJSON() {
        download(
          "WAN-proyecto.json",
          JSON.stringify({ state, imageData }, null, 2),
          "application/json",
        );
        toast(
          "Proyecto exportado. Guarde este JSON junto al HTML para transportar sus datos.",
        );
      } // Guarda el proyecto completo, con imagen opcional.
      function saveLocal() {
        safe(() => {
          localStorage.setItem(
            "WAN-Architect-v2",
            JSON.stringify({ state, imageData }),
          );
          toast("Proyecto guardado en este navegador.");
        });
      } // Los errores de cuota/file:// se comunican; JSON ofrece una copia alternativa.
      function loadLocal() {
        safe(() => {
          const raw = localStorage.getItem("WAN-Architect-v2");
          if (!raw) fail("No hay proyecto guardado en este navegador.");
          const parsed = validateImport(JSON.parse(raw));
          if (!confirm("¿Reemplazar el proyecto actual por el guardado?"))
            return;
          applyImport(parsed);
          toast("Proyecto cargado.");
        });
      } // La lectura local pasa por el mismo validador que una importación externa.
      async function importJSON(input) {
        try {
          const file = input.files[0];
          if (!file) return;
          if (file.size > 10 * 1024 * 1024)
            fail("JSON demasiado grande (máximo 10 MB).");
          const parsed = validateImport(JSON.parse(await file.text()));
          if (!confirm("¿Reemplazar el proyecto actual por este JSON?")) return;
          applyImport(parsed);
          toast("Proyecto importado y validado.");
        } catch (e) {
          toast(e.message, true);
        } finally {
          input.value = "";
        }
      } // No ejecuta datos ni acepta texto arbitrario como configuración.
      function validateImport(data) {
        if (
          !data ||
          typeof data !== "object" ||
          !data.state ||
          data.state.version !== 2
        )
          fail(
            "Formato JSON incompatible: se requiere exportación WAN Architect versión 2.",
          );
        const src = data.state,
          out = fresh();
        if (
          !src.project ||
          !Array.isArray(src.sites) ||
          src.sites.length < 1 ||
          src.sites.length > 12
        )
          fail("Proyecto o sedes inválidos.");
        const p = src.project;
        out.project = {
          name: p.name ? text(p.name, "Proyecto") : "",
          company: p.company ? text(p.company, "Empresa") : "",
          activity: p.activity ? text(p.activity, "Actividad") : "",
          type: enumVal(
            p.type,
            ["Casa", "Oficina", "Edificio", "Campus", "Varias sedes"],
            "Infraestructura",
          ),
          interconnect: bool(p.interconnect),
          segmentation: enumVal(
            p.segmentation,
            ["Servicios", "Departamentos"],
            "Segmentación",
          ),
          base: subnet(p.base).network + "/" + subnet(p.base).prefix,
          growth: num(p.growth, 0, 100, "Crecimiento"),
          dns: ipStr(ipNum(p.dns)),
        };
        out.sites = src.sites.map((s) => {
          const o = {
            id: idVal(s.id),
            name: text(s.name, "Sede"),
            floors: num(s.floors, 1, 50, "Pisos"),
            users: num(s.users, 1, 100000, "Usuarios"),
            ratio: num(s.ratio, 1, 10, "Ratio", false),
            busy: text(s.busy, "Pisos concurridos"),
            areas: text(s.areas, "Áreas", 500),
            bandwidth: num(s.bandwidth, 0, 100000, "Banda"),
            counts: null,
          };
          o.busy.split(",").forEach((n) => num(n.trim(), 1, o.floors, "Piso"));
          for (const k of [
            "wifi",
            "voip",
            "cctv",
            "printing",
            "server",
            "redundant",
          ])
            o[k] = bool(s[k]);
          if (s.counts) {
            o.counts = {};
            for (const k of countKeys)
              o.counts[k] = num(s.counts[k], 0, 1000000, k);
          }
          return o;
        });
        unique(
          out.sites.map((s) => s.id),
          "ID de sede",
        );
        unique(
          out.sites.map((s) => s.name),
          "Nombre de sede",
        );
        const hasSite = (id) => out.sites.some((s) => s.id === id);
        if (
          !Array.isArray(src.vlans) ||
          src.vlans.length > 2000 ||
          !Array.isArray(src.plan) ||
          src.plan.length > 3000 ||
          !Array.isArray(src.nodes) ||
          src.nodes.length > 500 ||
          !Array.isArray(src.links) ||
          src.links.length > 2000
        )
          fail("Listas ausentes o demasiado grandes.");
        out.vlans = src.vlans.map((v) => {
          if (!hasSite(v.site)) fail("Sede de VLAN desconocida.");
          return {
            key: idVal(v.key),
            site: v.site,
            id: num(v.id, 2, 4094, "VLAN"),
            name: text(v.name, "VLAN", 60),
            role: enumVal(v.role, roles, "Servicio"),
            hosts: num(v.hosts, 1, 1000000, "Hosts"),
            dhcp: bool(v.dhcp),
            gateway: v.gateway ? ipStr(ipNum(v.gateway)) : "",
          };
        });
        unique(
          out.vlans.map((v) => v.key),
          "Clave VLAN",
        );
        unique(
          out.vlans.map((v) => v.site + "-" + v.id),
          "VLAN por sede",
        );
        out.plan = src.plan.map((r) => {
          const kind = enumVal(r.kind, ["vlan", "transit", "wan"], "Red"),
            info = subnet(r.network + "/" + r.prefix);
          if (info.prefix > 30 || info.network !== r.network)
            fail("Red no alineada o prefijo inválido en el plan.");
          if (r.site !== "WAN" && !hasSite(r.site))
            fail("Sede de red desconocida.");
          const v = out.vlans.find((v) => v.key === r.key);
          if (kind === "vlan" && (!v || v.site !== r.site || v.id !== r.id))
            fail("Plan no coincide con VLAN.");
          if (kind !== "vlan" && info.prefix !== 30)
            fail("Tránsito debe ser /30.");
          const reserve =
            kind === "vlan"
              ? out.sites.find((s) => s.id === r.site).redundant
                ? 3
                : 1
              : 0;
          if (
            kind === "vlan" &&
            info.hosts - reserve <
              Math.ceil(v.hosts * (1 + out.project.growth / 100))
          )
            fail("Subred insuficiente para los hosts.");
          const o = {
            ...(v || {}),
            ...info,
            key: idVal(r.key),
            site: r.site,
            name: text(r.name, "Nombre red", 100),
            kind,
            hostsRequested: kind === "vlan" ? v.hosts : 2,
            available: info.hosts - reserve,
            reserve,
            gateway: kind === "vlan" ? ipStr(ipNum(r.gateway)) : "",
          };
          if (o.gateway && !isHost(o.gateway, o))
            fail("Gateway importado fuera de subred.");
          if (v && v.gateway && v.gateway !== o.gateway)
            fail("Gateway de VLAN y plan incoherentes.");
          const base = subnet(out.project.base);
          if (o.net < base.net || o.end > base.end)
            fail("Red fuera del bloque base.");
          return o;
        });
        unique(
          out.plan.map((r) => r.key),
          "Clave red",
        );
        for (let i = 0; i < out.plan.length; i++)
          for (let j = i + 1; j < out.plan.length; j++)
            if (
              out.plan[i].net <= out.plan[j].end &&
              out.plan[j].net <= out.plan[i].end
            )
              fail("Subredes importadas solapadas.");
        out.nodes = src.nodes.map((n) => {
          if (!hasSite(n.site)) fail("Sede de equipo desconocida.");
          const r = out.plan.find((r) => r.key === n.network),
            o = {
              id: idVal(n.id),
              name: hostname(n.name),
              type: enumVal(n.type, kinds, "Tipo de equipo"),
              vendor: enumVal(n.vendor, ["Cisco", "Huawei"], "Fabricante"),
              site: n.site,
              ip: n.ip ? ipStr(ipNum(n.ip)) : "",
              network: n.network ? idVal(n.network) : "",
              x: num(n.x, 0, 100000, "X", false),
              y: num(n.y, 0, 100000, "Y", false),
            };
          if (o.network && (!r || r.site !== o.site || r.kind !== "vlan"))
            fail("Red de equipo inexistente.");
          if (o.ip && (!r || !isHost(o.ip, r) || o.ip === r.gateway))
            fail("IP de equipo inválida.");
          return o;
        });
        unique(
          out.nodes.map((n) => n.id),
          "ID de equipo",
        );
        unique(
          out.nodes.map((n) => n.name),
          "Hostname",
        );
        unique(out.nodes.map((n) => n.ip).filter(Boolean), "IP de equipo");
        out.links = src.links.map((l) => {
          if (
            !out.nodes.some((n) => n.id === l.a) ||
            !out.nodes.some((n) => n.id === l.b) ||
            l.a === l.b
          )
            fail("Extremos de enlace inválidos.");
          if (
            l.network &&
            !out.plan.some((r) => r.key === l.network && r.kind !== "vlan")
          )
            fail("Red routed inválida.");
          return {
            id: idVal(l.id),
            a: l.a,
            b: l.b,
            type: enumVal(l.type, ["routed", "trunk", "access"], "Tipo enlace"),
            network: l.network ? idVal(l.network) : "",
            vlan: num(l.vlan, 0, 4094, "VLAN enlace"),
            bundle: num(l.bundle, 0, 128, "LACP"),
            ac: interfaceName(l.ac),
            bc: interfaceName(l.bc),
            ah: interfaceName(l.ah),
            bh: interfaceName(l.bh),
          };
        });
        unique(
          out.links.map((l) => l.id),
          "ID de enlace",
        );
        for (const k of Object.keys(out.opts))
          out.opts[k] = bool(src.opts?.[k]);
        if (out.opts.dhcp && out.opts.relay)
          fail("DHCP y relay no pueden estar activos simultáneamente.");
        out.relay = src.relay ? ipStr(ipNum(src.relay)) : "";
        out.staticNext = src.staticNext ? ipStr(ipNum(src.staticNext)) : "";
        out.staticReason = src.staticReason
          ? text(src.staticReason, "Justificación")
          : "";
        out.approved = bool(src.approved) && out.plan.length > 0;
        if (
          out.approved &&
          out.vlans.some((v) => !out.plan.some((r) => r.key === v.key))
        )
          fail("Faltan redes para VLAN confirmadas.");
        out.calc = src.calc ? String(src.calc) : undefined;
        if (out.calc) subnet(out.calc);
        out.subnetOK = src.subnetOK === true;
        out.revision = num(src.revision, 0, 100000000, "Revisión");
        const previous = state;
        try {
          state = out;
          for (const l of out.links)
            validateLink(
              l,
              out.links.filter((x) => x.id !== l.id),
            );
          const blocking = topologyIssues().filter((x) => x.block);
          if (blocking.length) fail(blocking[0].msg);
          if (src.configs && typeof src.configs === "object")
            for (const [key, val] of Object.entries(src.configs)) {
              const m = key.match(/^([A-Za-z0-9_-]+)-(Cisco|Huawei)$/),
                n = m ? out.nodes.find((n) => n.id === m[1]) : null;
              if (
                !n ||
                !configurable(n) ||
                typeof val.text !== "string" ||
                val.text.length > 100000 ||
                val.revision !== out.revision
              )
                continue;
              const generated = generate(n, m[2]);
              if (generated === val.text)
                out.configs[key] = { text: generated, revision: out.revision };
            }
        } finally {
          state = previous;
        }
        let img = data.imageData || "";
        if (
          typeof img !== "string" ||
          (img &&
            !/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(
              img,
            )) ||
          img.length > 7 * 1024 * 1024
        )
          fail("Imagen importada no válida.");
        return { state: out, imageData: img };
      } // Reconstruye un esquema conocido; recalcula números y comprueba texto CLI, nunca evalúa JSON.
      function enumVal(v, arr, label) {
        if (!arr.includes(v)) fail(label + " inválido.");
        return v;
      } // Listas cerradas.
      function bool(v) {
        if (typeof v !== "boolean") fail("Valor booleano inválido.");
        return v;
      } // No convierte "false" en verdadero.
      function idVal(v) {
        if (typeof v !== "string" || !/^[-A-Za-z0-9_]{1,80}$/.test(v))
          fail("Identificador inválido.");
        return v;
      } // IDs seguros para atributos y handlers.
      function unique(values, label) {
        if (new Set(values).size !== values.length) fail(label + " duplicado.");
      } // Integridad referencial.
      function applyImport(data) {
        state = data.state;
        imageData = data.imageData;
        imageMode = false;
        selectedSite = 0;
        selectedNode = "";
        page = 0;
        render();
      } // El reemplazo ocurre solo después de validación completa.
      function newProject() {
        if (
          confirm(
            "¿Crear un proyecto nuevo? Exporte o guarde el actual primero.",
          )
        ) {
          state = fresh();
          imageData = "";
          selectedSite = 0;
          page = 1;
          render();
        }
      } // No elimina la copia local ya guardada.
      function demo() {
        if (
          !confirm(
            "¿Reemplazar el proyecto por un ejemplo ficticio de laboratorio de dos sedes?",
          )
        )
          return;
        state = fresh();
        state.project = {
          ...state.project,
          name: "WAN · Laboratorio Corte 2",
          company: "Empresa de ejemplo",
          activity: "Clínica ambulatoria (laboratorio)",
          type: "Varias sedes",
        };
        state.sites = [
          {
            ...siteDefault(1),
            name: "Sede asistencial",
            floors: 3,
            users: 100,
            busy: "1,2",
            areas: "Admisiones, Enfermería, Consulta",
            voip: true,
            cctv: true,
            server: true,
            redundant: true,
          },
          {
            ...siteDefault(2),
            name: "Sede administrativa",
            floors: 2,
            users: 45,
            busy: "1",
            areas: "Sistemas, Contabilidad, Compras",
            voip: true,
            cctv: true,
          },
        ];
        selectedSite = 0;
        imageData = "";
        render();
        toast("Ejemplo cargado; datos ficticios, editables.");
      } // Nunca presenta valores de laboratorio como datos de la organización real.
      function downloadPlan() {
        const head = [
          "Sede",
          "VLAN",
          "Nombre",
          "Hosts requeridos",
          "Disponibles",
          "Red",
          "Prefijo",
          "Máscara",
          "Gateway",
          "Primera IP",
          "Última IP",
          "Broadcast",
        ];
        const cell = (x) =>
          '"' +
          String(x ?? "")
            .replace(/"/g, '""')
            .replace(/^([=+@-])/, "\t$1") +
          '"';
        const rows = state.plan.map((r) => [
          siteName(r.site),
          r.id || r.kind,
          r.name,
          r.hostsRequested,
          r.available,
          r.network,
          r.prefix,
          r.mask,
          r.gateway,
          r.first,
          r.last,
          r.broadcast,
        ]);
        download(
          "plan-direccionamiento.csv",
          "\ufeff" +
            [head, ...rows].map((r) => r.map(cell).join(";")).join("\r\n"),
          "text/csv",
        );
      } // CSV compatible con separador regional español y protección de fórmulas.
      function downloadReport() {
        const body =
          dashboard() +
          planTable() +
          `<div class="card"><h2>Topología</h2>${state.nodes.length ? svgTopology() : "No generada"}</div><div class="card"><h2>Advertencias</h2><ul>${securityWarnings()
            .map((w) => `<li>${esc(w)}</li>`)
            .join(
              "",
            )}</ul></div><div class="card"><h2>Configuraciones generadas</h2>${Object.entries(
            state.configs,
          )
            .map(
              ([k, v]) =>
                `<h3>${esc(k)}</h3><pre class="console">${esc(v.text)}</pre>`,
            )
            .join("")}</div>`;
        download(
          "WAN-resumen.html",
          '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Resumen WAN</title><style>' +
            $("view").ownerDocument.querySelector("style").textContent +
            "main{margin:0}button{display:none}</style></head><body><main>" +
            body +
            "</main></body></html>",
          "text/html",
        );
      } // Informe estático con datos reales del proyecto actual.
      render(); // Primer render: no genera topologías ni pruebas ficticias automáticamente.
    </script>
  </body>
</html>
